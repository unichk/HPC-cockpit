              <span className="nd-clock">{now.toLocaleTimeString("en-US", { hour12: false })}</span>
              <button className="icon-btn" onClick={() => setTheme(t => t === "dark" ? "light" : "dark")} title="Toggle theme">
                {theme === "dark"
                  ? <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2"/></svg>
                  : <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                }
              </button>
              <cockpitWatchdog.Button />
              <cockpitAuth.LogoutButton />
            </header>

            <div className="nd-summary">
              <div className={`nd-kpi ${cpuTone}`}>
                <div className="nd-kpi-label">CPU Usage</div>
                <div className="nd-kpi-val">{Math.round(node.cpu)}<span className="u">%</span></div>
                <div className="nd-kpi-bar"><div className="nd-kpi-bar-fill" style={{ width: `${node.cpu}%`, background: colorFor(cpuTone) }} /></div>
                <div className="nd-kpi-sub">
                  {node.cpuFreqMhz > 0
                    ? `${formatMhz(node.cpuFreqMhz)}${node.cpuGovernor ? ` · ${node.cpuGovernor}` : ""}${node.cpuCoreCount > 0 ? ` · ${node.cpuCoresOnline}/${node.cpuCoreCount} cores` : ""}`
                    : (node.cpuCoreCount > 0
                        ? `${node.cpuCoresOnline}/${node.cpuCoreCount} cores online`
                        : `Warn ${thr.cpuWarn}% · Crit ${thr.cpuHot}%`)}
                </div>
              </div>
              <div className={`nd-kpi ${memTone}`}>
                <div className="nd-kpi-label">Memory</div>
                <div className="nd-kpi-val">{node.memG.toFixed(1)}<span className="u">/{node.memTotal}G</span></div>
                <div className="nd-kpi-bar"><div className="nd-kpi-bar-fill" style={{ width: `${Math.min(100, node.memPct)}%`, background: "var(--mem)" }} /></div>
                <div className="nd-kpi-sub">{node.memPct.toFixed(0)}% used · {(node.memTotal - node.memG).toFixed(1)}G free</div>
              </div>
              <div className={`nd-kpi ${swapTone}`}>
                <div className="nd-kpi-label">Swap</div>
                <div className="nd-kpi-val">{node.swapG.toFixed(1)}<span className="u">/{node.swapTotal}G</span></div>
                <div className="nd-kpi-bar"><div className="nd-kpi-bar-fill" style={{ width: `${Math.min(100, node.swapPct)}%`, background: "var(--swap)" }} /></div>
                <div className="nd-kpi-sub">{node.swapPct.toFixed(0)}% used</div>
              </div>
              <div className="nd-kpi">
                <div className="nd-kpi-label">Load Average</div>
                <div className="nd-load-chips">
                  {["1m","5m","15m"].map((l,i) => (
                    <div className="nd-load-chip" key={l}><span>{l}</span>{node.load[i].toFixed(2)}</div>
                  ))}
                </div>
                <div className="nd-kpi-sub">From /proc/loadavg</div>
              </div>
              <div className={`nd-kpi ${tempTone}`}>
                <div className="nd-kpi-label">CPU Temp</div>
                <div className="nd-kpi-val">{Math.round(node.temp)}<span className="u">°C</span></div>
                <div className="nd-kpi-bar"><div className="nd-kpi-bar-fill" style={{ width: `${tempBarPct(node.temp, tempCrit, 45)}%`, background: colorFor(tempTone) }} /></div>
                <div className="nd-kpi-sub">Warn {tempWarn}° · Crit {tempCrit}°</div>
              </div>
              <div className={`nd-kpi ${fanTone}`}>
                <div className="nd-kpi-label">Fans</div>
                <div className="nd-kpi-val">{node.fanOk}<span className="u">/{node.fanTotal} OK</span></div>
                <div className="nd-kpi-sub">{(node.fanRpm/1000).toFixed(1)} kRPM avg{node.fanPct != null && ` (${Math.round(node.fanPct)}%)`}</div>
              </div>
              <div className={`nd-kpi power-kpi ${powTone}`}>
                <div className="nd-kpi-label">Node Power</div>
                <div className="nd-kpi-val">{Math.round(node.power)}<span className="u">W</span></div>
                <div className="nd-kpi-bar"><div className="nd-kpi-bar-fill" style={{ width:`${Math.min(100,(node.power/thr.nodePowerHot)*100)}%`, background: colorFor(powTone) }} /></div>
                <div className="nd-kpi-sub">Warn {thr.nodePowerWarn}W · Crit {thr.nodePowerHot}W</div>
              </div>
              {node.gpuCount > 0 && (
                <div className={`nd-kpi ${node.gpuPlaceholder ? "" : gpuTempTone}`}>
                  <div className="nd-kpi-label">GPU</div>
                  {node.gpuPlaceholder ? (
                    <>
                      <div className="nd-kpi-val" style={{ fontSize: 16, color: "var(--muted)", fontWeight: 700 }}>No GPU</div>
                      <div className="nd-kpi-sub">not detected on this node</div>
                    </>
                  ) : (
                    <>
                      <div className="nd-kpi-val">{Math.round(node.gpuTempMax)}<span className="u">°C</span></div>
                      <div className="nd-kpi-bar"><div className="nd-kpi-bar-fill" style={{ width: `${tempBarPct(node.gpuTempMax, gpuCrit, 30)}%`, background: colorFor(gpuTempTone) }} /></div>
                      <div className="nd-kpi-sub">
                        {node.gpuCount}× {node.gpuVendor} · {Math.round(node.gpuPowerSumW)}W · {Math.round(node.gpuUtilAvgPct)}%
                      </div>
                    </>
                  )}
                </div>
              )}
            </div>

            <div className="nd-body">
              <div className="nd-card">
                <h3>Resource Usage</h3>
                <div className="nd-bar-grid">
                  <div className="nd-bar-item">
                    <div className="nd-bar-header">
                      <span className="nd-bar-label">CPU</span>
                      <span className={`nd-bar-value ${cpuTone}`}>{Math.round(node.cpu)}<span className="u">%</span></span>
                    </div>
                    <div className="nd-bar-track"><div className="nd-bar-fill" style={{ width:`${node.cpu}%`, background: colorFor(cpuTone) }} /></div>
                    <MiniChart values={node.cpuHistory} color={colorFor(cpuTone)} height={52} yMin={0} yMax={100}
                      times={node.historyTimes} unit="%" digits={1} />
                  </div>
                  <div className="nd-bar-item">
                    <div className="nd-bar-header">
                      <span className="nd-bar-label">Memory</span>
                      <span className={`nd-bar-value ${memTone}`}>{node.memG.toFixed(1)}<span className="u">G</span></span>
                    </div>
                    <div className="nd-bar-track"><div className="nd-bar-fill" style={{ width:`${Math.min(100, node.memPct)}%`, background:"var(--mem)" }} /></div>
                    <MiniChart values={node.memHistory} color="var(--mem)" height={52} yMin={0} yMax={100}
                      times={node.historyTimes} unit="%" digits={1} />
                  </div>
                  <div className="nd-bar-item">
                    <div className="nd-bar-header">
                      <span className="nd-bar-label">Swap</span>
                      <span className={`nd-bar-value ${swapTone}`}>{node.swapG.toFixed(1)}<span className="u">G</span></span>
                    </div>
                    <div className="nd-bar-track"><div className="nd-bar-fill" style={{ width:`${Math.min(100, node.swapPct)}%`, background:"var(--swap)" }} /></div>
                    <MiniChart values={node.swapHistory} color="var(--swap)" height={52} yMin={0} yMax={100}
                      times={node.historyTimes} unit="%" digits={1} />
                  </div>
                  <div className="nd-bar-item">
                    <div className="nd-bar-header">
                      <span className="nd-bar-label">Temperature</span>
                      <span className={`nd-bar-value ${tempTone}`}>{Math.round(node.temp)}<span className="u">°C</span></span>
                    </div>
                    <div className="nd-bar-track"><div className="nd-bar-fill" style={{ width:`${Math.min(100,node.temp)}%`, background: colorFor(tempTone) }} /></div>
                    <MiniChart values={node.tempHistory} color={colorFor(tempTone)} height={52}
                      yMin={45} yMax={tempCrit + 5} times={node.historyTimes} unit="°C" />
                  </div>
                </div>
              </div>

              <div className="nd-card nd-card-fill">
                <h3>Power Draw</h3>
                <div className="nd-power-grid">
                  <div className="nd-power-left">
                    <div style={{ marginBottom: 10 }}>
                      <div className="nd-bar-header">
                        <span className="nd-bar-label">Node Power</span>
                        <span className={`nd-bar-value ${powTone}`} style={{ fontSize: 22 }}>{Math.round(node.power)}<span className="u">W</span></span>
                      </div>
                      <div className="nd-bar-track" style={{ height: 7, marginTop: 6 }}>
                        <div className="nd-bar-fill" style={{ width:`${Math.min(100,(node.power/thr.nodePowerHot)*100)}%`, background: colorFor(powTone) }} />
                      </div>
                    </div>
                    {/* Fixed 0..crit+100 W scale, so the trace height is
                        comparable over time and between nodes rather than
                        auto-fitting to whatever the last 60 samples spanned.
                        The axis top value is therefore the crit level + 100. */}
                    <MiniChart values={node.powerHistory.map(v => v * 10)} color={colorFor(powTone)}
                      height={80} fill yMin={0} yMax={thr.nodePowerHot + 100}
                      times={node.historyTimes} unit="W" />
                  </div>
                  {/* Power breakdown: everything we can actually measure,
                      plus the shortfall against the node total. The gap is
                      real and large -- fans, DIMMs, drives and PSU conversion
                      loss are not individually instrumented on this chassis --
                      so it is shown explicitly rather than hidden by
                      normalising the parts to 100%. */}
                  <div>
                    <div className="nd-pb-title">Breakdown</div>
                    {(() => {
                      const total = node.power || 0;
                      const parts = [];
                      (node.cpuSockets || []).forEach((w, i) => {
                        if (w > 0) parts.push({ name: `CPU ${i}`, w });
                      });
                      if (node.gpuCount > 0 && node.gpuPowerSumW > 0) {
                        parts.push({ name: `GPUs (${node.gpuCount})`, w: node.gpuPowerSumW });
                      }
                      if (node.dimmPowerW > 0) {
                        parts.push({ name: `DIMMs (${node.dimmCount})`, w: node.dimmPowerW });
                      }
                      const measured = parts.reduce((a, p) => a + p.w, 0);
                      const gap = total - measured;
                      if (parts.length === 0) {
                        return <div className="nd-pb-gap">No component power reported.</div>;
                      }
                      const pct = w => (total > 0 ? (w / total) * 100 : 0);
                      const row = (name, w, muted) => (
                        <div className="nd-pb-row" key={name}>
                          <span className="nd-pb-name" style={muted ? { color: "var(--muted)" } : undefined}>{name}</span>
                          <span>
                            <span className="nd-pb-val" style={muted ? { color: "var(--muted)" } : undefined}>{Math.round(w)}<span className="nd-pb-pct">W</span></span>
                            <span className="nd-pb-pct"> · {pct(w).toFixed(0)}%</span>
                          </span>
                        </div>
                      );
                      return (
                        <>
                          {parts.map(p => row(p.name, p.w, false))}
                          {row("Others", Math.max(0, gap), true)}
                          <div className="nd-pb-sep" />
                          <div className="nd-pb-row">
                            <span className="nd-pb-name">Node total</span>
                            <span><span className="nd-pb-val">{Math.round(total)}<span className="nd-pb-pct">W</span></span></span>
                          </div>
                        </>
                      );
                    })()}
                  </div>
                </div>
              </div>

              <div className="nd-card">
                <h3>Thermal Sensors</h3>
                {(() => {
                  const therm = thermByName;

                  // One panel per thermal domain the worker reports, in a fixed
                  // 2x4 order so the layout does not reflow as sensors come and
                  // go. `key` is the metric-name prefix: the worker emits
                  // <key>_max_c / <key>_count / <key>_warn_c / <key>_crit_c for
                  // each. chipset is the exception -- it is a single sensor and
                  // keeps the historical name chipset_c.
                  // One cell per CPU package. The socket count is whatever the
                  // worker reports -- it emits cpu_package<N>_c per socket --
                  // so a 1-, 2-, 4- or 8-socket machine all render correctly.
                  // Sorted numerically, not lexically, so socket 10 does not
                  // land between 1 and 2 on a large system.
                  // One cell per <stem><N>_c the worker reports, each scored
                  // against its own limits rather than the domain's. Cells show
                  // only the reading; the sensor's identity and what it measures
                  // live in the hover card, because the worker sends numeric
                  // metrics only and cannot ship the BMC's sensor names.
                  //
                  // `width` picks the cell size: "wide" for domains with a
                  // couple of sensors that read better side by side (CPU
                  // sockets, NVMe groups), "full" for a lone sensor that should
                  // own the whole panel, "tri"/"penta" for three or five
                  // across, and the default 4-across grid for anything denser.
                  // Indices are discovered from the data and sorted
                  // numerically, so no sensor count is baked in anywhere.
                  // The per-domain layouts below assume this chassis's sensor
                  // counts, but another node can report a different number --
                  // ntu-scc02 exposes 9 NIC sensors where ntu-scc01 has 1. A
                  // layout is therefore a *preference* that degrades when the
                  // count does not fit it: nine cells in the single-column
                  // "full" layout would stack full-width and, because the panel
                  // grid uses grid-auto-rows:1fr, drag every other panel's
                  // height along with it.
                  const layoutFor = (pref, n) => {
                    if (pref === "full")  return n <= 1 ? "full" : n <= 2 ? "wide" : "compact";
                    if (pref === "wide")  return n <= 3 ? "wide" : "compact";
                    if (pref === "tri")   return (n <= 3 || n % 3 === 0) ? "tri" : "compact";
                    if (pref === "penta") return n === 5 ? "penta" : "compact";
                    return "compact";
                  };

                  const renderZones = (stem, nameFor, descFor, width) => ({ therm, warn, crit }) => {
                    const re = new RegExp(`^${stem}(\\d+)_c$`);
                    const idxs = Object.keys(therm)
                      .map(k => { const m = k.match(re); return m ? parseInt(m[1], 10) : null; })
                      .filter(i => i !== null)
                      .sort((a, b) => a - b);

                    // Decided from the real count, so it must come after idxs.
                    // The empty case still renders one cell, hence the || 1.
                    const layout = layoutFor(width, idxs.length || 1);
                    const wide = layout === "wide" || layout === "full";
                    const gridCls = layout === "full" ? "nd-full-grid"
                                  : layout === "tri" ? "nd-tri-grid"
                                  : layout === "penta" ? "nd-penta-grid"
                                  : wide ? "nd-cpu-grid" : "nd-zone-grid";
                    const cellCls = wide ? "nd-cpu-cell" : "nd-zone-cell";
                    const valCls  = wide ? "nd-cpu-val"  : "nd-zone-val";
                    const cell = (key, v, w, c, name, desc, edge) => {
                      const t = (typeof c === "number" && v >= c) ? "crit"
                              : (typeof w === "number" && v >= w) ? "warn"
                              : "";
                      return (
                        <div key={key} className={`${cellCls} nd-tip ${edge || ""} ${t}`}>
                          <span className={valCls}>{Math.round(v)}<span className="u">°C</span></span>
                          <span className="nd-tip-pop">
                            <span className="nd-tip-name">{name}</span>
                            <span className="nd-tip-desc">{desc}</span>
                          </span>
                        </div>
                      );
                    };

                    if (idxs.length === 0) {
                      // A worker predating per-sensor metrics publishes only the
                      // domain maximum. Render that as a single cell so the panel
                      // still carries its reading instead of looking broken.
                      const mv = therm[`${stem}_max_c`];
                      if (typeof mv !== "number") return "no readings";
                      return (
                        <div className={gridCls}>
                          {cell("max", mv, warn, crit, "Domain maximum",
                                "Hottest sensor only \u2014 this worker does not report per-sensor values.")}
                        </div>
                      );
                    }

                    // Columns per row, so the first and last of each row can
                    // anchor their popover inward instead of overhanging.
                    const cols = layout === "tri" ? 3
                               : layout === "penta" ? 5
                               : wide ? idxs.length
                               : 4;
                    const edgeOf = n => cols < 2 ? ""
                                      : n % cols === 0 ? "tip-start"
                                      : n % cols === cols - 1 ? "tip-end"
                                      : "";
                    return (
                      <div className={gridCls}>
                        {idxs.map((i, n) => cell(i, therm[`${stem}${i}_c`],
                          // A sensor only publishes its own limits when they
                          // differ from the domain pair, so fall back to the
                          // domain's rather than treating absence as unknown.
                          therm[`${stem}${i}_warn_c`] ?? warn,
                          therm[`${stem}${i}_crit_c`] ?? crit,
                          nameFor(i, idxs.length, therm), descFor(i, idxs.length, therm),
                          edgeOf(n)))}
                      </div>
                    );
                  };

                  const DOMAINS = [
                    { key: "cpu",     label: "CPU",     valueKey: "cpu_package_max_c",
                      render: renderZones("cpu_package",
                        i => `CPU${i}`,
                        i => `Processor package temperature, socket ${i}.`, "wide") },
                    { key: "dimm",    label: "DIMM",    render: renderZones("dimm",
                        i => `Channel ${i}`,
                        i => `Memory channel ${i}, read from the DIMM's own sensor through the CPU. Sockets run in order, so the first half is socket 0.`) },
                    { key: "nvme",    label: "NVMe",    render: renderZones("nvme",
                        i => `Drive ${i}`,
                        i => `NVMe drive ${i} composite temperature, read from the drive's own sensor with its own critical limit. One cell per drive, not a backplane group.`, "wide") },
                    // Driver codes mirror NicDriverCode() in thermal_collector.cpp.
                    // mlx5 covers ConnectX-4..7 and the driver name cannot tell
                    // the generation apart, so the label stops at "ConnectX".
                    { key: "nic",     label: "NIC",     render: renderZones("nic",
                        (i, n, t) => {
                          const code = (t[`nic${i}_driver_code`] | 0);
                          if (code === 2) return `ConnectX ${i}`;
                          if (code === 1) return "Onboard NIC";
                          return n > 1 ? `NIC ${i}` : "Network controller";
                        },
                        (i, n, t) => {
                          const code = (t[`nic${i}_driver_code`] | 0);
                          if (code === 2) return "Mellanox/NVIDIA ConnectX (mlx5). A dual-port card reports the same die temperature on both ports, so cards appear as pairs.";
                          if (code === 1) return "Onboard Intel 1GbE controller (igb).";
                          if (code === 3) return "Intel 10/100GbE controller (ixgbe/ice).";
                          if (code === 4) return "Broadcom NetXtreme controller (bnxt).";
                          return "Network controller, read in-band from the kernel \u2014 the BMC exposes no network sensor.";
                        }, "full") },
                    { key: "psu",     label: "PSU",     render: renderZones("psu",
                        i => `PSU ${i + 1}`,
                        i => `Power supply ${i + 1} internal hotspot \u2014 rises with the current it delivers.`) },
                    // 6 regulators as 2 sockets x 3 rails. The BMC lists them
                    // P0 SOC/CORE/VDDIO then P1 SOC/CORE/VDDIO, so a 3-column
                    // grid in index order puts a socket on each row and a rail
                    // in each column. NOTE: that mapping is inferred from this
                    // board's SDR ordering -- the worker sends numeric indices
                    // only, so a board enumerating its rails differently would
                    // be mislabelled here.
                    { key: "vr",      label: "VR",      render: renderZones("vr",
                        i => `P${Math.floor(i / 3)} ${["SOC", "CORE", "VDDIO"][i % 3]}`,
                        i => [
                          "SoC / IOD rail \u2014 Infinity Fabric, memory controllers, PCIe root complexes.",
                          "Main Vcore regulator \u2014 highest current on the board; climbs fastest under load.",
                          "Memory I/O rail regulator.",
                        ][i % 3], "tri") },
                    // Five sensors measuring three different kinds of thing:
                    // two ambient-air probes, the drive backplane (the machine's
                    // best proxy for intake air, and the only sensor limited to
                    // 55/60), and two host-interface-card controllers that idle
                    // near 65 C against a 105/110 ceiling. Same caveat as VR:
                    // the names come from this board's SDR ordering, since the
                    // worker publishes numeric indices only.
                    { key: "board",   label: "Board",   render: renderZones("board",
                        i => ["M.2 air 1", "M.2 air 2", "Backplane", "HIC 0", "HIC 1"][i] ?? `Board ${i}`,
                        i => [
                          "Ambient air at the M.2 slots \u2014 internal air, not a component.",
                          "Ambient air, second M.2 area.",
                          "Drive backplane board \u2014 the closest thing to an intake air reading.",
                          "Host interface card controller on the PCIe / GPU interconnect path.",
                          "Second host interface card controller.",
                        ][i] ?? "Chassis or board sensor.", "penta") },
                    { key: "chipset", label: "Chipset", valueKey: "chipset_c" },
                  ];

                  return (
                    <div className="nd-therm-grid">
                      {DOMAINS.map(d => {
                        const val = therm[d.valueKey ?? `${d.key}_max_c`];
                        const count = therm[`${d.key}_count`];
                        const warn = therm[`${d.key}_warn_c`];
                        const crit = therm[`${d.key}_crit_c`];
                        const present = typeof val === "number";
                        const tone = !present ? ""
                          : (typeof crit === "number" && val >= crit) ? "crit"
                          : (typeof warn === "number" && val >= warn) ? "warn"
                          : "";
                        return (
                          <div key={d.key} className={`nd-therm-panel ${present ? tone : "absent"}`}>
                            <div className="nd-therm-head">
                              <span className="nd-therm-name">{d.label}</span>
                              <span className="nd-therm-meta">
                                {present
                                  ? `${typeof count === "number" ? `${count | 0} sensor${(count | 0) === 1 ? "" : "s"} \u00b7 ` : ""}${typeof warn === "number" ? `warn ${warn}` : ""}${typeof crit === "number" ? ` / crit ${crit}` : ""}`
                                  : "no sensor"}
                              </span>
                            </div>
                            <div className={`nd-therm-slot ${present && d.render ? "filled" : ""}`}>
                              {!present
                                ? "not present on this board"
                                : d.render
                                  ? d.render({ therm, warn, crit })
                                  : "visualization pending"}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })()}
              </div>

              <div className="nd-card">
                <h3>Fan Status</h3>
                <div style={{ display:"flex", gap:16, marginBottom:14, flexWrap:"wrap" }}>
                  {[
                    { label:"Total fans", val: node.fanTotal || 0 },
                    { label:"Fans OK",    val: node.fanOk || 0 },
                    { label:"Avg RPM",    val: `${(node.fanRpm || 0).toFixed(0)}${node.fanPct != null ? ` (${Math.round(node.fanPct)}%)` : ""}` },
                    { label:"OK Ratio",   val: `${(fanRatio*100).toFixed(0)}%` },
                  ].map(s => (
                    <div key={s.label} style={{ flex:1, minWidth:80, padding:"8px 12px", borderRadius:8, background:"var(--surface-2)", border:"1px solid var(--line)" }}>
                      <div style={{ fontSize:9, letterSpacing:"0.08em", textTransform:"uppercase", color:"var(--muted)", fontWeight:700 }}>{s.label}</div>
                      <div style={{ fontSize:18, fontWeight:800, color:"var(--ink)", fontVariantNumeric:"tabular-nums" }}>{s.val}</div>
                    </div>
                  ))}
                </div>
                <div className="nd-fan-grid">
                  {(node.perFan.length > 0 ? node.perFan : Array.from({ length: Math.max(0, node.fanTotal|0) }).map((_, i) => ({ name: `fan_${i+1}`, rpm: 0 })))
                    .map((f, i) => {
                      const ok = f.rpm > 0;
                      const label = (f.name || "").replace(/_rpm$/, "").toUpperCase();
                      return (
                        <div key={f.name + i} className={`nd-fan-chip ${ok ? "ok" : "fail"}`}>
                          <div className="nd-fan-label">{label || `FAN${i+1}`}</div>
                          <div style={{ fontSize: 13, fontWeight: 800, fontVariantNumeric: "tabular-nums" }}>
                            {ok ? `${(f.rpm/1000).toFixed(1)}k` : "FAIL"}
                          </div>
                          <div style={{ fontSize: 8, opacity: 0.7, fontWeight: 600 }}>RPM{ok && f.pct != null && ` · ${Math.round(f.pct)}%`}</div>
                        </div>
                      );
                    })
                  }
                </div>
              </div>

              {node.gpuCount > 0 && node.gpuPlaceholder && (
                <div className="nd-card full">
                  <h3>GPUs</h3>
                  <div style={{ padding: "14px 16px", borderRadius: 8, background: "var(--surface-2)", border: "1px dashed var(--line)", color: "var(--muted)", fontSize: 13, lineHeight: 1.5 }}>
                    <div style={{ fontWeight: 700, color: "var(--ink)", marginBottom: 4 }}>No GPU available on this node.</div>
                    This card is rendered as a placeholder for UI tuning. Once a GPU is detected by the worker (AMD <code>rocm-smi</code> or NVIDIA <code>nvidia-smi</code>), per-GPU stats will appear here. Disable via <code>?fakegpu=0</code> or set <code>FAKE_GPU_DEFAULT_COUNT = 0</code> in <code>live-data.js</code>.
                  </div>
                </div>
              )}
              {node.gpuCount > 0 && !node.gpuPlaceholder && (
                <div className="nd-card full">
                  <h3>GPUs</h3>
                  <div style={{ display:"flex", gap:16, marginBottom:14, flexWrap:"wrap" }}>
                    {[
                      { label:"Count",        val: node.gpuCount },
                      { label:"Vendor",       val: (node.gpuVendor || "unknown").toUpperCase() },
                      { label:"Max temp",     val: `${Math.round(node.gpuTempMax)}°C` },
                      { label:"Total power",  val: `${Math.round(node.gpuPowerSumW)}W` },
                      { label:"Avg util",     val: `${Math.round(node.gpuUtilAvgPct)}%` },
                    ].map(s => (
                      <div key={s.label} style={{ flex:1, minWidth:80, padding:"8px 12px", borderRadius:8, background:"var(--surface-2)", border:"1px solid var(--line)" }}>
                        <div style={{ fontSize:9, letterSpacing:"0.08em", textTransform:"uppercase", color:"var(--muted)", fontWeight:700 }}>{s.label}</div>
                        <div style={{ fontSize:18, fontWeight:800, color:"var(--ink)", fontVariantNumeric:"tabular-nums" }}>{s.val}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{ overflowX:"auto" }}>
                    <table className="nd-metrics-table">
                      <thead>
                        <tr>
                          <th>#</th><th>Vendor</th><th>Temp</th><th>Util</th>
                          <th>Power</th><th>Cap</th><th>VRAM</th><th>Clock</th>
                        </tr>
                      </thead>
                      <tbody>
                        {(node.gpus || []).map(g => (
                          <tr key={g.idx}>
                            <td><span className="nd-module-badge">GPU{g.idx}</span></td>
                            <td><span className="nd-metric-name">{(g.vendor || "unknown").toUpperCase()}</span></td>
                            <td><span className="nd-metric-val">{g.tempC > 0 ? Math.round(g.tempC) : "—"}</span> <span className="nd-metric-unit">{g.tempC > 0 ? "°C" : ""}</span></td>
                            <td><span className="nd-metric-val">{g.utilPct > 0 ? Math.round(g.utilPct) : "—"}</span> <span className="nd-metric-unit">{g.utilPct > 0 ? "%" : ""}</span></td>
                            <td><span className="nd-metric-val">{g.powerW > 0 ? Math.round(g.powerW) : "—"}</span> <span className="nd-metric-unit">{g.powerW > 0 ? "W" : ""}</span></td>
                            <td><span className="nd-metric-val">{g.powerCapW > 0 ? Math.round(g.powerCapW) : "—"}</span> <span className="nd-metric-unit">{g.powerCapW > 0 ? "W" : ""}</span></td>
                            <td><span className="nd-metric-val">{g.memTotalMb > 0 ? `${Math.round((g.memUsedMb||0)/1024)}/${Math.round(g.memTotalMb/1024)}` : "—"}</span> <span className="nd-metric-unit">{g.memTotalMb > 0 ? "GiB" : ""}</span></td>
                            <td><span className="nd-metric-val">{g.clockMhz > 0 ? Math.round(g.clockMhz) : "—"}</span> <span className="nd-metric-unit">{g.clockMhz > 0 ? "MHz" : ""}</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              <div className="nd-card full">
                <h3>Control Panel</h3>
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
                  {controlActions.map((a,i) => (
                    <button key={i} onClick={a.onClick || (()=>alert(`[Placeholder] ${a.label}`))} style={{
                      display:"flex",flexDirection:"column",alignItems:"flex-start",
                      gap:4,padding:"12px 14px",borderRadius:10,
                      border:`1px solid color-mix(in oklab, ${a.color} 25%, var(--line))`,
                      background:`color-mix(in oklab, ${a.color} 7%, var(--surface-2))`,
                      cursor:"pointer",textAlign:"left",fontFamily:"var(--font)",
                      transition:"all 150ms",
                    }}>
                      <span style={{fontSize:18,lineHeight:1}}>{a.icon}</span>
                      <span style={{fontSize:11,fontWeight:800,color:a.color}}>{a.label}</span>
                    </button>
                  ))}
                </div>
              </div>

              <div className="nd-card full">
                <h3>
                  Raw Metrics
                  <span style={{ fontSize:10, color:"var(--muted)", fontWeight:600, textTransform:"none", letterSpacing:0, marginLeft:4 }}>
                    {rawRows.length} entries · updated {tsText}
                  </span>
                </h3>
                <div style={{ overflowX:"auto" }}>
                  <table className="nd-metrics-table">
                    <thead>
                      <tr>
                        <th><button style={{ background:"none",border:"none",cursor:"pointer",font:"inherit",color:"inherit",padding:0 }} onClick={() => setSortAsc(a => !a)}>Module {sortAsc ? "↑" : "↓"}</button></th>
                        <th>Metric</th>
                        <th>Value</th>
                        <th>Unit</th>
                      </tr>
                    </thead>
                    <tbody>
                      {sortedMetrics.map((r, i) => (
                        <tr key={`${r.module}-${r.name}-${i}`}>
                          <td><span className="nd-module-badge">{r.module}</span></td>
                          <td><span className="nd-metric-name">{r.name}</span></td>
                          <td><span className="nd-metric-val">{formatMetricValue(r.value, r.name, r.unit)}</span></td>
                          <td><span className="nd-metric-unit">{displayUnit(r.unit)}</span></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <footer className="nd-footer">
              <span>Node <strong>{node.id}</strong><span className="dot-sep">·</span>{node.ip}<span className="dot-sep">·</span>Live data refresh 1.5s</span>
              <span>HPC Cockpit<span className="dot-sep">·</span>NTU</span>
            </footer>

            {shellOpen && <ShellModal nodeId={node.id} onClose={() => setShellOpen(false)} />}
            {freqOpen && <FreqModal nodeId={node.id} node={node} onClose={() => setFreqOpen(false)} />}
            {fanOpen && <FanModal nodeId={node.id} node={node} onClose={() => setFanOpen(false)} />}
            {gpuOpen && <GpuModal nodeId={node.id} node={node} onClose={() => setGpuOpen(false)} />}
            {coresOpen && <CoreToggleModal nodeId={node.id} node={node} onClose={() => setCoresOpen(false)} />}
            {pcieOpen && <PcieModal nodeId={node.id} onClose={() => setPcieOpen(false)} />}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<NodeDetailPage />);
    </script>
  </body>
</html>

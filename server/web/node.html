<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Node Detail — HPC Cockpit</title>
    <link rel="icon" type="image/png" href="assets/hpc-cockpit-icon.png" />
    <link rel="stylesheet" href="vendor/fonts.css" />
    <link rel="stylesheet" href="styles.css?v=6" />
    <style>
      .nd-layout { display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; padding: 8px 10px 6px; gap: 8px; }
      .nd-topbar { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 8px 14px; box-shadow: var(--shadow-sm); }
      .nd-back { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--accent); text-decoration: none; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--accent-soft); transition: all 150ms; flex-shrink: 0; }
      .nd-back:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
      .nd-node-name { font-size: 18px; font-weight: 800; font-family: var(--mono); letter-spacing: -0.02em; color: var(--ink); }
      .nd-node-ip { font-size: 11px; color: var(--muted); font-family: var(--mono); }
      .nd-spacer { flex: 1; }
      .nd-clock { font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }

      .nd-summary { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
      .nd-kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow-sm); }
      .nd-kpi.warn { border-color: color-mix(in oklab, var(--warn) 40%, var(--line)); background: color-mix(in oklab, var(--warn) 6%, var(--surface)); }
      .nd-kpi.crit { border-color: color-mix(in oklab, var(--crit) 40%, var(--line)); background: color-mix(in oklab, var(--crit) 6%, var(--surface)); }
      .nd-kpi-label { font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
      .nd-kpi-val { font-size: 24px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; display: flex; align-items: baseline; gap: 2px; }
      .nd-kpi-val .u { font-size: 12px; font-weight: 600; color: var(--muted); }
      .nd-kpi.warn .nd-kpi-val { color: var(--warn); }
      .nd-kpi.crit .nd-kpi-val { color: var(--crit); }
      .nd-kpi-sub { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; }
      .nd-kpi-bar { height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }
      .nd-kpi-bar-fill { height: 100%; border-radius: 999px; transition: width 400ms ease; }
      .nd-kpi.power-kpi .nd-kpi-val { font-size: 28px; }

      .nd-load-chips { display: flex; gap: 4px; }
      .nd-load-chip { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 4px; border-radius: 6px; background: var(--accent-soft); font-size: 11px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
      .nd-load-chip span { font-size: 7.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }

      .nd-body { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto; gap: 10px; }

      .nd-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-sm); }
      .nd-card.full { grid-column: 1 / -1; }
      .nd-card h3 { margin: 0 0 14px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 8px; }
      .nd-card h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }

      .nd-bar-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .nd-bar-item { display: flex; flex-direction: column; gap: 6px; }
      .nd-bar-header { display: flex; justify-content: space-between; align-items: baseline; }
      .nd-bar-label { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
      .nd-bar-value { font-size: 15px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
      .nd-bar-value .u { font-size: 9px; font-weight: 600; color: var(--muted); }
      .nd-bar-value.warn { color: var(--warn); }
      .nd-bar-value.crit { color: var(--crit); }
      .nd-bar-track { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; position: relative; }
      .nd-bar-fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; transition: width 400ms ease; }

      .nd-chart { width: 100%; overflow: hidden; }
      .nd-chart svg { display: block; width: 100%; }

      .nd-fan-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
      .nd-fan-chip { padding: 6px 4px; border-radius: 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 700; border: 1px solid var(--line); }
      .nd-fan-chip.ok { background: color-mix(in oklab, var(--ok) 12%, var(--surface-2)); color: var(--ok); border-color: color-mix(in oklab, var(--ok) 25%, var(--line)); }
      .nd-fan-chip.fail { background: color-mix(in oklab, var(--crit) 12%, var(--surface-2)); color: var(--crit); border-color: color-mix(in oklab, var(--crit) 25%, var(--line)); }
      .nd-fan-label { font-size: 8px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; opacity: 0.7; }

      .nd-metrics-table { width: 100%; border-collapse: collapse; font-size: 12px; }
      .nd-metrics-table th { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 6px 10px; text-align: left; border-bottom: 2px solid var(--line); }
      .nd-metrics-table td { padding: 6px 10px; border-bottom: 1px solid var(--line-2); font-variant-numeric: tabular-nums; vertical-align: middle; }
      .nd-metrics-table tr:last-child td { border-bottom: none; }
      .nd-metrics-table tr:hover td { background: var(--accent-soft); }
      .nd-module-badge { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 10px; font-weight: 700; }
      .nd-metric-name { font-weight: 600; color: var(--ink); }
      .nd-metric-val { font-weight: 800; color: var(--ink); }
      .nd-metric-unit { color: var(--muted); font-size: 10px; font-weight: 500; }

      .nd-footer { font-size: 10.5px; color: var(--muted); padding: 2px 6px; display: flex; justify-content: space-between; }
      .nd-footer strong { color: var(--ink); font-weight: 700; }
      .nd-footer .dot-sep { margin: 0 5px; opacity: 0.4; }

      @media (max-width: 900px) {
        .nd-summary { grid-template-columns: repeat(4, 1fr); }
        .nd-body { grid-template-columns: 1fr; }
        .nd-fan-grid { grid-template-columns: repeat(4, 1fr); }
      }

      .nd-modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); z-index: 500; display: flex; align-items: center; justify-content: center; }
      .nd-modal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); width: 760px; max-width: calc(100vw - 32px); height: 580px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: var(--shadow-md); overflow: hidden; }
      .nd-modal-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; background: var(--surface-2); }
      .nd-modal-title { font-size: 13px; font-weight: 800; color: var(--ink); font-family: var(--mono); letter-spacing: -0.01em; }
      .nd-modal-warn { font-size: 10px; color: var(--crit); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
      .nd-modal-close { margin-left: auto; background: none; border: 1px solid var(--line); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; font-size: 14px; color: var(--muted); display: flex; align-items: center; justify-content: center; }
      .nd-modal-close:hover { background: var(--accent-soft); color: var(--ink); }
      .nd-shell-log { flex: 1; overflow: auto; padding: 12px 14px; background: var(--surface-2); font-family: var(--mono); font-size: 12px; line-height: 1.45; color: var(--ink); white-space: pre-wrap; word-break: break-all; }
      .nd-shell-log .prompt { color: var(--accent); font-weight: 700; }
      .nd-shell-log .out { color: var(--ink); }
      .nd-shell-log .err { color: var(--crit); }
      .nd-shell-log .meta { color: var(--muted); font-size: 11px; font-weight: 600; }
      .nd-shell-log .meta.ok { color: var(--ok); }
      .nd-shell-log .meta.bad { color: var(--crit); }
      .nd-shell-log .blk { margin-bottom: 10px; }
      .nd-shell-tokenrow { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--surface); font-size: 12px; }
      .nd-shell-tokenrow input { flex: 1; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; font-family: var(--mono); font-size: 12px; background: var(--surface-2); color: var(--ink); }
      .nd-shell-tokenrow button { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; font-size: 12px; }
      .nd-shell-tokenrow .lbl { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; min-width: 48px; }
      .nd-shell-tokenrow .change { color: var(--accent); cursor: pointer; font-weight: 700; font-size: 11px; }
      .nd-shell-cmdrow { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--surface); }
      .nd-shell-cmdrow input { flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font-family: var(--mono); font-size: 13px; background: var(--surface-2); color: var(--ink); }
      .nd-shell-cmdrow input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
      .nd-shell-cmdrow button { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-weight: 800; cursor: pointer; font-size: 12px; letter-spacing: 0.04em; }
      .nd-shell-cmdrow button.ghost { background: transparent; color: var(--muted); border-color: var(--line); font-weight: 700; }
      .nd-shell-cmdrow button.ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--muted); }
      .nd-shell-cmdrow button:disabled { opacity: 0.5; cursor: not-allowed; }
      .nd-freq-btn { padding: 7px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-weight: 800; cursor: pointer; font-size: 12px; letter-spacing: 0.04em; font-family: var(--font); }
      .nd-freq-btn:hover:not(:disabled) { filter: brightness(1.08); }
      .nd-freq-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .nd-freq-preset { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); cursor: pointer; font-family: var(--mono); font-size: 12px; font-weight: 600; }
      .nd-freq-preset:hover { border-color: var(--accent); color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="vendor/react.development.js"></script>
    <script src="vendor/react-dom.development.js"></script>
    <script src="vendor/babel.min.js"></script>
    <script src="live-data.js?v=8"></script>
    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;
      const THR = window.DEFAULT_THRESHOLDS;
      const tone = (v, warn, crit) => v >= crit ? "crit" : v >= warn ? "warn" : "";
      const formatMhz = (mhz) => mhz >= 1000 ? `${(mhz / 1000).toFixed(2)} GHz` : `${Math.round(mhz)} MHz`;

      function useClock() {
        const [now, setNow] = useState(new Date());
        useEffect(() => { const t = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(t); }, []);
        return now;
      }

      function MiniChart({ values, color = "var(--accent)", height = 56 }) {
        if (!values || values.length < 2) return null;
        const W = 600, H = height * 3;
        const mn = Math.min(...values), mx = Math.max(...values);
        const rng = Math.max(1, mx - mn);
        const pad = 6;
        const pts = values.map((v, i) => {
          const x = pad + (i / (values.length - 1)) * (W - pad * 2);
          const y = H - pad - ((v - mn) / rng) * (H - pad * 2);
          return [x, y];
        });
        const line = pts.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ");
        const area = `${line} L${pts[pts.length-1][0]},${H} L${pts[0][0]},${H} Z`;
        const gradId = `g${Math.abs(color.split("").reduce((a,c)=>a+c.charCodeAt(0),0))}`;
        return (
          <div className="nd-chart">
            <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{ height }}>
              <defs>
                <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor={color} stopOpacity="0.25" />
                  <stop offset="100%" stopColor={color} stopOpacity="0.02" />
                </linearGradient>
              </defs>
              <path d={area} fill={`url(#${gradId})`} />
              <path d={line} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
              <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="4" fill={color} />
            </svg>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:9, color:"var(--muted)", marginTop:2, fontVariantNumeric:"tabular-nums" }}>
              <span>{mn.toFixed(0)}</span><span>{mx.toFixed(0)}</span>
            </div>
          </div>
        );
      }

      function formatMetricValue(value, name, unit) {
        if (typeof value !== "number") return String(value);
        if (unit === "kb") return (value / 1024).toFixed(1);
        if (unit === "percent" || name.endsWith("_pct")) return value.toFixed(1);
        if (unit === "bool" || unit === "level" || unit === "count") return value.toFixed(0);
        if (unit === "rpm" || unit === "watt") return value.toFixed(0);
        if (unit === "celsius") return value.toFixed(1);
        return value.toFixed(3).replace(/\.?0+$/, "");
      }

      function displayUnit(unit) {
        switch (unit) {
          case "kb": return "MiB";
          case "percent": return "%";
          case "celsius": return "°C";
          case "watt": return "W";
          case "rpm": return "RPM";
          case "bool": return "";
          case "level": return "";
          case "count": return "";
          case "ratio": return "";
          default: return unit || "";
        }
      }

      function readSettings() {
        try { return JSON.parse(localStorage.getItem("cockpit_settings_v1")) || {}; } catch { return {}; }
      }
      function writeSettings(patch) {
        const current = readSettings();
        const next = { ...current, ...patch };
        try { localStorage.setItem("cockpit_settings_v1", JSON.stringify(next)); } catch {}
        // Mirror to server so the change survives a localStorage clear / new browser.
        if (window.saveSettings) window.saveSettings(next);
        return next;
      }
      function readThemeFromSettings() {
        return readSettings().theme || "light";
      }
      function readThresholdsFromSettings() {
        const s = readSettings();
        if (s && s.alerts) return { ...THR, ...s.alerts };
        return THR;
      }

      function ShellModal({ nodeId, onClose }) {
        const { useRef } = React;
        const [token, setToken] = useState(() => sessionStorage.getItem("cockpit_exec_token") || "");
        const [tokenDraft, setTokenDraft] = useState("");
        const [editingToken, setEditingToken] = useState(() => !sessionStorage.getItem("cockpit_exec_token"));
        const [cmd, setCmd] = useState("");
        const [blocks, setBlocks] = useState([]);
        const [runningCount, setRunningCount] = useState(0);
        const [historyIdx, setHistoryIdx] = useState(-1);
        const history = useRef(JSON.parse(sessionStorage.getItem("cockpit_exec_history") || "[]"));
        const logRef = useRef(null);
        const inputRef = useRef(null);
        const blockSeq = useRef(0);

        useEffect(() => {
          const onKey = (e) => { if (e.key === "Escape") onClose(); };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [onClose]);

        useEffect(() => {
          if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
        }, [blocks]);

        useEffect(() => { if (!editingToken && inputRef.current) inputRef.current.focus(); }, [editingToken]);

        function saveToken() {
          const t = tokenDraft.trim();
          if (!t) return;
          sessionStorage.setItem("cockpit_exec_token", t);
          setToken(t);
          setTokenDraft("");
          setEditingToken(false);
        }

        function pushHistory(c) {
          const arr = history.current.filter(h => h !== c);
          arr.push(c);
          if (arr.length > 50) arr.splice(0, arr.length - 50);
          history.current = arr;
          try { sessionStorage.setItem("cockpit_exec_history", JSON.stringify(arr)); } catch {}
        }

        async function runCmd() {
          const c = cmd.trim();
          if (!c || !token) return;
          pushHistory(c);
          const id = ++blockSeq.current;
          setBlocks(b => [...b, { id, cmd: c, pending: true }]);
          setCmd("");
          setHistoryIdx(-1);
          setRunningCount(n => n + 1);
          const start = performance.now();
          let result;
          try {
            const r = await fetch(`/api/node/${encodeURIComponent(nodeId)}/exec`, {
              method: "POST",
              headers: { "Content-Type": "application/json", "X-Exec-Token": token },
              body: JSON.stringify({ cmd: c, timeout_s: 30 }),
            });
            const raw = await r.text();
            let body = null;
            try { body = JSON.parse(raw); } catch {}
            if (!r.ok) {
              result = { id, cmd: c, error: (body && body.error) || `HTTP ${r.status}`, exit: -1, stdout: "", stderr: "" };
            } else {
              result = { id, cmd: c, ...body };
            }
          } catch (err) {
            result = { id, cmd: c, error: String(err && err.message || err), exit: -1, stdout: "", stderr: "" };
          }
          result.durationMs = Math.round(performance.now() - start);
          setBlocks(b => b.map(x => (x.id === id ? result : x)));
          setRunningCount(n => Math.max(0, n - 1));
        }

        function onKey(e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            runCmd();
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            const h = history.current;
            if (h.length === 0) return;
            const next = historyIdx < 0 ? h.length - 1 : Math.max(0, historyIdx - 1);
            setHistoryIdx(next);
            setCmd(h[next]);
          } else if (e.key === "ArrowDown") {
            e.preventDefault();
            const h = history.current;
            if (historyIdx < 0) return;
            const next = historyIdx + 1;
            if (next >= h.length) { setHistoryIdx(-1); setCmd(""); }
            else { setHistoryIdx(next); setCmd(h[next]); }
          }
        }

        return (
          <div className="nd-modal-bg" onClick={e => e.target === e.currentTarget && onClose()}>
            <div className="nd-modal" onClick={e => e.stopPropagation()}>
              <div className="nd-modal-head">
                <span className="nd-modal-title">Shell · {nodeId}</span>
                <span className="nd-modal-warn">⚠ Runs as root · emergency use</span>
                <button className="nd-modal-close" onClick={onClose} title="Close (Esc)">×</button>
              </div>
              <div className="nd-shell-log" ref={logRef}>
                {blocks.length === 0 && (
                  <div className="meta">
                    {token
                      ? "Ready. Type a command and press Enter. ↑/↓ for history."
                      : "Enter the worker's exec_token below to unlock."}
                  </div>
                )}
                {blocks.map((b, i) => (
                  <div key={i} className="blk">
                    <div><span className="prompt">$</span> <span className="out">{b.cmd}</span></div>
                    {b.pending && <div className="meta">running…</div>}
                    {b.stdout && <div className="out">{b.stdout}</div>}
                    {b.stderr && <div className="err">{b.stderr}</div>}
                    {!b.pending && (() => {
                      const bits = [];
                      if (typeof b.exit === "number") bits.push(`exit=${b.exit}`);
                      if (b.signal) bits.push(`signal=${b.signal}`);
                      if (b.truncated) bits.push("truncated");
                      if (b.error) bits.push(`error=${b.error}`);
                      if (typeof b.durationMs === "number") bits.push(`${b.durationMs}ms`);
                      const tone = (b.error || (typeof b.exit === "number" && b.exit !== 0)) ? "bad" : "ok";
                      return <div className={`meta ${tone}`}>— {bits.join(" · ")}</div>;
                    })()}
                  </div>
                ))}
              </div>
              {editingToken ? (
                <div className="nd-shell-tokenrow">
                  <span className="lbl">Token</span>
                  <input
                    type="password"
                    value={tokenDraft}
                    onChange={e => setTokenDraft(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && saveToken()}
                    placeholder="exec_token from worker.conf"
                    autoFocus
                  />
                  <button onClick={saveToken} disabled={!tokenDraft.trim()}>Save</button>
                </div>
              ) : (
                <div className="nd-shell-tokenrow">
                  <span className="lbl">Token</span>
                  <span style={{ flex: 1, fontFamily: "var(--mono)", fontSize: 12, color: "var(--muted)" }}>
                    •••••••• (session)
                  </span>
                  <span className="change" onClick={() => { setEditingToken(true); setTokenDraft(""); }}>[change]</span>
                </div>
              )}
              <div className="nd-shell-cmdrow">
                <input
                  ref={inputRef}
                  value={cmd}
                  onChange={e => setCmd(e.target.value)}
                  onKeyDown={onKey}
                  placeholder={token ? (runningCount > 0 ? `running (${runningCount})… type next command` : "command (Enter to run)") : "set token first"}
                  disabled={!token}
                />
                <button className="ghost" onClick={() => setBlocks([])} disabled={blocks.length === 0} title="Clear terminal output">
                  Clear
                </button>
                <button onClick={runCmd} disabled={!token || !cmd.trim()}>
                  Run{runningCount > 0 ? ` (${runningCount})` : ""}
                </button>
              </div>
            </div>
          </div>
        );
      }

      function FreqModal({ nodeId, node, onClose }) {
        const { useRef } = React;
        const [token, setToken] = useState(() => sessionStorage.getItem("cockpit_exec_token") || "");
        const [tokenDraft, setTokenDraft] = useState("");
        const [editingToken, setEditingToken] = useState(() => !sessionStorage.getItem("cockpit_exec_token"));
        const minMhz = node.cpuFreqMinMhz > 0 ? Math.round(node.cpuFreqMinMhz) : 0;
        const siliconMaxMhz = node.cpuFreqMaxMhz > 0 ? Math.round(node.cpuFreqMaxMhz) : 0;
        const biosLimitMhz = node.cpuFreqBiosLimitMhz > 0 ? Math.round(node.cpuFreqBiosLimitMhz) : 0;
        // bios_limit is what the kernel will actually honor for scaling_max_freq
        // writes. cpuinfo_max_freq is just the silicon's boost ceiling; on most
        // HPC nodes the BMC clamps below that, so use bios_limit as the input
        // bound when present.
        const maxMhz = biosLimitMhz > 0 ? Math.min(siliconMaxMhz || biosLimitMhz, biosLimitMhz) : siliconMaxMhz;
        const haveRange = minMhz > 0 && maxMhz > 0 && maxMhz >= minMhz;
        const biosClampActive = biosLimitMhz > 0 && siliconMaxMhz > 0 && biosLimitMhz < siliconMaxMhz;
        const fallbackGovs = ["performance", "powersave", "schedutil", "ondemand", "conservative", "userspace"];
        const availableGovs = (node.cpuGovernorsAvailable && node.cpuGovernorsAvailable.length > 0) ? node.cpuGovernorsAvailable : fallbackGovs;
        const [customMhz, setCustomMhz] = useState("");
        const [selectedGov, setSelectedGov] = useState(node.cpuGovernor || availableGovs[0] || "");
        const [busy, setBusy] = useState(false);
        const [result, setResult] = useState(null); // {ok, text, tone}

        useEffect(() => {
          const onKey = (e) => { if (e.key === "Escape") onClose(); };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [onClose]);

        useEffect(() => {
          if (node.cpuGovernor && !selectedGov) setSelectedGov(node.cpuGovernor);
        }, [node.cpuGovernor]);

        function saveToken() {
          const t = tokenDraft.trim();
          if (!t) return;
          sessionStorage.setItem("cockpit_exec_token", t);
          setToken(t); setTokenDraft(""); setEditingToken(false);
        }

        async function runExec(cmd) {
          if (!token || busy) return;
          setBusy(true); setResult(null);
          try {
            const r = await fetch(`/api/node/${encodeURIComponent(nodeId)}/exec`, {
              method: "POST",
              headers: { "Content-Type": "application/json", "X-Exec-Token": token },
              body: JSON.stringify({ cmd, timeout_s: 15 }),
            });
            const raw = await r.text();
            let body = null;
            try { body = JSON.parse(raw); } catch {}
            if (!r.ok) {
              setResult({ tone: "bad", text: (body && body.error) || `HTTP ${r.status}` });
            } else if (body && body.error) {
              setResult({ tone: "bad", text: `error: ${body.error}${body.stderr ? ` — ${body.stderr.trim()}` : ""}` });
            } else if (body && typeof body.exit === "number" && body.exit !== 0) {
              setResult({ tone: "bad", text: `exit=${body.exit}${body.stderr ? ` — ${body.stderr.trim()}` : ""}` });
            } else {
              setResult({ tone: "ok", text: (body && (body.stdout || "").trim()) || "done" });
            }
          } catch (err) {
            setResult({ tone: "bad", text: String(err && err.message || err) });
          } finally {
            setBusy(false);
          }
        }

        function applyFreq() {
          const mhz = parseInt(customMhz, 10);
          if (!Number.isFinite(mhz)) return;
          if (haveRange && (mhz < minMhz || mhz > maxMhz)) return;
          const khz = mhz * 1000;
          const cmd =
            `set -e\nT=${khz}\n` +
            `for f in /sys/devices/system/cpu/cpu*/cpufreq; do\n` +
            `  echo 0 > "$f/scaling_min_freq" 2>/dev/null || true\n` +
            `  echo "$T" > "$f/scaling_max_freq"\n` +
            `  echo "$T" > "$f/scaling_min_freq"\n` +
            `done\n` +
            `cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_max_freq`;
          runExec(cmd).then(() => {
            setResult(prev => {
              if (!prev || prev.tone !== "ok") return prev;
              const capKhz = parseInt((prev.text || "").trim(), 10);
              if (!Number.isFinite(capKhz)) {
                return { tone: "ok", text: `applied ${mhz} MHz` };
              }
              const capMhz = Math.round(capKhz / 1000);
              // Kernel silently clamps writes above bios_limit. If the readback
              // is meaningfully below the request, the write didn't take.
              if (Math.abs(capMhz - mhz) > 5) {
                const reason = biosLimitMhz > 0 && capMhz <= biosLimitMhz + 5 ? " (BIOS limit)" : "";
                return { tone: "warn", text: `clamped to ${capMhz} MHz${reason} — requested ${mhz}` };
              }
              return { tone: "ok", text: `applied ${capMhz} MHz` };
            });
          });
        }

        function restoreDefaults() {
          const cmd =
            `set -e\n` +
            `for f in /sys/devices/system/cpu/cpu*/cpufreq; do\n` +
            `  echo 0 > "$f/scaling_min_freq" 2>/dev/null || true\n` +
            `  cat "$f/cpuinfo_max_freq" > "$f/scaling_max_freq"\n` +
            `  cat "$f/cpuinfo_min_freq" > "$f/scaling_min_freq"\n` +
            `done\n` +
            `cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_max_freq`;
          runExec(cmd).then(() => {
            setResult(prev => {
              if (!prev || prev.tone !== "ok") return prev;
              const cap = parseInt((prev.text || "").trim(), 10);
              const capTxt = Number.isFinite(cap) ? ` (cap ${Math.round(cap/1000)} MHz)` : "";
              return { tone: "ok", text: `restored defaults${capTxt}` };
            });
          });
        }

        function applyGovernor() {
          if (!selectedGov) return;
          if (!/^[a-z_]+$/.test(selectedGov)) return;
          const cmd =
            `set -e\nG=${selectedGov}\n` +
            `for f in /sys/devices/system/cpu/cpu*/cpufreq; do\n` +
            `  echo "$G" > "$f/scaling_governor"\n` +
            `done\n` +
            `cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor`;
          runExec(cmd).then(() => {
            setResult(prev => {
              if (!prev || prev.tone !== "ok") return prev;
              const g = (prev.text || "").trim();
              return { tone: "ok", text: `governor set to ${g || selectedGov}` };
            });
          });
        }

        const roundPct = (pct) => {
          const raw = minMhz + pct * (maxMhz - minMhz);
          const snapped = Math.round(raw / 100) * 100;
          return Math.max(minMhz, Math.min(maxMhz, snapped));
        };
        const presets = haveRange
          ? [
              { label: "Min",  mhz: minMhz },
              { label: "30%",  mhz: roundPct(0.30) },
              { label: "50%",  mhz: roundPct(0.50) },
              { label: "75%",  mhz: roundPct(0.75) },
              { label: "Max",  mhz: maxMhz },
            ]
          : [];

        const custMhz = parseInt(customMhz, 10);
        const customValid = Number.isFinite(custMhz) && (!haveRange || (custMhz >= minMhz && custMhz <= maxMhz));

        return (
          <div className="nd-modal-bg" onClick={e => e.target === e.currentTarget && onClose()}>
            <div className="nd-modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 620, height: "auto" }}>
              <div className="nd-modal-head">
                <span className="nd-modal-title">CPU Frequency · {nodeId}</span>
                <span className="nd-modal-warn">⚠ Clamps all cores · root</span>
                <button className="nd-modal-close" onClick={onClose} title="Close (Esc)">×</button>
              </div>

              <div style={{ padding: "14px 16px", display: "flex", flexDirection: "column", gap: 14 }}>
                <div style={{ fontSize: 12, color: "var(--muted)", fontFamily: "var(--mono)" }}>
                  {node.cpuFreqMhz > 0
                    ? <>Current <b style={{ color: "var(--ink)" }}>{formatMhz(node.cpuFreqMhz)}</b>
                        {haveRange && <> · Range {formatMhz(minMhz)} – {formatMhz(maxMhz)}</>}
                        {node.cpuGovernor && <> · Governor <b style={{ color: "var(--ink)" }}>{node.cpuGovernor}</b></>}
                      </>
                    : <em>frequency data unavailable on this node</em>}
                </div>
                {biosClampActive && (
                  <div style={{ fontSize: 11, color: "var(--warn)", fontFamily: "var(--mono)" }}>
                    BIOS caps scaling at {formatMhz(biosLimitMhz)} (silicon boost ceiling {formatMhz(siliconMaxMhz)}).
                    Writes above the cap get silently clamped by the kernel.
                  </div>
                )}

                {editingToken ? (
                  <div className="nd-shell-tokenrow" style={{ margin: 0 }}>
                    <span className="lbl">Token</span>
                    <input type="password" value={tokenDraft} onChange={e => setTokenDraft(e.target.value)}
                      onKeyDown={e => e.key === "Enter" && saveToken()}
                      placeholder="exec_token from worker.conf" autoFocus />
                    <button onClick={saveToken} disabled={!tokenDraft.trim()}>Save</button>
                  </div>
                ) : (
                  <div className="nd-shell-tokenrow" style={{ margin: 0 }}>
                    <span className="lbl">Token</span>
                    <span style={{ flex: 1, fontFamily: "var(--mono)", fontSize: 12, color: "var(--muted)" }}>•••••••• (session)</span>
                    <span className="change" onClick={() => { setEditingToken(true); setTokenDraft(""); }}>[change]</span>
                  </div>
                )}

                <div>
                  <div style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--muted)", fontWeight: 700, marginBottom: 6 }}>Governor</div>
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <select value={selectedGov} onChange={e => setSelectedGov(e.target.value)}
                      style={{ flex: 1, padding: "6px 8px", borderRadius: 6, border: "1px solid var(--line)", background: "var(--surface-2)", color: "var(--ink)", fontFamily: "var(--mono)", fontSize: 12 }}>
                      {availableGovs.map(g => (
                        <option key={g} value={g}>{g}{g === node.cpuGovernor ? " (current)" : ""}</option>
                      ))}
                    </select>
                    <button className="nd-freq-btn" onClick={applyGovernor} disabled={!token || busy || !selectedGov}>Set governor</button>
                  </div>
                </div>

                <div>
                  <div style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--muted)", fontWeight: 700, marginBottom: 6 }}>Frequency</div>
                  {presets.length > 0 && (
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
                      {presets.map(p => (
                        <button key={p.label} className="nd-freq-preset"
                          onClick={() => setCustomMhz(String(p.mhz))}
                          title={`${p.mhz} MHz`}>
                          {p.label}
                        </button>
                      ))}
                    </div>
                  )}
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <input type="number" value={customMhz} onChange={e => setCustomMhz(e.target.value)}
                      placeholder={haveRange ? `MHz (${minMhz}–${maxMhz})` : "MHz"}
                      min={haveRange ? minMhz : undefined} max={haveRange ? maxMhz : undefined}
                      style={{ flex: 1, padding: "6px 8px", borderRadius: 6, border: "1px solid var(--line)", background: "var(--surface-2)", color: "var(--ink)", fontFamily: "var(--mono)", fontSize: 13 }} />
                    <button className="nd-freq-btn" onClick={applyFreq} disabled={!token || busy || !customValid}>Apply</button>
                  </div>
                </div>

                {result && (
                  <div style={{ fontFamily: "var(--mono)", fontSize: 12, padding: "6px 10px", borderRadius: 6,
                    background: result.tone === "bad" ? "color-mix(in oklab, var(--crit) 12%, var(--surface-2))"
                              : result.tone === "warn" ? "color-mix(in oklab, var(--warn) 12%, var(--surface-2))"
                              : "color-mix(in oklab, var(--ok) 10%, var(--surface-2))",
                    color: result.tone === "bad" ? "var(--crit)"
                         : result.tone === "warn" ? "var(--warn)"
                         : "var(--ink)", whiteSpace: "pre-wrap", wordBreak: "break-word" }}>
                    {result.text}
                  </div>
                )}

                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderTop: "1px solid var(--line)", paddingTop: 10 }}>
                  <span onClick={busy ? undefined : restoreDefaults}
                    style={{ fontSize: 11, color: busy ? "var(--muted)" : "var(--accent)", cursor: busy ? "default" : "pointer", textDecoration: "underline", textDecorationStyle: "dotted" }}>
                    Restore (unclamp to hardware defaults)
                  </span>
                  <span style={{ fontSize: 10, color: "var(--muted)" }}>
                    {busy ? "running…" : ""}
                  </span>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // Parse "0-7,16,18-19" into a Set of integers.
      function parseCoreList(text, max) {
        const out = new Set();
        const parts = String(text || "").split(",").map(s => s.trim()).filter(Boolean);
        for (const p of parts) {
          const m = p.match(/^(\d+)(?:-(\d+))?$/);
          if (!m) return null;
          const lo = parseInt(m[1], 10);
          const hi = m[2] != null ? parseInt(m[2], 10) : lo;
          if (!Number.isFinite(lo) || !Number.isFinite(hi) || lo > hi) return null;
          for (let i = lo; i <= hi && i < max; i++) out.add(i);
        }
        return out;
      }

      function CoreToggleModal({ nodeId, node, onClose }) {
        const [token, setToken] = useState(() => sessionStorage.getItem("cockpit_exec_token") || "");
        const [tokenDraft, setTokenDraft] = useState("");
        const [editingToken, setEditingToken] = useState(() => !sessionStorage.getItem("cockpit_exec_token"));
        // states: { [idx]: 0 | 1 }. Loaded from the host on mount; "desired"
        // is what the operator has staged. Apply diff sends one composite cmd.
        const totalGuess = node.cpuCoreCount > 0 ? node.cpuCoreCount : 0;
        const [hostState, setHostState] = useState(null); // null until loaded
        const [desired, setDesired] = useState(null);
        const [busy, setBusy] = useState(false);
        const [result, setResult] = useState(null);
        const [customRange, setCustomRange] = useState("");

        useEffect(() => {
          const onKey = (e) => { if (e.key === "Escape") onClose(); };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [onClose]);

        function saveToken() {
          const t = tokenDraft.trim();
          if (!t) return;
          sessionStorage.setItem("cockpit_exec_token", t);
          setToken(t); setTokenDraft(""); setEditingToken(false);
        }

        async function runExec(cmd, timeout_s = 15) {
          if (!token || busy) return null;
          setBusy(true); setResult(null);
          try {
            const r = await fetch(`/api/node/${encodeURIComponent(nodeId)}/exec`, {
              method: "POST",
              headers: { "Content-Type": "application/json", "X-Exec-Token": token },
              body: JSON.stringify({ cmd, timeout_s }),
            });
            const raw = await r.text();
            let body = null;
            try { body = JSON.parse(raw); } catch {}
            if (!r.ok) {
              setResult({ tone: "bad", text: (body && body.error) || `HTTP ${r.status}` });
              return null;
            }
            if (body && body.error) {
              setResult({ tone: "bad", text: `error: ${body.error}${body.stderr ? ` — ${body.stderr.trim()}` : ""}` });
              return null;
            }
            if (body && typeof body.exit === "number" && body.exit !== 0) {
              setResult({ tone: "bad", text: `exit=${body.exit}${body.stderr ? ` — ${body.stderr.trim()}` : ""}` });
              return null;
            }
            return (body && body.stdout) || "";
          } catch (err) {
            setResult({ tone: "bad", text: String(err && err.message || err) });
            return null;
          } finally {
            setBusy(false);
          }
        }

        async function loadState() {
          // List every cpuN dir, read its `online` (cpu0 has none → treat as 1).
          const cmd =
            `for d in /sys/devices/system/cpu/cpu[0-9]*; do\n` +
            `  n=\${d##*/cpu}; s=$(cat "$d/online" 2>/dev/null || echo 1); echo "$n:$s";\n` +
            `done`;
          const stdout = await runExec(cmd);
          if (stdout == null) return;
          const map = {};
          for (const line of stdout.split("\n")) {
            const m = line.trim().match(/^(\d+):([01])$/);
            if (!m) continue;
            map[parseInt(m[1], 10)] = parseInt(m[2], 10);
          }
          setHostState(map);
          setDesired({ ...map });
          setResult({ tone: "ok", text: `loaded ${Object.keys(map).length} cores` });
        }

        // Auto-load once a token is available.
        useEffect(() => {
          if (token && hostState === null && !busy) loadState();
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [token]);

        const cores = desired ? Object.keys(desired).map(n => parseInt(n, 10)).sort((a, b) => a - b)
                              : (totalGuess > 0 ? Array.from({ length: totalGuess }, (_, i) => i) : []);
        const onlineCount = desired ? Object.values(desired).filter(v => v === 1).length : 0;
        const totalCount = cores.length;

        const diffs = [];
        if (desired && hostState) {
          for (const n of cores) {
            const want = desired[n];
            const have = hostState[n];
            if (want !== have) diffs.push({ n, want });
          }
        }

        function toggleCore(n) {
          if (n === 0) return; // cpu0 cannot be offlined
          if (!desired) return;
          setDesired({ ...desired, [n]: desired[n] === 1 ? 0 : 1 });
        }

        function setAllOn() {
          if (!desired) return;
          const next = {};
          for (const n of cores) next[n] = 1;
          setDesired(next);
        }

        function setHalfOn() {
          if (!desired) return;
          const half = Math.max(1, Math.floor(totalCount / 2));
          const next = {};
          for (const n of cores) next[n] = (n < half) ? 1 : 0;
          next[0] = 1;
          setDesired(next);
        }

        function applyCustom() {
          if (!desired) return;
          const set = parseCoreList(customRange, totalCount);
          if (!set) {
            setResult({ tone: "bad", text: `bad range: "${customRange}"` });
            return;
          }
          set.add(0);
          const next = {};
          for (const n of cores) next[n] = set.has(n) ? 1 : 0;
          setDesired(next);
        }

        async function applyChanges() {
          if (diffs.length === 0) return;
          // Compose a single shell command chaining each write. cpu0 is never
          // touched (toggleCore guards it), so no need to special-case here.
          const lines = diffs.map(d => `echo ${d.want} > /sys/devices/system/cpu/cpu${d.n}/online`);
          const cmd = `set -e\n${lines.join("\n")}\necho "applied ${diffs.length}"`;
          const stdout = await runExec(cmd, 30);
          if (stdout == null) return;
          setResult({ tone: "ok", text: stdout.trim() || `applied ${diffs.length}` });
          await loadState();
        }

        async function restoreAll() {
          const cmd =
            `for d in /sys/devices/system/cpu/cpu[0-9]*; do\n` +
            `  echo 1 > "$d/online" 2>/dev/null || true;\n` +
            `done\necho "all-on"`;
          const stdout = await runExec(cmd, 30);
          if (stdout == null) return;
          setResult({ tone: "ok", text: stdout.trim() || "all-on" });
          await loadState();
        }

        const chipCore = (n) => {
          const isOn = desired ? desired[n] === 1 : false;
          const changed = hostState && desired && hostState[n] !== desired[n];
          const locked = n === 0;
          return (
            <button
              key={n}
              onClick={() => toggleCore(n)}
              disabled={locked || busy || !desired}
              title={locked ? "cpu0 cannot be offlined" : `cpu${n} · click to toggle`}
              style={{
                fontFamily: "var(--mono)",
                fontSize: 11,
                padding: "5px 7px",
                minWidth: 38,
                borderRadius: 5,
                border: `1px solid ${changed ? "var(--accent)" : "var(--line)"}`,
                background: isOn
                  ? (changed ? "color-mix(in oklab, var(--ok) 30%, var(--surface-2))" : "color-mix(in oklab, var(--ok) 18%, var(--surface-2))")
                  : (changed ? "color-mix(in oklab, var(--warn) 25%, var(--surface-2))" : "var(--surface-2)"),
                color: isOn ? "var(--ink)" : "var(--muted)",
                cursor: locked || busy ? "default" : "pointer",
                opacity: locked ? 0.7 : 1,
                fontWeight: 600,
              }}>
              {n}{locked ? "🔒" : ""}
            </button>
          );
        };

        return (
          <div className="nd-modal-bg" onClick={e => e.target === e.currentTarget && onClose()}>
            <div className="nd-modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 720, height: "auto" }}>
              <div className="nd-modal-head">
                <span className="nd-modal-title">CPU Cores · {nodeId}</span>
                <span className="nd-modal-warn">⚠ Hot-unplug · root</span>
                <button className="nd-modal-close" onClick={onClose} title="Close (Esc)">×</button>
              </div>

              <div style={{ padding: "14px 16px", display: "flex", flexDirection: "column", gap: 14 }}>
                <div style={{ fontSize: 12, color: "var(--muted)", fontFamily: "var(--mono)" }}>
                  {totalCount > 0
                    ? <>Online <b style={{ color: "var(--ink)" }}>{onlineCount}</b> / {totalCount}{diffs.length > 0 && <> · <b style={{ color: "var(--accent)" }}>{diffs.length} pending</b></>}</>
                    : <em>core data unavailable on this node</em>}
                </div>

                {editingToken ? (
                  <div className="nd-shell-tokenrow" style={{ margin: 0 }}>
                    <span className="lbl">Token</span>
                    <input type="password" value={tokenDraft} onChange={e => setTokenDraft(e.target.value)}
                      onKeyDown={e => e.key === "Enter" && saveToken()}
                      placeholder="exec_token from worker.conf" autoFocus />
                    <button onClick={saveToken} disabled={!tokenDraft.trim()}>Save</button>
                  </div>
                ) : (
                  <div className="nd-shell-tokenrow" style={{ margin: 0 }}>
                    <span className="lbl">Token</span>
                    <span style={{ flex: 1, fontFamily: "var(--mono)", fontSize: 12, color: "var(--muted)" }}>•••••••• (session)</span>
                    <span className="change" onClick={() => { setEditingToken(true); setTokenDraft(""); }}>[change]</span>
                  </div>
                )}

                <div>
                  <div style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--muted)", fontWeight: 700, marginBottom: 6 }}>Cores</div>
                  {!desired ? (
                    <div style={{ fontSize: 12, color: "var(--muted)", fontFamily: "var(--mono)" }}>
                      {token ? (busy ? "loading…" : <span onClick={loadState} style={{ cursor: "pointer", color: "var(--accent)", textDecoration: "underline", textDecorationStyle: "dotted" }}>load core states</span>)
                             : "set token to load core states"}
                    </div>
                  ) : (
                    <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
                      {cores.map(chipCore)}
                    </div>
                  )}
                </div>

                <div>
                  <div style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--muted)", fontWeight: 700, marginBottom: 6 }}>Presets</div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
                    <button className="nd-freq-preset" onClick={setAllOn} disabled={!desired || busy}>All on</button>
                    <button className="nd-freq-preset" onClick={setHalfOn} disabled={!desired || busy} title="cpu0..cpu(N/2-1) on, rest off">First half</button>
                    <button className="nd-freq-preset" onClick={() => loadState()} disabled={!token || busy}>Refresh</button>
                  </div>
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <input type="text" value={customRange} onChange={e => setCustomRange(e.target.value)}
                      placeholder="online cores: 0-7,16,18"
                      style={{ flex: 1, padding: "6px 8px", borderRadius: 6, border: "1px solid var(--line)", background: "var(--surface-2)", color: "var(--ink)", fontFamily: "var(--mono)", fontSize: 13 }} />
                    <button className="nd-freq-btn" onClick={applyCustom} disabled={!desired || busy || !customRange.trim()}>Stage</button>
                  </div>
                </div>

                {result && (
                  <div style={{ fontFamily: "var(--mono)", fontSize: 12, padding: "6px 10px", borderRadius: 6,
                    background: result.tone === "bad" ? "color-mix(in oklab, var(--crit) 12%, var(--surface-2))"
                              : result.tone === "warn" ? "color-mix(in oklab, var(--warn) 12%, var(--surface-2))"
                              : "color-mix(in oklab, var(--ok) 10%, var(--surface-2))",
                    color: result.tone === "bad" ? "var(--crit)"
                         : result.tone === "warn" ? "var(--warn)"
                         : "var(--ink)", whiteSpace: "pre-wrap", wordBreak: "break-word" }}>
                    {result.text}
                  </div>
                )}

                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderTop: "1px solid var(--line)", paddingTop: 10 }}>
                  <span onClick={busy ? undefined : restoreAll}
                    style={{ fontSize: 11, color: busy ? "var(--muted)" : "var(--accent)", cursor: busy ? "default" : "pointer", textDecoration: "underline", textDecorationStyle: "dotted" }}>
                    Restore (online every core)
                  </span>
                  <button className="nd-freq-btn" onClick={applyChanges} disabled={busy || diffs.length === 0}>
                    {busy ? "running…" : `Apply ${diffs.length} change${diffs.length === 1 ? "" : "s"}`}
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // Single-quote-escape a value for inclusion inside a Bash single-quoted
      // string. Required because BMC credentials get embedded in the shell
      // command sent to the worker exec channel.
      function shEsc(s) { return "'" + String(s).replace(/'/g, "'\\''") + "'"; }

      // Common prelude: bash helpers used by every Redfish snippet. Defines
      // U/P/URL and a getetag() helper that pulls the ETag header from the
      // most recent saved response. This BMC is strict about If-Match — the
      // Redfish-spec wildcard "*" is rejected with HTTP 428 — so we always
      // retrieve a real ETag and retry once if the BMC briefly answers
      // without it (transient session-pool exhaustion).
      function redfishPrelude(bmcHost, bmcUser, bmcPass) {
        const url = `https://${bmcHost}/redfish/v1/Chassis/1/Thermal`;
        return [
          `set -e`,
          `U=${shEsc(bmcUser)}`,
          `P=${shEsc(bmcPass)}`,
          `URL=${shEsc(url)}`,
          `HDRS=$(mktemp)`,
          `trap 'rm -f "$HDRS"' EXIT`,
          // Read response headers from $HDRS, find ETag (case-insensitive).
          `getetag() { awk 'BEGIN{IGNORECASE=1} /^etag:/{gsub(/[\\r\\n]/,""); print $2; exit}' "$HDRS"; }`,
          // GET with header dump; returns body on stdout.
          `getbody() { curl --connect-timeout 4 -sk -u "$U:$P" -D "$HDRS" -H 'Accept: application/json' "$URL"; }`,
          // Fetch a fresh ETag. One retry with 1 s sleep handles transient
          // empty-header responses.
          `fresh_etag() {`,
          `  getbody >/dev/null`,
          `  local e=$(getetag)`,
          `  if [ -z "$e" ]; then sleep 1; getbody >/dev/null; e=$(getetag); fi`,
          `  [ -n "$e" ] || { echo "no ETag from BMC (auth failure or session limit?)" >&2; return 1; }`,
          `  printf '%s' "$e"`,
          `}`,
          // Extract a field from the current Thermal JSON. $1 = sed pattern.
          `current_mode() { curl --connect-timeout 4 -sk -u "$U:$P" "$URL" | sed -n 's/.*"FanControlMode":"\\([^"]*\\)".*/\\1/p' | head -1; }`,
          `fan0_speed() { curl --connect-timeout 4 -sk -u "$U:$P" "$URL" | sed -n 's/.*"SpeedRatio":\\([0-9]*\\).*/\\1/p' | head -1; }`,
        ].join("\n");
      }

      // PATCH the Thermal resource with `body`. Returns from the shell with
      // a non-zero exit if HTTP != 204. Pulls a fresh ETag right before the
      // PATCH so optimistic-concurrency is always satisfied. `|| exit 1` on
      // the ETag fetch makes the failure explicit — `set -e` plus command-
      // substitution doesn't always abort on older bash versions. All error
      // diagnostics go to stderr so the dashboard's exit-code branch
      // surfaces them (it shows stderr, falling back to stdout, on failure).
      function redfishPatch(body) {
        return [
          `ETAG=$(fresh_etag) || exit 1`,
          `HTTP=$(curl --connect-timeout 4 -sk -u "$U:$P" -X PATCH \\`,
          `  -H 'Content-Type: application/json' -H "If-Match: $ETAG" \\`,
          `  -o /dev/null -w '%{http_code}' \\`,
          `  -d ${shEsc(body)} "$URL")`,
          `[ "$HTTP" = "204" ] || { echo "PATCH HTTP $HTTP (body len $(echo -n ${shEsc(body)} | wc -c))" >&2; exit 1; }`,
        ].join("\n");
      }

      // Poll for `current_mode` to equal `target` for up to 15 s. The BMC
      // accepts PATCHes instantly (HTTP 204) but takes 9–12 s to actually
      // apply them.
      function redfishPollMode(target) {
        return [
          `EXPECT=${shEsc(target)}`,
          `for i in $(seq 1 15); do`,
          `  sleep 1`,
          `  CUR=$(current_mode)`,
          `  [ "$CUR" = "$EXPECT" ] && break`,
          `done`,
          `[ "$CUR" = "$EXPECT" ] || { echo "mode did not propagate to $EXPECT (still '$CUR' after 15s)" >&2; exit 1; }`,
        ].join("\n");
      }

      // Build a mode-only PATCH (Auto ↔ Manual). Reports the final mode and
      // the elapsed propagation time.
      function buildRedfishModeCmd({ bmcHost, bmcUser, bmcPass, mode }) {
        return [
          redfishPrelude(bmcHost, bmcUser, bmcPass),
          redfishPatch(JSON.stringify({Oem:{Public:{FanControlMode: mode}}})),
          redfishPollMode(mode),
          `echo "applied $EXPECT (t+\${i}s)"`,
        ].join("\n");
      }

      // Build a duty PATCH. Switches to Manual first if needed (PATCH +
      // 15 s poll), then PATCHes Fans[] in a separate body. We don't combine
      // mode + Fans[] in one body because this BMC's firmware silently
      // rejects (or stale-ETags) the combined update.
      function buildRedfishDutyCmd({ bmcHost, bmcUser, bmcPass, pct, fanCount }) {
        const n = fanCount || 12;
        const fansBody = JSON.stringify({
          Fans: Array.from({length: n}, (_, i) =>
            ({MemberId: String(i), Oem:{Public:{SpeedRatio: pct}}})),
        });
        return [
          redfishPrelude(bmcHost, bmcUser, bmcPass),
          // Step 1: ensure Manual mode.
          `CUR=$(current_mode)`,
          `if [ "$CUR" != "Manual" ]; then`,
          `  echo "switching $CUR -> Manual..."`,
          redfishPatch(JSON.stringify({Oem:{Public:{FanControlMode:"Manual"}}})).replace(/^/gm, "  "),
          redfishPollMode("Manual").replace(/^/gm, "  "),
          `fi`,
          // Step 2: PATCH all fans' SpeedRatio.
          redfishPatch(fansBody),
          // Step 3: read back and report.
          `sleep 4`,
          `NOW=$(fan0_speed)`,
          `echo "set ${pct}% (fan 0 now reads $NOW%)"`,
        ].join("\n");
      }

      // Per-vendor IPMI/Redfish fan commands. Each entry returns a shell
      // command string for the exec channel. Vendors absent from this table
      // trigger the "not supported" banner in FanModal; no command is sent.
      // setMode/setDuty/restore receive (args, ctx) — supermicro/dell ignore
      // ctx; redfish uses ctx.{bmcHost,bmcUser,bmcPass,fanCount}.
      const FAN_CMDS = {
        supermicro: {
          setMode: (mode) => `ipmitool raw 0x30 0x45 0x01 ${mode === "manual" ? "0x01" : "0x00"}\necho ok`,
          setDuty: (pct) => {
            const hex = `0x${pct.toString(16).padStart(2, "0")}`;
            return `set -e\n` +
              `ipmitool raw 0x30 0x45 0x01 0x01 >/dev/null\n` +
              `ipmitool raw 0x30 0x70 0x66 0x01 0x00 ${hex}\n` +
              `ipmitool raw 0x30 0x70 0x66 0x01 0x01 ${hex}\n` +
              `echo "set ${pct}%"`;
          },
          restore: () => `ipmitool raw 0x30 0x45 0x01 0x00\necho "restored auto"`,
        },
        dell: {
          setMode: (mode) => `ipmitool raw 0x30 0x30 0x01 ${mode === "manual" ? "0x00" : "0x01"}\necho ok`,
          setDuty: (pct) => {
            const hex = `0x${pct.toString(16).padStart(2, "0")}`;
            return `set -e\n` +
              `ipmitool raw 0x30 0x30 0x01 0x00 >/dev/null\n` +
              `ipmitool raw 0x30 0x30 0x02 0xff ${hex}\n` +
              `echo "set ${pct}%"`;
          },
          restore: () => `ipmitool raw 0x30 0x30 0x01 0x01\necho "restored auto"`,
        },
        // Redfish path — for ODM whitebox BMCs that expose AMI MegaRAC's
        // /redfish/v1/Chassis/1/Thermal with Oem.Public.FanControlMode and
        // per-fan Oem.Public.SpeedRatio. Validated end-to-end on EPYC 9755 +
        // AST + AMI MegaRAC SP-X 13.x. setDuty intentionally splits the
        // mode flip and the Fans[] PATCH into two requests — combining them
        // into one body trips this BMC's optimistic-concurrency check.
        redfish: {
          setMode: (mode, ctx) => buildRedfishModeCmd({
            bmcHost: ctx.bmcHost, bmcUser: ctx.bmcUser, bmcPass: ctx.bmcPass,
            mode: mode === "manual" ? "Manual" : "Auto",
          }),
          setDuty: (pct, ctx) => buildRedfishDutyCmd({
            bmcHost: ctx.bmcHost, bmcUser: ctx.bmcUser, bmcPass: ctx.bmcPass,
            pct, fanCount: ctx.fanCount,
          }),
          restore: (_, ctx) => buildRedfishModeCmd({
            bmcHost: ctx.bmcHost, bmcUser: ctx.bmcUser, bmcPass: ctx.bmcPass,
            mode: "Auto",
          }),
        },
      };

      function FanModal({ nodeId, node, onClose }) {
        const [token, setToken] = useState(() => sessionStorage.getItem("cockpit_exec_token") || "");
        const [tokenDraft, setTokenDraft] = useState("");
        const [editingToken, setEditingToken] = useState(() => !sessionStorage.getItem("cockpit_exec_token"));
        // BMC credentials — only needed for the redfish path. Stored in
        // sessionStorage so the user types them once per browser tab.
        const [bmcUser, setBmcUser] = useState(() => sessionStorage.getItem("cockpit_bmc_user") || "");
        const [bmcPass, setBmcPass] = useState(() => sessionStorage.getItem("cockpit_bmc_pass") || "");
        const [bmcUserDraft, setBmcUserDraft] = useState("");
        const [bmcPassDraft, setBmcPassDraft] = useState("");
        const [editingBmc, setEditingBmc] = useState(() =>
          !(sessionStorage.getItem("cockpit_bmc_user") && sessionStorage.getItem("cockpit_bmc_pass")));
        const [mode, setMode] = useState("auto");
        const [customPct, setCustomPct] = useState("");
        const [busy, setBusy] = useState(false);
        const [result, setResult] = useState(null);

        const vendor = node.fanVendor || "unknown";
        const cmds = FAN_CMDS[vendor];
        const supported = !!cmds;
        const needsBmcCreds = vendor === "redfish";
        const haveBmcCreds = !!(bmcUser && bmcPass);
        const bmcReady = !needsBmcCreds || (haveBmcCreds && node.bmcHost);
        const ctx = { bmcHost: node.bmcHost, bmcUser, bmcPass, fanCount: node.fanTotal };

        useEffect(() => {
          const onKey = (e) => { if (e.key === "Escape") onClose(); };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [onClose]);

        function saveToken() {
          const t = tokenDraft.trim();
          if (!t) return;
          sessionStorage.setItem("cockpit_exec_token", t);
          setToken(t); setTokenDraft(""); setEditingToken(false);
        }

        async function runExec(cmd) {
          if (!token || busy) return;
          setBusy(true); setResult(null);
          try {
            // 40 s leaves headroom for the redfish setDuty flow: if mode
            // is currently Auto we PATCH→Manual (up to 15 s poll) + PATCH
            // Fans[] + 4 s settle, totalling ~22 s. setMode/restore on their
            // own complete in ~12 s but share the timeout for simplicity.
            const r = await fetch(`/api/node/${encodeURIComponent(nodeId)}/exec`, {
              method: "POST",
              headers: { "Content-Type": "application/json", "X-Exec-Token": token },
              body: JSON.stringify({ cmd, timeout_s: 40 }),
            });
            const raw = await r.text();
            let body = null;
            try { body = JSON.parse(raw); } catch {}
            if (!r.ok) {
              setResult({ tone: "bad", text: (body && body.error) || `HTTP ${r.status}` });
            } else if (body && body.error) {
              setResult({ tone: "bad", text: `error: ${body.error}${body.stderr ? ` — ${body.stderr.trim()}` : ""}` });
            } else if (body && typeof body.exit === "number" && body.exit !== 0) {
              // Show stderr if present; fall back to stdout because some
              // legacy snippets (Supermicro/Dell ipmitool) print failure
              // diagnostics to stdout. Without this fallback the user only
              // sees "exit=1" with no indication of what went wrong.
              const detail = ((body.stderr || "").trim() || (body.stdout || "").trim());
              setResult({ tone: "bad", text: `exit=${body.exit}${detail ? ` — ${detail}` : ""}` });
            } else {
              setResult({ tone: "ok", text: (body && (body.stdout || "").trim()) || "done" });
            }
          } catch (err) {
            setResult({ tone: "bad", text: String(err && err.message || err) });
          } finally {
            setBusy(false);
          }
        }

        function saveBmcCreds() {
          const u = bmcUserDraft.trim();
          const p = bmcPassDraft;  // don't trim password
          if (!u || !p) return;
          sessionStorage.setItem("cockpit_bmc_user", u);
          sessionStorage.setItem("cockpit_bmc_pass", p);
          setBmcUser(u); setBmcPass(p);
          setBmcUserDraft(""); setBmcPassDraft("");
          setEditingBmc(false);
        }

        function applyMode() {
          if (!supported || !bmcReady) return;
          runExec(cmds.setMode(mode, ctx));
        }

        function applyDuty() {
          if (!supported || !bmcReady) return;
          const pct = parseInt(customPct, 10);
          if (!Number.isFinite(pct) || pct < 1 || pct > 100) return;
          runExec(cmds.setDuty(pct, ctx));
        }

        function restoreAuto() {
          if (!supported || !bmcReady) return;
          runExec(cmds.restore(null, ctx));
        }

        const presets = [20, 40, 60, 80, 100];
        const pctVal = parseInt(customPct, 10);
        const pctValid = Number.isFinite(pctVal) && pctVal >= 1 && pctVal <= 100;
        const vendorLabel = vendor === "unknown" ? "unknown" : vendor.charAt(0).toUpperCase() + vendor.slice(1);

        const inputStyle = { flex: 1, padding: "6px 8px", borderRadius: 6, border: "1px solid var(--line)", background: "var(--surface-2)", color: "var(--ink)", fontFamily: "var(--mono)", fontSize: 13 };

        return (
          <div className="nd-modal-bg" onClick={e => e.target === e.currentTarget && onClose()}>
            <div className="nd-modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 620, height: "auto" }}>
              <div className="nd-modal-head">
                <span className="nd-modal-title">Fan Control · {nodeId}</span>
                <span className="nd-modal-warn">⚠ Overrides BMC · root</span>
                <button className="nd-modal-close" onClick={onClose} title="Close (Esc)">×</button>
              </div>

              <div style={{ padding: "14px 16px", display: "flex", flexDirection: "column", gap: 14 }}>
                <div style={{ fontSize: 12, color: "var(--muted)", fontFamily: "var(--mono)" }}>
                  {node.fanTotal > 0
                    ? <>Fans <b style={{ color: "var(--ink)" }}>{node.fanOk}/{node.fanTotal} OK</b>
                        {node.fanRpm > 0 && <> · avg <b style={{ color: "var(--ink)" }}>{(node.fanRpm / 1000).toFixed(2)} kRPM</b></>}
                        {" "}· vendor <b style={{ color: "var(--ink)" }}>{vendorLabel}</b>
                      </>
                    : <em>fan data unavailable on this node</em>}
                </div>

                {!supported && (
                  <div style={{ fontSize: 12, padding: "10px 12px", borderRadius: 6,
                    background: "color-mix(in oklab, var(--warn) 12%, var(--surface-2))",
                    color: "var(--ink)", border: "1px solid color-mix(in oklab, var(--warn) 40%, var(--line))", lineHeight: 1.5 }}>
                    <div style={{ fontWeight: 700, marginBottom: 4, color: "var(--warn)" }}>Fan tuning is not supported on this platform.</div>
                    Detected vendor: <b>{vendorLabel}</b>. <code>FAN_CMDS</code> in <code>server/web/node.html</code> currently covers Supermicro, Dell, and Redfish (AMI MegaRAC-style). To enable tuning on other hardware, add the right <code>ipmitool raw …</code> opcodes there.
                  </div>
                )}

                {supported && vendor === "redfish" && !node.bmcHost && (
                  <div style={{ fontSize: 12, padding: "10px 12px", borderRadius: 6,
                    background: "color-mix(in oklab, var(--warn) 12%, var(--surface-2))",
                    color: "var(--ink)", border: "1px solid color-mix(in oklab, var(--warn) 40%, var(--line))", lineHeight: 1.5 }}>
                    <div style={{ fontWeight: 700, marginBottom: 4, color: "var(--warn)" }}>BMC IP not yet discovered.</div>
                    The worker hasn't reported a BMC management IP for this node. Check that <code>ipmitool lan print 1</code> returns a valid address as root, then restart <code>hpc-worker</code>.
                  </div>
                )}

                {editingToken ? (
                  <div className="nd-shell-tokenrow" style={{ margin: 0 }}>
                    <span className="lbl">Token</span>
                    <input type="password" value={tokenDraft} onChange={e => setTokenDraft(e.target.value)}
                      onKeyDown={e => e.key === "Enter" && saveToken()}
                      placeholder="exec_token from worker.conf" autoFocus />
                    <button onClick={saveToken} disabled={!tokenDraft.trim()}>Save</button>
                  </div>
                ) : (
                  <div className="nd-shell-tokenrow" style={{ margin: 0 }}>
                    <span className="lbl">Token</span>
                    <span style={{ flex: 1, fontFamily: "var(--mono)", fontSize: 12, color: "var(--muted)" }}>•••••••• (session)</span>
                    <span className="change" onClick={() => { setEditingToken(true); setTokenDraft(""); }}>[change]</span>
                  </div>
                )}

                {needsBmcCreds && (editingBmc ? (
                  <div className="nd-shell-tokenrow" style={{ margin: 0, gap: 6 }}>
                    <span className="lbl">BMC</span>
                    <input type="text" value={bmcUserDraft} onChange={e => setBmcUserDraft(e.target.value)}
                      placeholder="user (e.g. admin)" autoFocus style={{ flex: "1 1 100px" }} />
                    <input type="password" value={bmcPassDraft} onChange={e => setBmcPassDraft(e.target.value)}
                      onKeyDown={e => e.key === "Enter" && saveBmcCreds()}
                      placeholder="password" style={{ flex: "1 1 140px" }} />
                    <button onClick={saveBmcCreds} disabled={!bmcUserDraft.trim() || !bmcPassDraft}>Save</button>
                  </div>
                ) : (
                  <div className="nd-shell-tokenrow" style={{ margin: 0 }}>
                    <span className="lbl">BMC</span>
                    <span style={{ flex: 1, fontFamily: "var(--mono)", fontSize: 12, color: "var(--muted)" }}>{bmcUser} @ {node.bmcHost || "?"} · ••••••• (session)</span>
                    <span className="change" onClick={() => { setEditingBmc(true); setBmcUserDraft(bmcUser); setBmcPassDraft(""); }}>[change]</span>
                  </div>
                ))}

                <div>
                  <div style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--muted)", fontWeight: 700, marginBottom: 6 }}>Mode</div>
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <select value={mode} onChange={e => setMode(e.target.value)} disabled={!supported}
                      style={{ ...inputStyle, fontSize: 12, opacity: supported ? 1 : 0.5 }}>
                      <option value="auto">Auto (BMC-controlled)</option>
                      <option value="manual">Manual (override)</option>
                    </select>
                    <button className="nd-freq-btn" onClick={applyMode} disabled={!supported || !token || !bmcReady || busy}>Set mode</button>
                  </div>
                </div>

                <div>
                  <div style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--muted)", fontWeight: 700, marginBottom: 6 }}>Duty %</div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
                    {presets.map(p => (
                      <button key={p} className="nd-freq-preset" disabled={!supported}
                        onClick={() => setCustomPct(String(p))}
                        style={{ opacity: supported ? 1 : 0.5, cursor: supported ? "pointer" : "not-allowed" }}
                        title={`${p}% PWM`}>
                        {p}%
                      </button>
                    ))}
                  </div>
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <input type="number" value={customPct} onChange={e => setCustomPct(e.target.value)}
                      disabled={!supported}
                      placeholder="% (1–100)" min={1} max={100}
                      style={{ ...inputStyle, opacity: supported ? 1 : 0.5 }} />
                    <button className="nd-freq-btn" onClick={applyDuty} disabled={!supported || !token || !bmcReady || busy || !pctValid}>Apply</button>
                  </div>
                </div>

                {result && (
                  <div style={{ fontFamily: "var(--mono)", fontSize: 12, padding: "6px 10px", borderRadius: 6,
                    background: result.tone === "bad" ? "color-mix(in oklab, var(--crit) 12%, var(--surface-2))"
                              : result.tone === "warn" ? "color-mix(in oklab, var(--warn) 12%, var(--surface-2))"
                              : "color-mix(in oklab, var(--ok) 10%, var(--surface-2))",
                    color: result.tone === "bad" ? "var(--crit)"
                         : result.tone === "warn" ? "var(--warn)"
                         : "var(--ink)", whiteSpace: "pre-wrap", wordBreak: "break-word" }}>
                    {result.text}
                  </div>
                )}

                {supported && (
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderTop: "1px solid var(--line)", paddingTop: 10 }}>
                    <span onClick={(busy || !bmcReady) ? undefined : restoreAuto}
                      style={{ fontSize: 11, color: (busy || !bmcReady) ? "var(--muted)" : "var(--accent)", cursor: (busy || !bmcReady) ? "default" : "pointer", textDecoration: "underline", textDecorationStyle: "dotted" }}>
                      Restore (re-enable auto control)
                    </span>
                    <span style={{ fontSize: 10, color: "var(--muted)" }}>
                      {busy ? "running…" : ""}
                    </span>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      // NOTE: UNTESTED — the dev cluster has no GPU, so these commands were
      // assembled from rocm-smi / nvidia-smi docs and have never been run on
      // real hardware. Before relying on them:
      //   1. Verify the tool is on $PATH on the GPU host.
      //   2. Try the generated command by hand once on the first GPU node.
      //   3. The modal always surfaces stdout/stderr — read before trusting.
      //
      // Map key → vendor name from gpu_collector.cpp's GpuVendor enum
      // (exposed via live-data.js as node.gpus[i].vendor).
      const GPU_CMDS = {
        amd: {
          setPowerCap: (i, w) => `rocm-smi -d ${i} --setpoweroverdrive ${w} --autorespond y\necho "cap=${w}W"`,
          setPerfLevel: (i, lvl) => {
            // rocm-smi --setperflevel accepts: auto, low, high, manual, profile_*
            const rocmLvl = { low: "low", balanced: "auto", performance: "high", max: "high" }[lvl] || "auto";
            return `rocm-smi -d ${i} --setperflevel ${rocmLvl} --autorespond y\necho "perf=${rocmLvl}"`;
          },
          restore: (i) =>
            `rocm-smi -d ${i} --resetpoweroverdrive --autorespond y && ` +
            `rocm-smi -d ${i} --setperflevel auto --autorespond y\necho "restored"`,
        },
        nvidia: {
          setPowerCap: (i, w) =>
            `nvidia-smi -i ${i} -pm 1 >/dev/null && nvidia-smi -i ${i} -pl ${w}\necho "cap=${w}W"`,
          setPerfLevel: (i, lvl) => {
            // NOTE: UNTESTED — clock ranges are placeholders. The modal shows
            // the full command verbatim in the result pane so the operator can
            // sanity-check it before reaching for hardware-specific ranges.
            const arg = { low: "-lgc 300,800", balanced: "-rgc", performance: "-lgc 1200,1800", max: "-lgc 1500,2100" }[lvl] || "-rgc";
            return `nvidia-smi -i ${i} ${arg}\necho "perf=${lvl}"`;
          },
          restore: (i) =>
            `nvidia-smi -i ${i} -rgc\necho "clocks reset to default (power cap untouched — re-apply via Apply if needed)"`,
        },
      };

      function GpuModal({ nodeId, node, onClose }) {
        const [token, setToken] = useState(() => sessionStorage.getItem("cockpit_exec_token") || "");
        const [tokenDraft, setTokenDraft] = useState("");
        const [editingToken, setEditingToken] = useState(() => !sessionStorage.getItem("cockpit_exec_token"));
        const [sel, setSel] = useState(0);
        const [customW, setCustomW] = useState("");
        const [level, setLevel] = useState("balanced");
        const [busy, setBusy] = useState(false);
        const [result, setResult] = useState(null);

        const gpus = Array.isArray(node.gpus) ? node.gpus : [];
        const selected = gpus[sel] || null;
        const vendor = selected ? selected.vendor : "unknown";
        const cmds = GPU_CMDS[vendor];
        const supported = !!cmds;

        useEffect(() => {
          const onKey = (e) => { if (e.key === "Escape") onClose(); };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [onClose]);

        function saveToken() {
          const t = tokenDraft.trim();
          if (!t) return;
          sessionStorage.setItem("cockpit_exec_token", t);
          setToken(t); setTokenDraft(""); setEditingToken(false);
        }

        async function runExec(cmd) {
          if (!token || busy) return;
          setBusy(true); setResult(null);
          try {
            const r = await fetch(`/api/node/${encodeURIComponent(nodeId)}/exec`, {
              method: "POST",
              headers: { "Content-Type": "application/json", "X-Exec-Token": token },
              body: JSON.stringify({ cmd, timeout_s: 15 }),
            });
            const raw = await r.text();
            let body = null;
            try { body = JSON.parse(raw); } catch {}
            if (!r.ok) {
              setResult({ tone: "bad", text: (body && body.error) || `HTTP ${r.status}` });
            } else if (body && body.error) {
              setResult({ tone: "bad", text: `error: ${body.error}${body.stderr ? ` — ${body.stderr.trim()}` : ""}` });
            } else if (body && typeof body.exit === "number" && body.exit !== 0) {
              setResult({ tone: "bad", text: `exit=${body.exit}${body.stderr ? ` — ${body.stderr.trim()}` : ""}` });
            } else {
              setResult({ tone: "ok", text: (body && (body.stdout || "").trim()) || "done" });
            }
          } catch (err) {
            setResult({ tone: "bad", text: String(err && err.message || err) });
          } finally { setBusy(false); }
        }

        function applyPowerCap() {
          if (!supported || !selected) return;
          const w = parseInt(customW, 10);
          if (!Number.isFinite(w) || w < 1 || w > 1000) return;
          runExec(cmds.setPowerCap(selected.idx, w));
        }
        function applyPerfLevel() {
          if (!supported || !selected) return;
          runExec(cmds.setPerfLevel(selected.idx, level));
        }
        function restoreDefaults() {
          if (!supported || !selected) return;
          runExec(cmds.restore(selected.idx));
        }

        const vendorLabel = vendor === "unknown" ? "unknown" : vendor.toUpperCase();
        const capNum = selected && selected.powerCapW > 0 ? Math.round(selected.powerCapW) : 0;
        const presetsW = capNum > 0
          ? [Math.round(capNum * 0.5), Math.round(capNum * 0.7), Math.round(capNum * 0.85), capNum]
          : [100, 150, 200, 250];
        const levelOpts = [
          { k: "low",         lbl: "Low (power save)" },
          { k: "balanced",    lbl: "Balanced (default)" },
          { k: "performance", lbl: "Performance" },
          { k: "max",         lbl: "Max" },
        ];
        const wVal = parseInt(customW, 10);
        const wValid = Number.isFinite(wVal) && wVal >= 1 && wVal <= 1000;
        const inputStyle = { flex: 1, padding: "6px 8px", borderRadius: 6, border: "1px solid var(--line)", background: "var(--surface-2)", color: "var(--ink)", fontFamily: "var(--mono)", fontSize: 13 };

        return (
          <div className="nd-modal-bg" onClick={e => e.target === e.currentTarget && onClose()}>
            <div className="nd-modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 640, height: "auto" }}>
              <div className="nd-modal-head">
                <span className="nd-modal-title">GPU Tuning · {nodeId}</span>
                <span className="nd-modal-warn">⚠ Per-GPU · root · UNTESTED</span>
                <button className="nd-modal-close" onClick={onClose} title="Close (Esc)">×</button>
              </div>

              <div style={{ padding: "14px 16px", display: "flex", flexDirection: "column", gap: 14 }}>
                {(gpus.length === 0 || node.gpuPlaceholder) ? (
                  <div style={{ fontSize: 12, color: "var(--muted)", fontFamily: "var(--mono)" }}>
                    <em>No GPU available on this node.</em>
                    <div style={{ marginTop: 8, fontSize: 11, lineHeight: 1.5 }}>
                      If a GPU is physically present, verify that <code>rocm-smi</code> (AMD) or <code>nvidia-smi</code> (NVIDIA) is installed and on <code>$PATH</code> for the worker. See <code>worker/src/collectors/gpu_collector.cpp</code>.
                    </div>
                  </div>
                ) : (
                  <>
                    {gpus.length > 1 && (
                      <div>
                        <div style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--muted)", fontWeight: 700, marginBottom: 6 }}>GPU</div>
                        <select value={sel} onChange={e => { setSel(parseInt(e.target.value, 10) || 0); setResult(null); }}
                          style={{ ...inputStyle, width: "100%", fontSize: 12 }}>
                          {gpus.map(g => (
                            <option key={g.idx} value={g.idx}>
                              GPU {g.idx} · {g.vendor.toUpperCase()} · {Math.round(g.tempC)}°C · {Math.round(g.powerW)}W
                            </option>
                          ))}
                        </select>
                      </div>
                    )}

                    {selected && (
                      <div style={{ fontSize: 12, color: "var(--muted)", fontFamily: "var(--mono)" }}>
                        GPU {selected.idx} · <b style={{ color: "var(--ink)" }}>{vendorLabel}</b>
                        {" · "}<b style={{ color: "var(--ink)" }}>{Math.round(selected.tempC)}°C</b>
                        {" · "}<b style={{ color: "var(--ink)" }}>{Math.round(selected.powerW)}W</b>
                        {selected.powerCapW > 0 && <> / <b style={{ color: "var(--ink)" }}>{Math.round(selected.powerCapW)}W cap</b></>}
                        {selected.clockMhz > 0 && <> · <b style={{ color: "var(--ink)" }}>{Math.round(selected.clockMhz)} MHz</b></>}
                        {selected.memTotalMb > 0 && <> · {Math.round((selected.memUsedMb||0) / 1024)}/{Math.round(selected.memTotalMb/1024)} GiB VRAM</>}
                        {" · "}util <b style={{ color: "var(--ink)" }}>{Math.round(selected.utilPct)}%</b>
                      </div>
                    )}

                    {!supported && (
                      <div style={{ fontSize: 12, padding: "10px 12px", borderRadius: 6,
                        background: "color-mix(in oklab, var(--warn) 12%, var(--surface-2))",
                        color: "var(--ink)", border: "1px solid color-mix(in oklab, var(--warn) 40%, var(--line))", lineHeight: 1.5 }}>
                        <div style={{ fontWeight: 700, marginBottom: 4, color: "var(--warn)" }}>GPU tuning is not supported for this vendor.</div>
                        Detected: <b>{vendorLabel}</b>. This card has verified command templates only for AMD (<code>rocm-smi</code>) and NVIDIA (<code>nvidia-smi</code>). Add opcodes to the <code>GPU_CMDS</code> table in <code>server/web/node.html</code> to extend.
                      </div>
                    )}

                    {editingToken ? (
                      <div className="nd-shell-tokenrow" style={{ margin: 0 }}>
                        <span className="lbl">Token</span>
                        <input type="password" value={tokenDraft} onChange={e => setTokenDraft(e.target.value)}
                          onKeyDown={e => e.key === "Enter" && saveToken()}
                          placeholder="exec_token from worker.conf" autoFocus />
                        <button onClick={saveToken} disabled={!tokenDraft.trim()}>Save</button>
                      </div>
                    ) : (
                      <div className="nd-shell-tokenrow" style={{ margin: 0 }}>
                        <span className="lbl">Token</span>
                        <span style={{ flex: 1, fontFamily: "var(--mono)", fontSize: 12, color: "var(--muted)" }}>•••••••• (session)</span>
                        <span className="change" onClick={() => { setEditingToken(true); setTokenDraft(""); }}>[change]</span>
                      </div>
                    )}

                    <div>
                      <div style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--muted)", fontWeight: 700, marginBottom: 6 }}>Power cap (W)</div>
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
                        {presetsW.map(p => (
                          <button key={p} className="nd-freq-preset" disabled={!supported}
                            onClick={() => setCustomW(String(p))}
                            style={{ opacity: supported ? 1 : 0.5, cursor: supported ? "pointer" : "not-allowed" }}
                            title={`${p} W`}>
                            {p}W
                          </button>
                        ))}
                      </div>
                      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                        <input type="number" value={customW} onChange={e => setCustomW(e.target.value)}
                          disabled={!supported}
                          placeholder="Watts (1–1000)" min={1} max={1000}
                          style={{ ...inputStyle, opacity: supported ? 1 : 0.5 }} />
                        <button className="nd-freq-btn" onClick={applyPowerCap} disabled={!supported || !token || busy || !wValid}>Apply</button>
                      </div>
                    </div>

                    <div>
                      <div style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--muted)", fontWeight: 700, marginBottom: 6 }}>Clock / perf level</div>
                      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                        <select value={level} onChange={e => setLevel(e.target.value)} disabled={!supported}
                          style={{ ...inputStyle, fontSize: 12, opacity: supported ? 1 : 0.5 }}>
                          {levelOpts.map(o => <option key={o.k} value={o.k}>{o.lbl}</option>)}
                        </select>
                        <button className="nd-freq-btn" onClick={applyPerfLevel} disabled={!supported || !token || busy}>Set</button>
                      </div>
                    </div>

                    {result && (
                      <div style={{ fontFamily: "var(--mono)", fontSize: 12, padding: "6px 10px", borderRadius: 6,
                        background: result.tone === "bad" ? "color-mix(in oklab, var(--crit) 12%, var(--surface-2))" : "color-mix(in oklab, var(--ok) 10%, var(--surface-2))",
                        color: result.tone === "bad" ? "var(--crit)" : "var(--ink)", whiteSpace: "pre-wrap", wordBreak: "break-word" }}>
                        {result.text}
                      </div>
                    )}

                    {supported && (
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderTop: "1px solid var(--line)", paddingTop: 10 }}>
                        <span onClick={busy ? undefined : restoreDefaults}
                          style={{ fontSize: 11, color: busy ? "var(--muted)" : "var(--accent)", cursor: busy ? "default" : "pointer", textDecoration: "underline", textDecorationStyle: "dotted" }}>
                          Restore (reset cap + perf to default)
                        </span>
                        <span style={{ fontSize: 10, color: "var(--muted)" }}>{busy ? "running…" : ""}</span>
                      </div>
                    )}

                    <div style={{ fontSize: 10, padding: "6px 10px", borderRadius: 6,
                      background: "color-mix(in oklab, var(--warn) 8%, var(--surface-2))",
                      color: "var(--muted)", border: "1px dashed color-mix(in oklab, var(--warn) 30%, var(--line))", lineHeight: 1.5 }}>
                      ⚠ GPU tuning commands are <b>untested</b> on this build. Sanity-check the generated output in the result pane before relying on it. Grep <code>UNTESTED</code> in the source to audit.
                    </div>
                  </>
                )}
              </div>
            </div>
          </div>
        );
      }

      function NodeDetailPage() {
        const params = new URLSearchParams(window.location.search);
        const nodeId = params.get("node") || "";
        const [theme, setTheme] = useState(readThemeFromSettings);
        const [node, setNode] = useState(null);
        const [sortAsc, setSortAsc] = useState(true);
        const [notFound, setNotFound] = useState(false);
        const [shellOpen, setShellOpen] = useState(false);
        const [freqOpen, setFreqOpen] = useState(false);
        const [fanOpen, setFanOpen] = useState(false);
        const [gpuOpen, setGpuOpen] = useState(false);
        const [coresOpen, setCoresOpen] = useState(false);
        const now = useClock();
        const [settings, setSettings] = useState(() => readSettings());
        const baseThr = { ...THR, ...(settings.alerts || {}) };
        // Group power overrides apply when this node is in nodeGroups.
        const thr = window.nodeThresholds
          ? window.nodeThresholds(nodeId, settings, baseThr)
          : baseThr;
        const currentGroup = (settings.nodeGroups && settings.nodeGroups[nodeId]) || "";

        // Hydrate from server on mount so per-node thresholds reflect what was
        // saved on the settings page (which writes to /api/settings, not just
        // localStorage).
        useEffect(() => {
          if (!window.loadSettings) return;
          let cancelled = false;
          window.loadSettings().then(s => {
            if (cancelled || !s) return;
            if (s.theme && s.theme !== theme) setTheme(s.theme);
            setSettings(s);
          });
          return () => { cancelled = true; };
        }, []);

        function setNodeGroup(group) {
          const next = {
            ...settings,
            nodeGroups: { ...(settings.nodeGroups || {}) },
          };
          if (group) next.nodeGroups[nodeId] = group;
          else delete next.nodeGroups[nodeId];
          setSettings(next);
          writeSettings({ nodeGroups: next.nodeGroups });
        }

        useEffect(() => {
          document.documentElement.dataset.theme = theme;
          writeSettings({ theme });
        }, [theme]);

        useEffect(() => {
          if (!nodeId) { setNotFound(true); return; }
          return window.startLiveNodeDetail(nodeId, (n) => {
            if (n) setNode(n); else setNotFound(true);
          });
        }, [nodeId]);

        if (!nodeId || (notFound && !node)) {
          return (
            <div style={{ padding: 40, color: "var(--muted)", fontFamily: "var(--font)" }}>
              Node <strong>{nodeId || "(none)"}</strong> not found.
              {" "}<a href="index.html" style={{ color: "var(--accent)" }}>← Back</a>
            </div>
          );
        }
        if (!node) {
          return <div style={{ padding: 40, color: "var(--muted)", fontFamily: "var(--font)" }}>Loading {nodeId}…</div>;
        }

        const cpuTone  = tone(node.cpu,   thr.cpuWarn,       thr.cpuHot);
        const memTone  = tone(node.memPct, 75,               90);
        const swapTone = tone(node.swapPct, 20,              50);
        const tempTone = tone(node.temp,  thr.tempWarn,      thr.tempCrit);
        const powTone  = tone(node.power, thr.nodePowerWarn, thr.nodePowerHot);
        const fanRatio = node.fanTotal > 0 ? node.fanOk / node.fanTotal : 1;
        const fanTone  = fanRatio < 0.75 ? "crit" : fanRatio < 1 ? "warn" : "";
        const gpuTempTone = tone(node.gpuTempMax || 0, thr.tempWarn, thr.tempCrit);
        const isOffline = node.age >= thr.ageStale;
        const colorFor = t => t === "crit" ? "var(--crit)" : t === "warn" ? "var(--warn)" : "var(--ok)";

        const rawRows = node.rawMetrics.map(r => ({
          module: r.module || "",
          name: r.name || "",
          value: r.value,
          unit: r.unit || "",
        }));
        const sortedMetrics = [...rawRows].sort((a, b) => sortAsc
          ? a.module.localeCompare(b.module) || a.name.localeCompare(b.name)
          : b.module.localeCompare(a.module) || b.name.localeCompare(a.name));

        const tsText = node.timestampMs ? new Date(node.timestampMs).toLocaleTimeString("en-US",{hour12:false}) : "—";

        const controlActions = [
          {label:"Emergency Shell", icon:"›_", color:"var(--warn)",   desc:"Run a shell command on this node", onClick:() => setShellOpen(true)},
          {label:"CPU Frequency",   icon:"◱", color:"var(--accent)", desc:"Clamp CPU clock speed", onClick:() => setFreqOpen(true)},
          {label:"Fan Control",     icon:"✲", color:"var(--accent)", desc:"Override fan speed", onClick:() => setFanOpen(true)},
          {label:"GPU Tuning",      icon:"⚡", color:"var(--accent)", desc:"Power cap & clocks per GPU", onClick:() => setGpuOpen(true)},
          {label:"CPU Cores",       icon:"⊞", color:"var(--accent)", desc:"Online/offline individual cores", onClick:() => setCoresOpen(true)},
        ];

        return (
          <div className="nd-layout">
            <header className="nd-topbar">
              <a href="index.html" className="nd-back">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
                Back
              </a>
              <span className={`status-dot ${isOffline ? "crit" : cpuTone}`} />
              <span className="nd-node-name">{node.id}</span>
              <span className="nd-node-ip">{node.ip}</span>
              <span className={`node-age ${isOffline ? "crit" : ""}`}>
                <span className="node-age-dot" />
                {isOffline ? `offline · ${Math.floor(node.age)}s ago` : `live · ${node.age.toFixed(1)}s`}
              </span>
              <div className="nd-spacer" />
              <label style={{ display:"flex", alignItems:"center", gap:6, fontSize:11, fontWeight:600, color:"var(--muted)", letterSpacing:"0.04em", textTransform:"uppercase" }}>
                Group
                <select value={currentGroup} onChange={e => setNodeGroup(e.target.value)}
                  style={{ padding:"4px 8px", borderRadius:6, border:"1px solid var(--line)", background:"var(--surface-2)", color:"var(--ink)", fontFamily:"var(--font)", fontSize:12, fontWeight:600, cursor:"pointer" }}
                  title="Apply group power thresholds to this node">
                  <option value="">— ungrouped —</option>
                  <option value="idle">idle</option>
                  <option value="login">login</option>
                  <option value="cpu">cpu</option>
                  <option value="gpu">gpu</option>
                </select>
              </label>
              <span className="nd-clock">{now.toLocaleTimeString("en-US", { hour12: false })}</span>
              <button className="icon-btn" onClick={() => setTheme(t => t === "dark" ? "light" : "dark")} title="Toggle theme">
                {theme === "dark"
                  ? <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2"/></svg>
                  : <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                }
              </button>
            </header>

            <div className="nd-summary">
              <div className={`nd-kpi ${cpuTone}`}>
                <div className="nd-kpi-label">CPU Usage</div>
                <div className="nd-kpi-val">{Math.round(node.cpu)}<span className="u">%</span></div>
                <div className="nd-kpi-bar"><div className="nd-kpi-bar-fill" style={{ width: `${node.cpu}%`, background: colorFor(cpuTone) }} /></div>
                <div className="nd-kpi-sub">
                  {node.cpuFreqMhz > 0
                    ? `${formatMhz(node.cpuFreqMhz)}${node.cpuGovernor ? ` · ${node.cpuGovernor}` : ""}${node.cpuCoreCount > 0 ? ` · ${node.cpuCoresOnline}/${node.cpuCoreCount} cores` : ""}`
                    : (node.cpuCoreCount > 0
                        ? `${node.cpuCoresOnline}/${node.cpuCoreCount} cores online`
                        : `Warn ${thr.cpuWarn}% · Crit ${thr.cpuHot}%`)}
                </div>
              </div>
              <div className={`nd-kpi ${memTone}`}>
                <div className="nd-kpi-label">Memory</div>
                <div className="nd-kpi-val">{node.memG.toFixed(1)}<span className="u">/{node.memTotal}G</span></div>
                <div className="nd-kpi-bar"><div className="nd-kpi-bar-fill" style={{ width: `${Math.min(100, node.memPct)}%`, background: "var(--mem)" }} /></div>
                <div className="nd-kpi-sub">{node.memPct.toFixed(0)}% used · {(node.memTotal - node.memG).toFixed(1)}G free</div>
              </div>
              <div className={`nd-kpi ${swapTone}`}>
                <div className="nd-kpi-label">Swap</div>
                <div className="nd-kpi-val">{node.swapG.toFixed(1)}<span className="u">/{node.swapTotal}G</span></div>
                <div className="nd-kpi-bar"><div className="nd-kpi-bar-fill" style={{ width: `${Math.min(100, node.swapPct)}%`, background: "var(--swap)" }} /></div>
                <div className="nd-kpi-sub">{node.swapPct.toFixed(0)}% used</div>
              </div>
              <div className="nd-kpi">
                <div className="nd-kpi-label">Load Average</div>
                <div className="nd-load-chips">
                  {["1m","5m","15m"].map((l,i) => (
                    <div className="nd-load-chip" key={l}><span>{l}</span>{node.load[i].toFixed(2)}</div>
                  ))}
                </div>
                <div className="nd-kpi-sub">From /proc/loadavg</div>
              </div>
              <div className={`nd-kpi ${tempTone}`}>
                <div className="nd-kpi-label">CPU Temp</div>
                <div className="nd-kpi-val">{Math.round(node.temp)}<span className="u">°C</span></div>
                <div className="nd-kpi-bar"><div className="nd-kpi-bar-fill" style={{ width: `${Math.min(100, node.temp)}%`, background: colorFor(tempTone) }} /></div>
                <div className="nd-kpi-sub">Warn {thr.tempWarn}° · Crit {thr.tempCrit}°</div>
              </div>
              <div className={`nd-kpi ${fanTone}`}>
                <div className="nd-kpi-label">Fans</div>
                <div className="nd-kpi-val">{node.fanOk}<span className="u">/{node.fanTotal} OK</span></div>
                <div className="nd-kpi-sub">{(node.fanRpm/1000).toFixed(1)} kRPM avg</div>
              </div>
              <div className={`nd-kpi power-kpi ${powTone}`}>
                <div className="nd-kpi-label">Node Power</div>
                <div className="nd-kpi-val">{Math.round(node.power)}<span className="u">W</span></div>
                <div className="nd-kpi-bar"><div className="nd-kpi-bar-fill" style={{ width:`${Math.min(100,(node.power/thr.nodePowerHot)*100)}%`, background: colorFor(powTone) }} /></div>
                <div className="nd-kpi-sub">Warn {thr.nodePowerWarn}W · Crit {thr.nodePowerHot}W</div>
              </div>
              {node.gpuCount > 0 && (
                <div className={`nd-kpi ${node.gpuPlaceholder ? "" : gpuTempTone}`}>
                  <div className="nd-kpi-label">GPU</div>
                  {node.gpuPlaceholder ? (
                    <>
                      <div className="nd-kpi-val" style={{ fontSize: 16, color: "var(--muted)", fontWeight: 700 }}>No GPU</div>
                      <div className="nd-kpi-sub">not detected on this node</div>
                    </>
                  ) : (
                    <>
                      <div className="nd-kpi-val">{Math.round(node.gpuTempMax)}<span className="u">°C</span></div>
                      <div className="nd-kpi-bar"><div className="nd-kpi-bar-fill" style={{ width: `${Math.min(100, node.gpuTempMax)}%`, background: colorFor(gpuTempTone) }} /></div>
                      <div className="nd-kpi-sub">
                        {node.gpuCount}× {node.gpuVendor} · {Math.round(node.gpuPowerSumW)}W · {Math.round(node.gpuUtilAvgPct)}%
                      </div>
                    </>
                  )}
                </div>
              )}
            </div>

            <div className="nd-body">
              <div className="nd-card">
                <h3>Resource Usage</h3>
                <div className="nd-bar-grid">
                  <div className="nd-bar-item">
                    <div className="nd-bar-header">
                      <span className="nd-bar-label">CPU</span>
                      <span className={`nd-bar-value ${cpuTone}`}>{Math.round(node.cpu)}<span className="u">%</span></span>
                    </div>
                    <div className="nd-bar-track"><div className="nd-bar-fill" style={{ width:`${node.cpu}%`, background: colorFor(cpuTone) }} /></div>
                    <MiniChart values={node.cpuHistory} color={colorFor(cpuTone)} height={52} />
                  </div>
                  <div className="nd-bar-item">
                    <div className="nd-bar-header">
                      <span className="nd-bar-label">Memory</span>
                      <span className={`nd-bar-value ${memTone}`}>{node.memG.toFixed(1)}<span className="u">G</span></span>
                    </div>
                    <div className="nd-bar-track"><div className="nd-bar-fill" style={{ width:`${Math.min(100, node.memPct)}%`, background:"var(--mem)" }} /></div>
                    <MiniChart values={node.memHistory} color="var(--mem)" height={52} />
                  </div>
                  <div className="nd-bar-item">
                    <div className="nd-bar-header">
                      <span className="nd-bar-label">Swap</span>
                      <span className={`nd-bar-value ${swapTone}`}>{node.swapG.toFixed(1)}<span className="u">G</span></span>
                    </div>
                    <div className="nd-bar-track"><div className="nd-bar-fill" style={{ width:`${Math.min(100, node.swapPct)}%`, background:"var(--swap)" }} /></div>
                    <MiniChart values={node.swapHistory} color="var(--swap)" height={52} />
                  </div>
                  <div className="nd-bar-item">
                    <div className="nd-bar-header">
                      <span className="nd-bar-label">Temperature</span>
                      <span className={`nd-bar-value ${tempTone}`}>{Math.round(node.temp)}<span className="u">°C</span></span>
                    </div>
                    <div className="nd-bar-track"><div className="nd-bar-fill" style={{ width:`${Math.min(100,node.temp)}%`, background: colorFor(tempTone) }} /></div>
                    <MiniChart values={node.tempHistory} color={colorFor(tempTone)} height={52} />
                  </div>
                </div>
              </div>

              <div className="nd-card">
                <h3>Power Draw</h3>
                <div style={{ marginBottom: 10 }}>
                  <div className="nd-bar-header">
                    <span className="nd-bar-label">Node Power</span>
                    <span className={`nd-bar-value ${powTone}`} style={{ fontSize: 22 }}>{Math.round(node.power)}<span className="u">W</span></span>
                  </div>
                  <div className="nd-bar-track" style={{ height: 7, marginTop: 6 }}>
                    <div className="nd-bar-fill" style={{ width:`${Math.min(100,(node.power/thr.nodePowerHot)*100)}%`, background: colorFor(powTone) }} />
                  </div>
                </div>
                <MiniChart values={node.powerHistory.map(v => v * 10)} color={colorFor(powTone)} height={80} />
                <div style={{ marginTop: 12, display: "flex", gap: 12 }}>
                  {[["Warn threshold", `${thr.nodePowerWarn}W`], ["Crit threshold", `${thr.nodePowerHot}W`]].map(([k,v]) => (
                    <div key={k} style={{ flex: 1, padding: "6px 10px", borderRadius: 8, background: "var(--surface-2)", border: "1px solid var(--line)" }}>
                      <div style={{ fontSize: 9, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--muted)", fontWeight: 700 }}>{k}</div>
                      <div style={{ fontSize: 16, fontWeight: 800, color: "var(--ink)", fontVariantNumeric: "tabular-nums" }}>{v}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="nd-card">
                <h3>Thermal Sensors</h3>
                {(() => {
                  const therm = {};
                  for (const m of node.rawMetrics || []) {
                    if (m.module === "thermal" && typeof m.value === "number") therm[m.name] = m.value;
                  }
                  const toneFor = (val, warn, crit) => val >= crit ? "crit" : val >= warn ? "warn" : "";
                  const sensors = [];

                  // Per-CPU-package readings.
                  const pkgKeys = Object.keys(therm).filter(k => /^cpu_package\d+_c$/.test(k)).sort();
                  const cpuWarn = therm.cpu_warn_c ?? thr.tempWarn;
                  const cpuCrit = therm.cpu_crit_c ?? thr.tempCrit;
                  for (const k of pkgKeys) {
                    const idx = k.match(/^cpu_package(\d+)_c$/)[1];
                    const val = therm[k];
                    sensors.push({ label: `CPU${idx}`, val, tone: toneFor(val, cpuWarn, cpuCrit) });
                  }
                  if (typeof therm.cpu_package_max_c === "number" && pkgKeys.length > 1) {
                    const val = therm.cpu_package_max_c;
                    sensors.push({ label: "CPU Max", val, tone: toneFor(val, cpuWarn, cpuCrit) });
                  }

                  if (typeof therm.nvme_max_c === "number") {
                    const val = therm.nvme_max_c;
                    const count = therm.nvme_count;
                    const warn = therm.nvme_warn_c ?? 70;
                    const crit = therm.nvme_crit_c ?? 80;
                    sensors.push({ label: count ? `NVMe Max (${count|0})` : "NVMe Max", val, tone: toneFor(val, warn, crit) });
                  }
                  if (typeof therm.nic_max_c === "number") {
                    const val = therm.nic_max_c;
                    const count = therm.nic_count;
                    const warn = therm.nic_warn_c ?? 85;
                    const crit = therm.nic_crit_c ?? 95;
                    sensors.push({ label: count ? `NIC Max (${count|0})` : "NIC Max", val, tone: toneFor(val, warn, crit) });
                  }
                  if (typeof therm.chipset_c === "number") {
                    const val = therm.chipset_c;
                    const warn = therm.chipset_warn_c ?? 75;
                    const crit = therm.chipset_crit_c ?? 85;
                    sensors.push({ label: "Chipset", val, tone: toneFor(val, warn, crit) });
                  }

                  // Fallback: any thermal.*_c reading we didn't already cover.
                  const covered = new Set([...pkgKeys, "cpu_package_max_c", "nvme_max_c", "nic_max_c", "chipset_c",
                                           "cpu_warn_c","cpu_crit_c","nvme_warn_c","nvme_crit_c","nic_warn_c","nic_crit_c","chipset_warn_c","chipset_crit_c"]);
                  for (const [k, v] of Object.entries(therm)) {
                    if (covered.has(k)) continue;
                    if (!k.endsWith("_c")) continue;
                    const label = k.replace(/_c$/, "").replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
                    sensors.push({ label, val: v, tone: toneFor(v, thr.tempWarn, thr.tempCrit) });
                  }

                  if (sensors.length === 0) {
                    return <div style={{ fontSize: 12, color: "var(--muted)" }}>No thermal sensors reported.</div>;
                  }

                  return (
                    <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(120px, 1fr))", gap:8 }}>
                      {sensors.map(s => (
                        <div key={s.label} className={`nd-kpi ${s.tone}`} style={{ padding:"10px 12px" }}>
                          <div className="nd-kpi-label">{s.label}</div>
                          <div className="nd-kpi-val" style={{ fontSize:18 }}>
                            {typeof s.val === "number" ? s.val.toFixed(1) : "—"}
                            <span className="u">°C</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  );
                })()}
              </div>

              <div className="nd-card">
                <h3>Fan Status</h3>
                <div style={{ display:"flex", gap:16, marginBottom:14, flexWrap:"wrap" }}>
                  {[
                    { label:"Total fans", val: node.fanTotal || 0 },
                    { label:"Fans OK",    val: node.fanOk || 0 },
                    { label:"Avg RPM",    val: (node.fanRpm || 0).toFixed(0) },
                    { label:"OK Ratio",   val: `${(fanRatio*100).toFixed(0)}%` },
                  ].map(s => (
                    <div key={s.label} style={{ flex:1, minWidth:80, padding:"8px 12px", borderRadius:8, background:"var(--surface-2)", border:"1px solid var(--line)" }}>
                      <div style={{ fontSize:9, letterSpacing:"0.08em", textTransform:"uppercase", color:"var(--muted)", fontWeight:700 }}>{s.label}</div>
                      <div style={{ fontSize:18, fontWeight:800, color:"var(--ink)", fontVariantNumeric:"tabular-nums" }}>{s.val}</div>
                    </div>
                  ))}
                </div>
                <div className="nd-fan-grid">
                  {(node.perFan.length > 0 ? node.perFan : Array.from({ length: Math.max(0, node.fanTotal|0) }).map((_, i) => ({ name: `fan_${i+1}`, rpm: 0 })))
                    .map((f, i) => {
                      const ok = f.rpm > 0;
                      const label = (f.name || "").replace(/_rpm$/, "").toUpperCase();
                      return (
                        <div key={f.name + i} className={`nd-fan-chip ${ok ? "ok" : "fail"}`}>
                          <div className="nd-fan-label">{label || `FAN${i+1}`}</div>
                          <div style={{ fontSize: 13, fontWeight: 800, fontVariantNumeric: "tabular-nums" }}>
                            {ok ? `${(f.rpm/1000).toFixed(1)}k` : "FAIL"}
                          </div>
                          <div style={{ fontSize: 8, opacity: 0.7, fontWeight: 600 }}>RPM</div>
                        </div>
                      );
                    })
                  }
                </div>
              </div>

              {node.gpuCount > 0 && node.gpuPlaceholder && (
                <div className="nd-card full">
                  <h3>GPUs</h3>
                  <div style={{ padding: "14px 16px", borderRadius: 8, background: "var(--surface-2)", border: "1px dashed var(--line)", color: "var(--muted)", fontSize: 13, lineHeight: 1.5 }}>
                    <div style={{ fontWeight: 700, color: "var(--ink)", marginBottom: 4 }}>No GPU available on this node.</div>
                    This card is rendered as a placeholder for UI tuning. Once a GPU is detected by the worker (AMD <code>rocm-smi</code> or NVIDIA <code>nvidia-smi</code>), per-GPU stats will appear here. Disable via <code>?fakegpu=0</code> or set <code>FAKE_GPU_DEFAULT_COUNT = 0</code> in <code>live-data.js</code>.
                  </div>
                </div>
              )}
              {node.gpuCount > 0 && !node.gpuPlaceholder && (
                <div className="nd-card full">
                  <h3>GPUs</h3>
                  <div style={{ display:"flex", gap:16, marginBottom:14, flexWrap:"wrap" }}>
                    {[
                      { label:"Count",        val: node.gpuCount },
                      { label:"Vendor",       val: (node.gpuVendor || "unknown").toUpperCase() },
                      { label:"Max temp",     val: `${Math.round(node.gpuTempMax)}°C` },
                      { label:"Total power",  val: `${Math.round(node.gpuPowerSumW)}W` },
                      { label:"Avg util",     val: `${Math.round(node.gpuUtilAvgPct)}%` },
                    ].map(s => (
                      <div key={s.label} style={{ flex:1, minWidth:80, padding:"8px 12px", borderRadius:8, background:"var(--surface-2)", border:"1px solid var(--line)" }}>
                        <div style={{ fontSize:9, letterSpacing:"0.08em", textTransform:"uppercase", color:"var(--muted)", fontWeight:700 }}>{s.label}</div>
                        <div style={{ fontSize:18, fontWeight:800, color:"var(--ink)", fontVariantNumeric:"tabular-nums" }}>{s.val}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{ overflowX:"auto" }}>
                    <table className="nd-metrics-table">
                      <thead>
                        <tr>
                          <th>#</th><th>Vendor</th><th>Temp</th><th>Util</th>
                          <th>Power</th><th>Cap</th><th>VRAM</th><th>Clock</th>
                        </tr>
                      </thead>
                      <tbody>
                        {(node.gpus || []).map(g => (
                          <tr key={g.idx}>
                            <td><span className="nd-module-badge">GPU{g.idx}</span></td>
                            <td><span className="nd-metric-name">{(g.vendor || "unknown").toUpperCase()}</span></td>
                            <td><span className="nd-metric-val">{g.tempC > 0 ? Math.round(g.tempC) : "—"}</span> <span className="nd-metric-unit">{g.tempC > 0 ? "°C" : ""}</span></td>
                            <td><span className="nd-metric-val">{g.utilPct > 0 ? Math.round(g.utilPct) : "—"}</span> <span className="nd-metric-unit">{g.utilPct > 0 ? "%" : ""}</span></td>
                            <td><span className="nd-metric-val">{g.powerW > 0 ? Math.round(g.powerW) : "—"}</span> <span className="nd-metric-unit">{g.powerW > 0 ? "W" : ""}</span></td>
                            <td><span className="nd-metric-val">{g.powerCapW > 0 ? Math.round(g.powerCapW) : "—"}</span> <span className="nd-metric-unit">{g.powerCapW > 0 ? "W" : ""}</span></td>
                            <td><span className="nd-metric-val">{g.memTotalMb > 0 ? `${Math.round((g.memUsedMb||0)/1024)}/${Math.round(g.memTotalMb/1024)}` : "—"}</span> <span className="nd-metric-unit">{g.memTotalMb > 0 ? "GiB" : ""}</span></td>
                            <td><span className="nd-metric-val">{g.clockMhz > 0 ? Math.round(g.clockMhz) : "—"}</span> <span className="nd-metric-unit">{g.clockMhz > 0 ? "MHz" : ""}</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              <div className="nd-card full">
                <h3>Control Panel</h3>
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
                  {controlActions.map((a,i) => (
                    <button key={i} onClick={a.onClick || (()=>alert(`[Placeholder] ${a.label}`))} style={{
                      display:"flex",flexDirection:"column",alignItems:"flex-start",
                      gap:4,padding:"12px 14px",borderRadius:10,
                      border:`1px solid color-mix(in oklab, ${a.color} 25%, var(--line))`,
                      background:`color-mix(in oklab, ${a.color} 7%, var(--surface-2))`,
                      cursor:"pointer",textAlign:"left",fontFamily:"var(--font)",
                      transition:"all 150ms",
                    }}>
                      <span style={{fontSize:18,lineHeight:1}}>{a.icon}</span>
                      <span style={{fontSize:11,fontWeight:800,color:a.color}}>{a.label}</span>
                      <span style={{fontSize:10,color:"var(--muted)",fontWeight:500}}>{a.desc}</span>
                    </button>
                  ))}
                </div>
              </div>

              <div className="nd-card full">
                <h3>
                  Raw Metrics
                  <span style={{ fontSize:10, color:"var(--muted)", fontWeight:600, textTransform:"none", letterSpacing:0, marginLeft:4 }}>
                    {rawRows.length} entries · updated {tsText}
                  </span>
                </h3>
                <div style={{ overflowX:"auto" }}>
                  <table className="nd-metrics-table">
                    <thead>
                      <tr>
                        <th><button style={{ background:"none",border:"none",cursor:"pointer",font:"inherit",color:"inherit",padding:0 }} onClick={() => setSortAsc(a => !a)}>Module {sortAsc ? "↑" : "↓"}</button></th>
                        <th>Metric</th>
                        <th>Value</th>
                        <th>Unit</th>
                      </tr>
                    </thead>
                    <tbody>
                      {sortedMetrics.map((r, i) => (
                        <tr key={`${r.module}-${r.name}-${i}`}>
                          <td><span className="nd-module-badge">{r.module}</span></td>
                          <td><span className="nd-metric-name">{r.name}</span></td>
                          <td><span className="nd-metric-val">{formatMetricValue(r.value, r.name, r.unit)}</span></td>
                          <td><span className="nd-metric-unit">{displayUnit(r.unit)}</span></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <footer className="nd-footer">
              <span>Node <strong>{node.id}</strong><span className="dot-sep">·</span>{node.ip}<span className="dot-sep">·</span>Live data refresh 1.5s</span>
              <span>HPC Cockpit<span className="dot-sep">·</span>NTU</span>
            </footer>

            {shellOpen && <ShellModal nodeId={node.id} onClose={() => setShellOpen(false)} />}
            {freqOpen && <FreqModal nodeId={node.id} node={node} onClose={() => setFreqOpen(false)} />}
            {fanOpen && <FanModal nodeId={node.id} node={node} onClose={() => setFanOpen(false)} />}
            {gpuOpen && <GpuModal nodeId={node.id} node={node} onClose={() => setGpuOpen(false)} />}
            {coresOpen && <CoreToggleModal nodeId={node.id} node={node} onClose={() => setCoresOpen(false)} />}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<NodeDetailPage />);
    </script>
  </body>
</html>

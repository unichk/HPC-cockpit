        for (const line of (text || "").split("\n")) {
          const t = line.trim().split(/\s+/);
          if (t[0] === "POLICY") out.policy = t[1] || null;
          else if (t[0] === "ASPMON") out.aspmOn = +t[1];
          else if (t[0] === "SW" && BDF_RE.test(t[1])) {
            const kv = Object.fromEntries(t.slice(3).map(x => x.split("=")).map(([k, v]) => [k, +v]));
            out.switches.push({ bdf: t[1], l1: t[2] === "1", ...kv });
          } else if (t[0] === "NL" && BDF_RE.test(t[1]) && BDF_RE.test(t[2])) {
            const kv = Object.fromEntries(t.slice(3).map(x => x.split("=")).map(([k, v]) => [k, +v]));
            out.links.push({ port: t[1], card: t[2], ...kv });
          } else if (t[0] === "RT" && BDF_RE.test(t[1])) {
            out.retrain.push({ port: t[1], result: t.slice(2).join(" ") });
          }
        }
        return out.policy ? out : null;
      }

      function PcieModal({ nodeId, onClose }) {
        const [token, setToken] = useState(() => sessionStorage.getItem("cockpit_exec_token") || "");
        const [tokenDraft, setTokenDraft] = useState("");
        const [editingToken, setEditingToken] = useState(() => !sessionStorage.getItem("cockpit_exec_token"));
        const [state, setState] = useState(null);
        const [want, setWant] = useState({});        // bdf -> bool
        const [wantPolicy, setWantPolicy] = useState("");
        const [wantGen, setWantGen] = useState({});  // port bdf -> target gen
        const [busy, setBusy] = useState(false);
        const [result, setResult] = useState(null);

        useEffect(() => {
          const onKey = (e) => { if (e.key === "Escape") onClose(); };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [onClose]);

        function saveToken() {
          const t = tokenDraft.trim();
          if (!t) return;
          sessionStorage.setItem("cockpit_exec_token", t);
          setToken(t); setTokenDraft(""); setEditingToken(false);
        }

        async function run(cmd, okText, timeoutS = 20) {
          if (!token || busy) return;
          setBusy(true);
          try {
            const r = await fetch(`/api/node/${encodeURIComponent(nodeId)}/exec`, {
              method: "POST",
              headers: { "Content-Type": "application/json", "X-Exec-Token": token },
              body: JSON.stringify({ cmd, timeout_s: timeoutS }),
            });
            const body = await r.json().catch(() => null);
            if (!r.ok || !body) { setResult({ tone: "bad", text: (body && body.error) || `HTTP ${r.status}` }); return; }
            if (typeof body.exit === "number" && body.exit !== 0) {
              setResult({ tone: "bad", text: `exit=${body.exit} ${(body.stderr || "").trim()}` }); return;
            }
            const st = parsePcie(body.stdout);
            if (!st) { setResult({ tone: "bad", text: "no PCIe data from node" }); return; }
            setState(st);
            setWant(Object.fromEntries(st.switches.map(sw => [sw.bdf, sw.l1])));
            setWantPolicy(st.policy);
            setWantGen(Object.fromEntries(st.links.map(l => [l.port, l.cur])));
            if (okText) setResult({ tone: "ok", text: okText(st) });
          } catch (err) {
            setResult({ tone: "bad", text: String(err && err.message || err) });
          } finally {
            setBusy(false);
          }
        }

        useEffect(() => { if (token) run(PCIE_PROBE); }, [token]);

        const switches = state ? state.switches : [];
        const onList = switches.filter(sw => want[sw.bdf]).map(sw => sw.bdf);
        const offList = switches.filter(sw => !want[sw.bdf]).map(sw => sw.bdf);
        const perLink = POWER_POLICY(wantPolicy);
        const links = state ? state.links : [];
        const genChanges = links.filter(l => wantGen[l.port] && wantGen[l.port] !== l.cur);
        const aspmChanged = (state && wantPolicy !== state.policy) || (perLink && switches.some(sw => !!want[sw.bdf] !== sw.l1));
        const changed = aspmChanged || genChanges.length > 0;
        const slowGpuLink = links.some(l => l.gpu > 0 && (wantGen[l.port] || l.cur) < l.max);
        const slowLink = links.some(l => (wantGen[l.port] || l.cur) < l.max);
        const gpuPicked = perLink && switches.some(sw => want[sw.bdf] && sw.gpu > 0);
        const ibPicked = perLink && switches.some(sw => want[sw.bdf] && (sw.ib > 0 || sw.eth > 0));
        const summarize = st => `policy ${st.policy} · L1 on ${st.switches.filter(x => x.l1).length}/${st.switches.length} uplinks`;

        function apply() {
          if (![...onList, ...offList].every(b => BDF_RE.test(b))) return;
          if (!ASPM_POLICIES.includes(wantPolicy)) return;
          if (!genChanges.every(l => BDF_RE.test(l.port) && BDF_RE.test(l.card) && Number.isInteger(wantGen[l.port])
                                     && wantGen[l.port] >= 1 && wantGen[l.port] <= l.max)) return;
          const dev = b => `/sys/bus/pci/devices/${b}/link/l1_aspm`;
          const setPolicy = `echo ${wantPolicy} > /sys/module/pcie_aspm/parameters/policy`;
          const aspmCmd = !aspmChanged ? []
            : !perLink ? [setPolicy]
            : [...offList.map(b => `echo 0 > ${dev(b)}`), setPolicy, ...onList.map(b => `echo 1 > ${dev(b)}`)];
          const genCmd = genChanges.length ? [RETRAIN_FN, ...genChanges.map(l => `rt ${l.port} ${l.card} ${wantGen[l.port]}`)] : [];
          const cmd = [`set -e`, ...aspmCmd, `set +e`, ...genCmd, PCIE_PROBE].join("\n");
          const requested = aspmChanged && perLink ? [...onList] : [];
          run(cmd, st => {
            // The kernel can keep a link out of L1 even after the write: it
            // drops L1 when the exit latency exceeds what a device below the
            // switch (e.g. a GPU) declares acceptable. Say so instead of
            // reporting success.
            const refused = requested.filter(b => !(st.switches.find(x => x.bdf === b) || {}).l1);
            const parts = [summarize(st)];
            if (refused.length) parts.push(`kernel kept L1 off on ${refused.map(b => b.slice(5)).join(", ")} (devices below reject the L1 exit latency)`);
            for (const r of st.retrain) {
              const l = st.links.find(x => x.port === r.port);
              parts.push(`${r.port.slice(5)} → ${l ? `Gen${l.cur} x${l.w}` : "?"} ${r.result}`);
            }
            return parts.join("\n");
          }, genChanges.length ? 120 : 20);
        }
        function restore() {
          const slow = links.filter(l => l.cur < l.max && BDF_RE.test(l.port) && BDF_RE.test(l.card));
          const cmd = [`set -e`, `echo default > /sys/module/pcie_aspm/parameters/policy`, `set +e`,
                       ...(slow.length ? [RETRAIN_FN, ...slow.map(l => `rt ${l.port} ${l.card} ${l.max}`)] : []),
                       PCIE_PROBE].join("\n");
          run(cmd, st => [`restored: ${summarize(st)}`,
                          ...st.retrain.map(r => `${r.port.slice(5)} → max speed ${r.result}`)].join("\n"),
              slow.length ? 120 : 20);
        }

        const behind = sw => {
          const parts = [];
          if (sw.gpu) parts.push(`GPU×${sw.gpu}`);
          if (sw.ib) parts.push(`IB×${sw.ib}`);
          if (sw.eth) parts.push(`ETH×${sw.eth}`);
          if (sw.nvme) parts.push(`NVMe×${sw.nvme}`);
          if (sw.other) parts.push(`other×${sw.other}`);
          return parts.length ? parts.join(" ") : "nothing (empty slots)";
        };
        const lineNote = (tone) => ({ fontSize: 11, padding: "5px 8px", borderRadius: 6, color: `var(--${tone})`, fontWeight: 600,
          background: `color-mix(in oklab, var(--${tone}) 10%, var(--surface-2))` });

        return (
          <div className="nd-modal-bg" onClick={e => e.target === e.currentTarget && onClose()}>
            <div className="nd-modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 560, height: "auto" }}>
              <div className="nd-modal-head">
                <span className="nd-modal-title">PCIe Tuning · {nodeId}</span>
                <span className="nd-modal-warn">⚠ ASPM · link speed · root</span>
                <button className="nd-modal-close" onClick={onClose} title="Close (Esc)">×</button>
              </div>

              <div style={{ padding: "14px 16px", display: "flex", flexDirection: "column", gap: 12, overflowY: "auto", minHeight: 0, flex: 1 }}>
                {editingToken ? (
                  <div className="nd-shell-tokenrow" style={{ margin: 0 }}>
                    <span className="lbl">Token</span>
                    <input type="password" value={tokenDraft} onChange={e => setTokenDraft(e.target.value)}
                      onKeyDown={e => e.key === "Enter" && saveToken()}
                      placeholder="exec_token from worker.conf" autoFocus />
                    <button onClick={saveToken} disabled={!tokenDraft.trim()}>Save</button>
                  </div>
                ) : (
                  <div className="nd-shell-tokenrow" style={{ margin: 0 }}>
                    <span className="lbl">Token</span>
                    <span style={{ flex: 1, fontFamily: "var(--mono)", fontSize: 12, color: "var(--muted)" }}>•••••••• (session)</span>
                    <span className="change" onClick={() => { setEditingToken(true); setTokenDraft(""); }}>[change]</span>
                  </div>
                )}

                <div style={{ fontSize: 12, color: "var(--muted)", fontFamily: "var(--mono)" }}>
                  {state
                    ? <>ASPM policy <b style={{ color: "var(--ink)" }}>{state.policy}</b> · {state.aspmOn} link states on</>
                    : (token ? (busy ? "reading…" : "—") : "set token to read")}
                </div>

                {state && (
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <span style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--muted)", fontWeight: 700, width: 60 }}>Policy</span>
                    <select value={wantPolicy} onChange={e => setWantPolicy(e.target.value)}
                      style={{ flex: 1, padding: "6px 8px", borderRadius: 6, border: "1px solid var(--line)", background: "var(--surface-2)", color: "var(--ink)", fontFamily: "var(--mono)", fontSize: 12 }}>
                      {ASPM_POLICIES.map(p => <option key={p} value={p}>{p}{p === state.policy ? " (current)" : ""}</option>)}
                    </select>
                  </div>
                )}

                {switches.length > 0 && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 4, opacity: perLink ? 1 : 0.5 }}>
                    <div style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--muted)", fontWeight: 700 }}>
                      Switch uplinks · L1
                    </div>
                    {switches.map(sw => (
                      <label key={sw.bdf} style={{ display: "flex", gap: 10, alignItems: "center", fontSize: 12, fontFamily: "var(--mono)",
                        padding: "6px 8px", borderRadius: 6, background: "var(--surface-2)", cursor: "pointer" }}>
                        <input type="checkbox" checked={!!want[sw.bdf]} disabled={!perLink}
                          onChange={e => setWant(w => ({ ...w, [sw.bdf]: e.target.checked }))} />
                        <span style={{ width: 96 }}>{sw.bdf.slice(5)}</span>
                        <span style={{ flex: 1, color: sw.gpu ? "var(--warn)" : "var(--ink)" }}>{behind(sw)}</span>
                        <span style={{ color: sw.l1 ? "var(--ok)" : "var(--muted)", fontWeight: 700 }}>{sw.l1 ? "L1" : "off"}</span>
                      </label>
                    ))}
                  </div>
                )}
                {state && switches.length === 0 && <div style={lineNote("warn")}>No ASPM-capable switch uplinks on this node.</div>}
                {state && switches.length > 0 && !perLink && (
                  <div style={{ fontSize: 11, color: "var(--muted)" }}>
                    {wantPolicy === "performance" ? "ASPM off on every link." : "BIOS settings on every link."} Per-link L1 needs powersave.
                  </div>
                )}
                {wantPolicy === "powersupersave" && <div style={lineNote("warn")}>Also enables L1 substates where supported.</div>}

                {links.length > 0 && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <span style={{ flex: 1, fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--muted)", fontWeight: 700 }}>
                        Network cards · PCIe speed (no ASPM)
                      </span>
                      <button className="nd-freq-btn" disabled={busy} style={{ padding: "2px 8px", fontSize: 11 }}
                        onClick={() => setWantGen(Object.fromEntries(links.map(l => [l.port, Math.min(2, l.max)])))}
                        title="Gen2 at idle: about −25 W measured on scc04 (PSU output), IB ports stay up">Idle · Gen2</button>
                      <button className="nd-freq-btn" disabled={busy} style={{ padding: "2px 8px", fontSize: 11 }}
                        onClick={() => setWantGen(Object.fromEntries(links.map(l => [l.port, l.max])))}
                        title="Full speed before jobs">Run · max</button>
                    </div>
                    {links.map(l => (
                      <div key={l.port} style={{ display: "flex", gap: 10, alignItems: "center", fontSize: 12, fontFamily: "var(--mono)",
                        padding: "6px 8px", borderRadius: 6, background: "var(--surface-2)" }}>
                        <span style={{ width: 96 }}>{l.card.slice(5)}</span>
                        <span style={{ flex: 1, color: l.gpu ? "var(--warn)" : "var(--ink)" }}>
                          IB {l.ia}/{l.it} active{l.gpu ? ` · GPU×${l.gpu} on switch` : ""}
                        </span>
                        <span style={{ color: !l.up ? "var(--crit)" : l.cur < l.max ? "var(--ok)" : "var(--muted)", fontWeight: 700 }}>
                          {l.up ? `Gen${l.cur} x${l.w}` : "DOWN"}
                        </span>
                        <select value={wantGen[l.port] || l.cur} disabled={busy}
                          onChange={e => setWantGen(g => ({ ...g, [l.port]: +e.target.value }))}
                          style={{ padding: "3px 6px", borderRadius: 6, border: "1px solid var(--line)", background: "var(--surface)", color: "var(--ink)", fontFamily: "var(--mono)", fontSize: 12 }}>
                          {Array.from({ length: l.max }, (_, i) => l.max - i).map(g =>
                            <option key={g} value={g}>Gen{g}{g === l.max ? " (max)" : ""}</option>)}
                        </select>
                      </div>
                    ))}
                  </div>
                )}
                {slowGpuLink && <div style={lineNote("crit")}>Card on a GPU switch below max: NCCL/GPUDirect throughput collapses. Run · max before jobs.</div>}
                {!slowGpuLink && slowLink && (
                  <div style={lineNote("warn")}>
                    PCIe below max: ~{GEN_GBPS[Math.min(...links.map(l => wantGen[l.port] || l.cur))]} Gb/s per card. Run · max before jobs.
                  </div>
                )}

                {gpuPicked && <div style={lineNote("crit")}>GPU links: wake-up latency on GPU transfers.</div>}
                {!gpuPicked && ibPicked && <div style={lineNote("warn")}>Network links: µs wake-up latency on IB.</div>}

                {result && (
                  <div style={{ fontFamily: "var(--mono)", fontSize: 12, padding: "6px 10px", borderRadius: 6,
                    background: result.tone === "bad" ? "color-mix(in oklab, var(--crit) 12%, var(--surface-2))"
                              : "color-mix(in oklab, var(--ok) 10%, var(--surface-2))",
                    color: result.tone === "bad" ? "var(--crit)" : "var(--ink)", whiteSpace: "pre-wrap", wordBreak: "break-word" }}>
                    {result.text}
                  </div>
                )}

                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderTop: "1px solid var(--line)", paddingTop: 8 }}>
                  <span onClick={!token || busy ? undefined : restore}
                    style={{ fontSize: 11, color: !token || busy ? "var(--muted)" : "var(--accent)", cursor: !token || busy ? "default" : "pointer", textDecoration: "underline", textDecorationStyle: "dotted" }}>
                    Restore default
                  </span>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button className="nd-freq-btn" disabled={!token || busy} onClick={() => run(PCIE_PROBE)} title="Re-read">↻</button>
                    <button className="nd-freq-btn" disabled={!token || busy || !changed} onClick={apply}>{busy ? "running…" : "Apply"}</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      function FanModal({ nodeId, node, onClose }) {
        const [token, setToken] = useState(() => sessionStorage.getItem("cockpit_exec_token") || "");
        const [tokenDraft, setTokenDraft] = useState("");
        const [editingToken, setEditingToken] = useState(() => !sessionStorage.getItem("cockpit_exec_token"));
        const [bmcUser, setBmcUser] = useState(() => sessionStorage.getItem("cockpit_bmc_user") || "");
        const [bmcPass, setBmcPass] = useState(() => sessionStorage.getItem("cockpit_bmc_pass") || "");
        const [bmcUserDraft, setBmcUserDraft] = useState("");
        const [bmcPassDraft, setBmcPassDraft] = useState("");
        const [editingBmc, setEditingBmc] = useState(() =>
          !(sessionStorage.getItem("cockpit_bmc_user") && sessionStorage.getItem("cockpit_bmc_pass")));
        const [busy, setBusy] = useState(false);
        const [result, setResult] = useState(null);
        // legacy raw-IPMI path
        const [mode, setMode] = useState("auto");
        // profile path
        const [profiles, setProfiles] = useState(null);
        const [activeProfile, setActiveProfile] = useState(null);
        const [pickProfile, setPickProfile] = useState("");
        const [baseProfile, setBaseProfile] = useState("");
        const [kind, setKind] = useState("floor");
        const [customPct, setCustomPct] = useState("");
        // per fan group manual duty (SYS / REAR / EXT / CPU); "" = keep profile
        const [perGroup, setPerGroup] = useState(false);
        const [groupPct, setGroupPct] = useState({});
        const [fanGroups, setFanGroups] = useState(null);   // {"SYS": 24, ...} from the BMC
        const [tab, setTab] = useState("profile");          // "profile" | "manual"

        const vendor = node.fanVendor || "unknown";
        // Worker vendor detection runs at start-up and can miss a slow BMC,
        // leaving identical Gigabyte nodes as "unknown". The profile API is
        // harmless to try: login simply fails on other BMCs.
        const profileApi = vendor === "redfish" || (vendor === "unknown" && !!node.bmcHost);
        const legacy = FAN_CMDS[vendor];
        const supported = profileApi || !!legacy;
        const needsBmcCreds = profileApi;
        const haveBmcCreds = !!(bmcUser && bmcPass);
        const bmcReady = !needsBmcCreds || (haveBmcCreds && node.bmcHost);

        useEffect(() => {
          const onKey = (e) => { if (e.key === "Escape") onClose(); };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [onClose]);

        function saveToken() {
          const t = tokenDraft.trim();
          if (!t) return;
          sessionStorage.setItem("cockpit_exec_token", t);
          setToken(t); setTokenDraft(""); setEditingToken(false);
        }
        function saveBmcCreds() {
          const u = bmcUserDraft.trim();
          const p = bmcPassDraft;  // don't trim password
          if (!u || !p) return;
          sessionStorage.setItem("cockpit_bmc_user", u);
          sessionStorage.setItem("cockpit_bmc_pass", p);
          setBmcUser(u); setBmcPass(p);
          setBmcUserDraft(""); setBmcPassDraft("");
          setEditingBmc(false);
        }

        // Run a shell command on the node. Returns the parsed exec body, or
        // null after setting an error result.
        async function runExec(cmd, timeout_s) {
          const r = await fetch(`/api/node/${encodeURIComponent(nodeId)}/exec`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Exec-Token": token },
            body: JSON.stringify({ cmd, timeout_s }),
          });
          const raw = await r.text();
          let body = null;
          try { body = JSON.parse(raw); } catch {}
          if (!r.ok) { setResult({ tone: "bad", text: (body && body.error) || `HTTP ${r.status}` }); return null; }
          if (body && body.error) {
            setResult({ tone: "bad", text: `error: ${body.error}${body.stderr ? ` — ${body.stderr.trim()}` : ""}` });
            return null;
          }
          return body || {};
        }

        function applyProfileState(res) {
          if (!res || !res.profiles) return;
          if (res.fan_groups && Object.keys(res.fan_groups).length) setFanGroups(res.fan_groups);
          setProfiles(res.profiles);
          setActiveProfile(res.mode);
          const real = res.profiles.filter(p => p !== MANUAL_PROFILE);
          const prefer = res.mode && res.mode !== MANUAL_PROFILE ? res.mode
                       : (res.base || (real.includes("SCC26v1") ? "SCC26v1" : "default"));
          setPickProfile(p => (p && real.includes(p)) ? p : prefer);
          setBaseProfile(p => (p && real.includes(p)) ? p : prefer);
        }

        async function runProfile(args, { quiet } = {}) {
          if (!token || busy || !bmcReady) return;
          setBusy(true);
          if (!quiet) setResult(null);
          try {
            const cmd = await fanProfileCmd({ host: node.bmcHost, user: bmcUser, pass: bmcPass, ...args });
            // login waits up to ~30 s for a free BMC session slot
            const body = await runExec(cmd, 90);
            if (!body) return;
            const res = parseFanResult(body.stdout);
            if (!res) {
              const detail = ((body.stderr || "").trim() || (body.stdout || "").trim());
              setResult({ tone: "bad", text: `no result from node${detail ? ` — ${detail}` : ""}` });
              return;
            }
            applyProfileState(res);
            if (!quiet || !res.ok) setResult({ tone: res.ok ? "ok" : "bad", text: res.msg });
          } catch (err) {
            setResult({ tone: "bad", text: String(err && err.message || err) });
          } finally {
            setBusy(false);
          }
        }

        // Load the profile list as soon as token + BMC credentials exist.
        useEffect(() => {
          if (profileApi && token && bmcReady && profiles === null) runProfile({ op: "status" }, { quiet: true });
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [profileApi, token, bmcReady]);

        async function runLegacy(cmd) {
          if (!token || busy) return;
          setBusy(true); setResult(null);
          try {
            const body = await runExec(cmd, 20);
            if (!body) return;
            if (typeof body.exit === "number" && body.exit !== 0) {
              const detail = ((body.stderr || "").trim() || (body.stdout || "").trim());
              setResult({ tone: "bad", text: `exit=${body.exit}${detail ? ` — ${detail}` : ""}` });
            } else {
              setResult({ tone: "ok", text: (body.stdout || "").trim() || "done" });
            }
          } catch (err) {
            setResult({ tone: "bad", text: String(err && err.message || err) });
          } finally {
            setBusy(false);
          }
        }

        const pctVal = parseInt(customPct, 10);
        const minPct = profileApi ? 0 : 1;
        const pctValid = Number.isFinite(pctVal) && pctVal >= minPct && pctVal <= 100;
        const presets = profileApi ? [0, 10, 20, 30, 40, 50, 60, 80, 100] : [20, 40, 60, 80, 100];
        // Fan groups: from the BMC once status has run, else from the worker's fan names.
        const GROUP_ORDER = ["SYS", "REAR", "EXT", "CPU"];
        const groupNames = Object.keys(fanGroups || node.perFan.reduce((a, f) => {
          if (f.bank) a[f.bank.toUpperCase()] = 1; return a; }, {}))
          .sort((a, b) => (GROUP_ORDER.indexOf(a) + 1 || 99) - (GROUP_ORDER.indexOf(b) + 1 || 99) || a.localeCompare(b));
        const groupNow = (g) => {   // current estimated duty of a group, from live rpm
          const v = node.perFan.filter(f => (f.bank || "").toUpperCase() === g && f.pct != null).map(f => f.pct);
          return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null;
        };
        const groupVals = {};
        let groupBad = false;
        for (const g of groupNames) {
          const raw = (groupPct[g] ?? "").toString().trim();
          if (raw === "") { groupVals[g] = null; continue; }
          const v = parseInt(raw, 10);
          if (!Number.isFinite(v) || v < minPct || v > 100) groupBad = true;
          groupVals[g] = v;
        }
        const groupSet = Object.values(groupVals).filter(v => v != null);
        const groupsValid = !groupBad && groupSet.length > 0;
        const lowestPct = perGroup ? (groupSet.length ? Math.min(...groupSet) : null) : (pctValid ? pctVal : null);
        const vendorLabel = profileApi && vendor === "unknown" ? "Gigabyte/AMI (BMC probe)"
                          : vendor === "unknown" ? "unknown" : vendor.charAt(0).toUpperCase() + vendor.slice(1);
        const realProfiles = (profiles || []).filter(p => p !== MANUAL_PROFILE);
        const canAct = supported && token && bmcReady && !busy;
        // Why an Apply button is grey, shown next to it instead of leaving the user guessing.
        const blockedReason = (valueOk, valueMsg) =>
          !supported ? "fan control not supported here"
          : !token ? "enter the exec token above"
          : !bmcReady ? (node.bmcHost ? "enter the BMC login above" : "BMC IP not reported yet")
          : busy ? "running…"
          : (profileApi && !baseProfile) ? "profile list not loaded: press ↻"
          : !valueOk ? valueMsg : "";
        const groupBlocked = blockedReason(groupsValid,
          groupBad ? "each value must be 0–100" : "enter a duty for at least one group");
        const allBlocked = blockedReason(pctValid, `enter a duty ${minPct}–100`);

        const inputStyle = { flex: 1, padding: "6px 8px", borderRadius: 6, border: "1px solid var(--line)", background: "var(--surface-2)", color: "var(--ink)", fontFamily: "var(--mono)", fontSize: 13 };
        const lineNote = (tone) => ({ fontSize: 11, padding: "5px 8px", borderRadius: 6, color: `var(--${tone})`, fontWeight: 600,
          background: `color-mix(in oklab, var(--${tone}) 10%, var(--surface-2))` });
        // Segmented control: one row of mutually exclusive choices.
        // `full` stretches the buttons across the row (the tab bar); otherwise
        // the control is only as wide as its buttons.
        const Seg = ({ value, options, onChange, full }) => (
          <div style={{ display: "flex", alignSelf: full ? "stretch" : "flex-start", border: "1px solid var(--line)", borderRadius: 7, overflow: "hidden" }}>
            {options.map(([v, lbl, tip]) => (
              <button key={String(v)} onClick={() => onChange(v)} title={tip}
                style={{ flex: full ? 1 : "0 0 auto", padding: "5px 12px", border: "none", cursor: "pointer", fontFamily: "var(--font)", fontSize: 12, fontWeight: 700,
                  background: value === v ? "var(--accent)" : "var(--surface-2)", color: value === v ? "#fff" : "var(--ink)" }}>{lbl}</button>
            ))}
          </div>
        );
        const shortPresets = profileApi ? [20, 30, 40, 60, 80, 100] : presets;

        return (
          <div className="nd-modal-bg" onClick={e => e.target === e.currentTarget && onClose()}>
            <div className="nd-modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 560, height: "auto" }}>
              <div className="nd-modal-head">
                <span className="nd-modal-title">Fan Control · {nodeId}</span>
                <span className="nd-modal-warn">⚠ BMC · root</span>
                <button className="nd-modal-close" onClick={onClose} title="Close (Esc)">×</button>
              </div>

              <div style={{ padding: "14px 16px", display: "flex", flexDirection: "column", gap: 12, overflowY: "auto", minHeight: 0, flex: 1 }}>
                {/* Status */}
                <div style={{ fontSize: 12, color: "var(--muted)", fontFamily: "var(--mono)" }}>
                  {node.fanTotal > 0
                    ? <><b style={{ color: "var(--ink)" }}>{node.fanOk}/{node.fanTotal}</b> OK
                        {node.fanRpm > 0 && <> · <b style={{ color: "var(--ink)" }}>{(node.fanRpm / 1000).toFixed(1)}k rpm{node.fanPct != null && ` (${Math.round(node.fanPct)}%)`}</b></>}
                        {profileApi && activeProfile && <> · <b style={{ color: activeProfile === MANUAL_PROFILE ? "var(--warn)" : "var(--ink)" }}>{activeProfile}</b></>}
                      </>
                    : <em>no fan data</em>}
                </div>

                {!supported && <div style={lineNote("warn")}>Fan control not supported on this node ({vendorLabel}).</div>}
                {profileApi && !node.bmcHost && <div style={lineNote("warn")}>BMC IP not reported yet by the worker.</div>}

                {editingToken ? (
                  <div className="nd-shell-tokenrow" style={{ margin: 0 }}>
                    <span className="lbl">Token</span>
                    <input type="password" value={tokenDraft} onChange={e => setTokenDraft(e.target.value)}
                      onKeyDown={e => e.key === "Enter" && saveToken()}
                      placeholder="exec_token from worker.conf" autoFocus />
                    <button onClick={saveToken} disabled={!tokenDraft.trim()}>Save</button>
                  </div>
                ) : (
                  <div className="nd-shell-tokenrow" style={{ margin: 0 }}>
                    <span className="lbl">Token</span>
                    <span style={{ flex: 1, fontFamily: "var(--mono)", fontSize: 12, color: "var(--muted)" }}>•••••••• (session)</span>
                    <span className="change" onClick={() => { setEditingToken(true); setTokenDraft(""); }}>[change]</span>
                  </div>
                )}

                {needsBmcCreds && (editingBmc ? (
                  <div className="nd-shell-tokenrow" style={{ margin: 0, gap: 6 }}>
                    <span className="lbl">BMC</span>
                    <input type="text" value={bmcUserDraft} onChange={e => setBmcUserDraft(e.target.value)}
                      placeholder="user (e.g. admin)" autoFocus style={{ flex: "1 1 100px" }} />
                    <input type="password" value={bmcPassDraft} onChange={e => setBmcPassDraft(e.target.value)}
                      onKeyDown={e => e.key === "Enter" && saveBmcCreds()}
                      placeholder="password" style={{ flex: "1 1 140px" }} />
                    <button onClick={saveBmcCreds} disabled={!bmcUserDraft.trim() || !bmcPassDraft}>Save</button>
                  </div>
                ) : (
                  <div className="nd-shell-tokenrow" style={{ margin: 0 }}>
                    <span className="lbl">BMC</span>
                    <span style={{ flex: 1, fontFamily: "var(--mono)", fontSize: 12, color: "var(--muted)" }}>{bmcUser} @ {node.bmcHost || "?"} · ••••••• (session)</span>
                    <span className="change" onClick={() => { setEditingBmc(true); setBmcUserDraft(bmcUser); setBmcPassDraft(""); }}>[change]</span>
                  </div>
                ))}

                {supported && (<>
                  <Seg full value={tab} onChange={setTab} options={[["profile", "Profile"], ["manual", "Manual"]]} />

                  {tab === "profile" && (profileApi ? (
                    <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                      <select value={pickProfile} onChange={e => setPickProfile(e.target.value)} disabled={!profiles}
                        style={{ ...inputStyle, fontSize: 12 }}>
                        {!profiles && <option value="">{token && bmcReady ? (busy ? "loading…" : "—") : "enter token + BMC login"}</option>}
                        {realProfiles.map(p => <option key={p} value={p}>{p}{p === activeProfile ? "  (active)" : ""}</option>)}
                      </select>
                      <button className="nd-freq-btn" disabled={!canAct || !pickProfile}
                        onClick={() => runProfile({ op: "activate", name: pickProfile })}>Activate</button>
                      <button className="nd-freq-btn" disabled={!canAct} title="Re-read the BMC"
                        onClick={() => runProfile({ op: "status" })}>↻</button>
                    </div>
                  ) : legacy && (
                    <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                      <select value={mode} onChange={e => setMode(e.target.value)} style={{ ...inputStyle, fontSize: 12 }}>
                        <option value="auto">Auto (BMC)</option>
                        <option value="manual">Manual</option>
                      </select>
                      <button className="nd-freq-btn" onClick={() => runLegacy(legacy.setMode(mode))} disabled={!canAct}>Set</button>
                    </div>
                  ))}

                  {tab === "manual" && (<>
                    {profileApi && (
                      <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", fontSize: 12 }}>
                        <Seg value={kind} onChange={setKind} options={[
                          ["floor", "Floor", "Minimum duty; thermal ramps still apply"],
                          ["pin", "Pin", "Exact duty; ignores temperature"]]} />
                        {groupNames.length > 0 && <Seg value={perGroup} onChange={setPerGroup} options={[[false, "All"], [true, "Per group"]]} />}
                        <span style={{ color: "var(--muted)" }}>on</span>
                        <select value={baseProfile} onChange={e => setBaseProfile(e.target.value)} disabled={!profiles}
                          style={{ ...inputStyle, flex: "0 0 auto", fontSize: 12, padding: "4px 6px" }}>
                          {realProfiles.map(p => <option key={p} value={p}>{p}</option>)}
                        </select>
                      </div>
                    )}

                    {profileApi && perGroup ? (
                      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 6 }}>
                        {groupNames.map(g => {
                          const now = groupNow(g);
                          return (
                            <label key={g} style={{ display: "flex", gap: 6, alignItems: "center", fontSize: 12, fontFamily: "var(--mono)" }}>
                              <span style={{ width: 70 }}><b>{g}</b>{now != null && <span style={{ color: "var(--muted)" }}> {now}%</span>}</span>
                              <input type="number" value={groupPct[g] ?? ""} min={minPct} max={100}
                                onChange={e => setGroupPct(p => ({ ...p, [g]: e.target.value }))}
                                placeholder="—" style={{ ...inputStyle, width: 60 }} />
                            </label>
                          );
                        })}
                      </div>
                    ) : (
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                        {shortPresets.map(p => (
                          <button key={p} className="nd-freq-preset" onClick={() => setCustomPct(String(p))}
                            style={String(p) === customPct ? { borderColor: "var(--accent)", color: "var(--accent)" } : undefined}>{p}%</button>
                        ))}
                        <input type="number" value={customPct} onChange={e => setCustomPct(e.target.value)}
                          placeholder="%" min={minPct} max={100} style={{ ...inputStyle, flex: "0 0 70px" }} />
                      </div>
                    )}

                    {profileApi && kind === "pin" && <div style={lineNote("crit")}>Pin ignores temperature. Watch temps.</div>}
                    {profileApi && kind !== "pin" && lowestPct != null && lowestPct < 30 && (
                      <div style={lineNote("warn")}>{lowestPct < 10 ? "Below 10%: BMC may flag fan failure." : "Below 30%: watch HIC temperature."}</div>
                    )}
                    {profileApi && perGroup && <div style={{ fontSize: 11, color: "var(--muted)" }}>Blank = keep profile. Other groups can't exceed SYS.</div>}

                    <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, alignItems: "center" }}>
                      {(perGroup ? groupBlocked : (customPct !== "" && allBlocked)) &&
                        <span style={{ fontSize: 11, color: "var(--warn)" }}>{perGroup ? groupBlocked : allBlocked}</span>}
                      <button className="nd-freq-btn" disabled={!!(perGroup ? groupBlocked : allBlocked)}
                        onClick={() => {
                          if (!profileApi) return runLegacy(legacy.setDuty(pctVal));
                          if (perGroup) {
                            const desc = groupNames.map(g => `${g} ${groupVals[g] == null ? "profile" : groupVals[g] + "%"}`).join(", ");
                            if (kind === "pin" && !window.confirm(`Pin ${desc} on ${nodeId}? Fans will ignore temperature.`)) return;
                            return runProfile({ op: "manual", kind, base: baseProfile, groups: groupVals });
                          }
                          if (kind === "pin" && pctVal < 30 && !window.confirm(`Pin all fans at ${pctVal}% on ${nodeId}? Fans will ignore temperature.`)) return;
                          runProfile({ op: "manual", pct: pctVal, kind, base: baseProfile });
                        }}>Apply</button>
                    </div>
                  </>)}
                </>)}

                {result && (
                  <div style={{ fontFamily: "var(--mono)", fontSize: 12, padding: "6px 10px", borderRadius: 6,
                    background: result.tone === "bad" ? "color-mix(in oklab, var(--crit) 12%, var(--surface-2))"
                              : "color-mix(in oklab, var(--ok) 10%, var(--surface-2))",
                    color: result.tone === "bad" ? "var(--crit)" : "var(--ink)", whiteSpace: "pre-wrap", wordBreak: "break-word",
                    maxHeight: 120, overflowY: "auto" }}>
                    {result.text}
                  </div>
                )}

                {supported && (
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderTop: "1px solid var(--line)", paddingTop: 8 }}>
                    <span onClick={!canAct ? undefined : () => profileApi
                          ? runProfile({ op: "activate", name: baseProfile || "default" })
                          : runLegacy(legacy.restore())}
                      style={{ fontSize: 11, color: !canAct ? "var(--muted)" : "var(--accent)", cursor: !canAct ? "default" : "pointer", textDecoration: "underline", textDecorationStyle: "dotted" }}>
                      {profileApi ? `Restore ${baseProfile || "default"}` : "Restore auto"}
                    </span>
                    <span style={{ fontSize: 10, color: "var(--muted)" }}>{busy ? "running…" : ""}</span>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      // Map key → vendor name from gpu_collector.cpp's GpuVendor enum
      // (exposed via live-data.js as node.gpus[i].vendor).
      // AMD keeps its rocm-smi templates. NVIDIA goes through gputune_exec.py,
      // which validates every value against what the GPU reports and reads it
      // back. (The old NVIDIA presets used H100-agnostic clocks such as
      // -lgc 1500,2100, outside an H200's 345-1785 MHz range.)
      const GPU_CMDS = {
        amd: {
          setPowerCap: (i, w) => `rocm-smi -d ${i} --setpoweroverdrive ${w} --autorespond y\necho "cap=${w}W"`,
          setPerfLevel: (i, lvl) => {
            // rocm-smi --setperflevel accepts: auto, low, high, manual, profile_*
            const rocmLvl = { low: "low", balanced: "auto", performance: "high", max: "high" }[lvl] || "auto";
            return `rocm-smi -d ${i} --setperflevel ${rocmLvl} --autorespond y\necho "perf=${rocmLvl}"`;
          },
          restore: (i) =>
            `rocm-smi -d ${i} --resetpoweroverdrive --autorespond y && ` +
            `rocm-smi -d ${i} --setperflevel auto --autorespond y\necho "restored"`,
        },
      };

      let gpuScriptCache = null;
      async function gpuTuneCmd(args) {
        if (!gpuScriptCache) {
          const r = await fetch("gputune_exec.py", { cache: "no-store" });
          if (!r.ok) throw new Error(`cannot load gputune_exec.py (HTTP ${r.status})`);
          gpuScriptCache = await r.text();
        }
        return `python3 - <<'COCKPIT_GPUPY'\n` +
          `ARGS = __import__("json").loads(${JSON.stringify(JSON.stringify(args))})\n` +
          `${gpuScriptCache}\nCOCKPIT_GPUPY\n`;
      }

      function GpuModal({ nodeId, node, onClose }) {
        const [token, setToken] = useState(() => sessionStorage.getItem("cockpit_exec_token") || "");
        const [tokenDraft, setTokenDraft] = useState("");
        const [editingToken, setEditingToken] = useState(() => !sessionStorage.getItem("cockpit_exec_token"));
        const [sel, setSel] = useState(0);
        const [allGpus, setAllGpus] = useState(false);
        const [customW, setCustomW] = useState("");
        const [level, setLevel] = useState("balanced");
        const [clkMin, setClkMin] = useState("");
        const [clkMax, setClkMax] = useState("");
        const [memMhz, setMemMhz] = useState("");
        const [vbVal, setVbVal] = useState(null);
        const [gstat, setGstat] = useState(null);     // per-GPU state from gputune_exec.py
        const [busy, setBusy] = useState(false);
        const [result, setResult] = useState(null);

        const gpus = Array.isArray(node.gpus) ? node.gpus : [];
        const selected = gpus[sel] || null;
        const vendor = selected ? selected.vendor : "unknown";
        const isNv = vendor === "nvidia";
        const cmds = GPU_CMDS[vendor];
        const supported = isNv || !!cmds;
        const targetIds = allGpus ? gpus.map(g => g.idx) : (selected ? [selected.idx] : []);
        const tgt = (gstat || []).filter(g => targetIds.includes(g.idx));

        useEffect(() => {
          const onKey = (e) => { if (e.key === "Escape") onClose(); };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [onClose]);

        function saveToken() {
          const t = tokenDraft.trim();
          if (!t) return;
          sessionStorage.setItem("cockpit_exec_token", t);
          setToken(t); setTokenDraft(""); setEditingToken(false);
        }

        async function execBody(cmd, timeout_s) {
          const r = await fetch(`/api/node/${encodeURIComponent(nodeId)}/exec`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Exec-Token": token },
            body: JSON.stringify({ cmd, timeout_s }),
          });
          const raw = await r.text();
          let body = null;
          try { body = JSON.parse(raw); } catch {}
          if (!r.ok) { setResult({ tone: "bad", text: (body && body.error) || `HTTP ${r.status}` }); return null; }
          if (body && body.error) { setResult({ tone: "bad", text: `error: ${body.error}${body.stderr ? ` — ${body.stderr.trim()}` : ""}` }); return null; }
          return body || {};
        }

        // AMD / legacy path: plain command, exit code decides.
        async function runExec(cmd) {
          if (!token || busy) return;
          setBusy(true); setResult(null);
          try {
            const body = await execBody(cmd, 15);
            if (!body) return;
            if (typeof body.exit === "number" && body.exit !== 0) {
              setResult({ tone: "bad", text: `exit=${body.exit}${body.stderr ? ` — ${body.stderr.trim()}` : ""}` });
            } else {
              setResult({ tone: "ok", text: (body.stdout || "").trim() || "done" });
            }
          } catch (err) {
            setResult({ tone: "bad", text: String(err && err.message || err) });
          } finally { setBusy(false); }
        }

        // NVIDIA path: gputune_exec.py, result parsed from its RESULT line.
        async function runTune(args, { quiet } = {}) {
          if (!token || busy) return;
          setBusy(true);
          if (!quiet) setResult(null);
          try {
            const body = await execBody(await gpuTuneCmd(args), 120);
            if (!body) return;
            const line = String(body.stdout || "").trim().split("\n").reverse().find(l => l.startsWith("RESULT "));
            let res = null;
            try { res = line ? JSON.parse(line.slice(7)) : null; } catch {}
            if (!res) {
              const detail = ((body.stderr || "").trim() || (body.stdout || "").trim());
              setResult({ tone: "bad", text: `no result from node${detail ? ` — ${detail}` : ""}` });
              return;
            }
            if (Array.isArray(res.gpus) && res.gpus.length) {
              setGstat(prev => {
                const m = new Map((prev || []).map(g => [g.idx, g]));
                res.gpus.forEach(g => m.set(g.idx, g));
                return [...m.values()].sort((x, y) => x.idx - y.idx);
              });
            }
            if (!quiet || !res.ok) setResult({ tone: res.ok ? "ok" : "bad", text: res.msg + (res.detail ? `\n${res.detail}` : "") });
          } catch (err) {
            setResult({ tone: "bad", text: String(err && err.message || err) });
          } finally { setBusy(false); }
        }

        useEffect(() => {
          if (isNv && token && gstat === null) runTune({ op: "status" }, { quiet: true });
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [isNv, token]);

        // Limits for the current target: intersect across targeted GPUs.
        const lim = tgt.length ? {
          pMin: Math.max(...tgt.map(g => g.power_min || 0)),
          pMax: Math.min(...tgt.map(g => g.power_max || 1000)),
          smMin: Math.max(...tgt.map(g => g.sm_min || 0)),
          smMax: Math.min(...tgt.map(g => g.sm_max || 0)),
          mem: tgt.map(g => g.mem_supported || []).reduce((a, b) => a.filter(x => b.includes(x))),
          vbMax: Math.min(...tgt.map(g => (g.vboost_max == null ? -1 : g.vboost_max))),
        } : null;
        const uniq = (k) => [...new Set(tgt.map(g => g[k]))];
        const lockText = (g) => g.sm_lock ? `${g.sm_lock.min}–${g.sm_lock.max}`
                              : g.sm_lock_external ? `external? (idle at ${Math.round(g.sm_mhz)})` : "unlocked";
        const lockSummary = [...new Set(tgt.map(lockText))];

        function applyPowerCap() {
          const w = parseInt(customW, 10);
          if (!Number.isFinite(w)) return;
          if (isNv) return runTune({ op: "power", gpus: targetIds, watts: w });
          if (!cmds || !selected || w < 1 || w > 1000) return;
          runExec(cmds.setPowerCap(selected.idx, w));
        }
        function applyPerfLevel() { if (cmds && selected) runExec(cmds.setPerfLevel(selected.idx, level)); }
        function restoreDefaults() {
          if (isNv) return (async () => {
            await runTune({ op: "reset_clocks", gpus: targetIds });
            await runTune({ op: "reset_memclock", gpus: targetIds }, { quiet: true });
            if (lim && lim.vbMax >= 0) await runTune({ op: "vboost", gpus: targetIds, value: 0 }, { quiet: true });
            setResult({ tone: "ok", text: `GPU ${targetIds.join(",")}: SM clock lock removed, memory clock lock removed, vboost 0 (power cap unchanged)` });
          })();
          if (cmds && selected) runExec(cmds.restore(selected.idx));
        }

        const vendorLabel = vendor === "unknown" ? "unknown" : vendor.toUpperCase();
        const capNum = selected && selected.powerCapW > 0 ? Math.round(selected.powerCapW) : 0;
        const presetsW = isNv && lim
          ? [200, 250, 300, 350, 400, 450, 500, 600].filter(w => w >= lim.pMin && w <= lim.pMax)
          : capNum > 0 ? [Math.round(capNum * 0.5), Math.round(capNum * 0.7), Math.round(capNum * 0.85), capNum] : [100, 150, 200, 250];
        const levelOpts = [
          { k: "low", lbl: "Low (power save)" }, { k: "balanced", lbl: "Balanced (default)" },
          { k: "performance", lbl: "Performance" }, { k: "max", lbl: "Max" },
        ];
        const wVal = parseInt(customW, 10);
        const wValid = isNv ? (lim && Number.isFinite(wVal) && wVal >= lim.pMin && wVal <= lim.pMax)
                            : (Number.isFinite(wVal) && wVal >= 1 && wVal <= 1000);
        const cMin = parseInt(clkMin, 10), cMax = parseInt(clkMax, 10);
        const clkValid = !!lim && Number.isFinite(cMin) && Number.isFinite(cMax) && lim.smMin <= cMin && cMin <= cMax && cMax <= lim.smMax;
        const clkPresets = [1000, 1200, 1400, 1600];
        const canTune = isNv && token && !busy && !!lim;
        const inputStyle = { flex: 1, padding: "6px 8px", borderRadius: 6, border: "1px solid var(--line)", background: "var(--surface-2)", color: "var(--ink)", fontFamily: "var(--mono)", fontSize: 13 };
        const sectionLbl = { fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--muted)", fontWeight: 700, marginBottom: 6 };
        const mono = { fontFamily: "var(--mono)", fontSize: 12, color: "var(--muted)" };

        return (
          <div className="nd-modal-bg" onClick={e => e.target === e.currentTarget && onClose()}>
            <div className="nd-modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 680, height: "auto", maxHeight: "92vh", overflowY: "auto" }}>
              <div className="nd-modal-head">
                <span className="nd-modal-title">GPU Tuning · {nodeId}</span>
                <span className="nd-modal-warn">⚠ {isNv && allGpus ? `All ${gpus.length} GPUs` : "Per-GPU"} · root</span>
                <button className="nd-modal-close" onClick={onClose} title="Close (Esc)">×</button>
              </div>

              <div style={{ padding: "14px 16px", display: "flex", flexDirection: "column", gap: 14 }}>
                {(gpus.length === 0 || node.gpuPlaceholder) ? (
                  <div style={mono}>
                    <em>No GPU available on this node.</em>
                    <div style={{ marginTop: 8, fontSize: 11, lineHeight: 1.5 }}>
                      If a GPU is physically present, verify that <code>rocm-smi</code> (AMD) or <code>nvidia-smi</code> (NVIDIA) is installed and on <code>$PATH</code> for the worker. See <code>worker/src/collectors/gpu_collector.cpp</code>.
                    </div>
                  </div>
                ) : (
                  <>
                    {gpus.length > 1 && (
                      <div>
                        <div style={sectionLbl}>GPU</div>
                        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                          <select value={sel} onChange={e => { setSel(parseInt(e.target.value, 10) || 0); setResult(null); }}
                            disabled={isNv && allGpus} style={{ ...inputStyle, fontSize: 12, opacity: isNv && allGpus ? 0.5 : 1 }}>
                            {gpus.map(g => (
                              <option key={g.idx} value={g.idx}>
                                GPU {g.idx} · {g.vendor.toUpperCase()} · {Math.round(g.tempC)}°C · {Math.round(g.powerW)}W
                              </option>
                            ))}
                          </select>
                          {isNv && (
                            <label style={{ display: "flex", gap: 4, alignItems: "center", fontSize: 12, cursor: "pointer", whiteSpace: "nowrap" }}>
                              <input type="checkbox" checked={allGpus} onChange={e => setAllGpus(e.target.checked)} />
                              Apply to all {gpus.length}
                            </label>
                          )}
                        </div>
                      </div>
                    )}

                    {selected && !(isNv && allGpus) && (
                      <div style={mono}>
                        GPU {selected.idx} · <b style={{ color: "var(--ink)" }}>{vendorLabel}</b>
                        {" · "}<b style={{ color: "var(--ink)" }}>{Math.round(selected.tempC)}°C</b>
                        {" · "}<b style={{ color: "var(--ink)" }}>{Math.round(selected.powerW)}W</b>
                        {selected.powerCapW > 0 && <> / <b style={{ color: "var(--ink)" }}>{Math.round(selected.powerCapW)}W cap</b></>}
                        {selected.clockMhz > 0 && <> · <b style={{ color: "var(--ink)" }}>{Math.round(selected.clockMhz)} MHz</b></>}
                        {" · "}util <b style={{ color: "var(--ink)" }}>{Math.round(selected.utilPct)}%</b>
                      </div>
                    )}
                    {isNv && tgt.length > 0 && (
                      <div style={mono}>
                        now: cap <b style={{ color: "var(--ink)" }}>{uniq("power_limit").map(v => Math.round(v)).join("/")} W</b>
                        {" · "}SM <b style={{ color: "var(--ink)" }}>{uniq("sm_mhz").map(v => Math.round(v)).join("/")} MHz</b>
                        {" "}(lock <b style={{ color: tgt.some(g => g.sm_lock || g.sm_lock_external) ? "var(--warn)" : "var(--ink)" }}>{lockSummary.join(" / ")}</b>)
                        {" · "}HBM <b style={{ color: "var(--ink)" }}>{uniq("mem_mhz").map(v => Math.round(v)).join("/")} MHz</b>
                        {tgt.some(g => g.mem_deferred) && <span style={{ color: "var(--warn)" }}> (→ {uniq("mem_deferred").map(v => v || "—").join("/")} after reset)</span>}
                        {" · "}vboost <b style={{ color: "var(--ink)" }}>{uniq("vboost").join("/")}</b>
                        {tgt.length > 1 && <> · {tgt.length} GPUs</>}
                      </div>
                    )}

                    {!supported && (
                      <div style={{ fontSize: 12, padding: "10px 12px", borderRadius: 6,
                        background: "color-mix(in oklab, var(--warn) 12%, var(--surface-2))",
                        color: "var(--ink)", border: "1px solid color-mix(in oklab, var(--warn) 40%, var(--line))", lineHeight: 1.5 }}>
                        <div style={{ fontWeight: 700, marginBottom: 4, color: "var(--warn)" }}>GPU tuning is not supported for this vendor.</div>
                        Detected: <b>{vendorLabel}</b>. Supported: NVIDIA (<code>gputune_exec.py</code>) and AMD (<code>rocm-smi</code> templates in <code>GPU_CMDS</code>).
                      </div>
                    )}

                    {editingToken ? (
                      <div className="nd-shell-tokenrow" style={{ margin: 0 }}>
                        <span className="lbl">Token</span>
                        <input type="password" value={tokenDraft} onChange={e => setTokenDraft(e.target.value)}
                          onKeyDown={e => e.key === "Enter" && saveToken()}
                          placeholder="exec_token from worker.conf" autoFocus />
                        <button onClick={saveToken} disabled={!tokenDraft.trim()}>Save</button>
                      </div>
                    ) : (
                      <div className="nd-shell-tokenrow" style={{ margin: 0 }}>
                        <span className="lbl">Token</span>
                        <span style={{ flex: 1, ...mono }}>•••••••• (session)</span>
                        <span className="change" onClick={() => { setEditingToken(true); setTokenDraft(""); }}>[change]</span>
                      </div>
                    )}

                    {isNv && token && !gstat && <div style={mono}>{busy ? "reading GPU limits…" : "GPU limits not loaded"}</div>}

                    {supported && (
                      <div>
                        <div style={sectionLbl}>Power cap (W){isNv && lim ? ` · ${lim.pMin}–${lim.pMax}` : ""}</div>
                        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
                          {presetsW.map(p => (
                            <button key={p} className="nd-freq-preset" onClick={() => setCustomW(String(p))} title={`${p} W`}>{p}W</button>
                          ))}
                        </div>
                        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                          <input type="number" value={customW} onChange={e => setCustomW(e.target.value)}
                            placeholder={isNv && lim ? `Watts (${lim.pMin}–${lim.pMax})` : "Watts (1–1000)"} style={inputStyle} />
                          <button className="nd-freq-btn" onClick={applyPowerCap}
                            disabled={!token || busy || !wValid || (isNv && !lim)}>Apply</button>
                        </div>
                      </div>
                    )}

                    {isNv && (
                      <div>
                        <div style={sectionLbl}>SM clock range (MHz){lim ? ` · allowed ${lim.smMin}–${lim.smMax}` : ""}</div>
                        {tgt.length > 0 && (
                          <div style={{ ...mono, marginBottom: 8 }}>
                            {tgt.length === 1 ? "Locked range" : "Locked ranges"}:{" "}
                            {tgt.length === 1
                              ? <b style={{ color: tgt[0].sm_lock ? "var(--warn)" : "var(--ink)" }}>{lockText(tgt[0])}{tgt[0].sm_lock ? " MHz" : ""}</b>
                              : tgt.map(g => <span key={g.idx} style={{ marginRight: 8 }}>GPU{g.idx} <b style={{ color: g.sm_lock ? "var(--warn)" : "var(--ink)" }}>{lockText(g)}</b></span>)}
                            {tgt.some(g => g.sm_lock_external) && <div style={{ fontSize: 11, marginTop: 2 }}>"external?" = no cockpit record, but the idle GPU runs above its {lim ? lim.smMin : 345} MHz floor — likely locked with nvidia-smi directly; the exact range isn't readable from the driver.</div>}
                          </div>
                        )}
                        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
                          {clkPresets.map(c => (
                            <button key={c} className="nd-freq-preset" title={`lock at ${c} MHz`}
                              onClick={() => { setClkMin(String(c)); setClkMax(String(c)); }}>{c}</button>
                          ))}
                          {lim && <button className="nd-freq-preset" title="whole supported range"
                            onClick={() => { setClkMin(String(lim.smMin)); setClkMax(String(lim.smMax)); }}>full range</button>}
                        </div>
                        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                          <input type="number" value={clkMin} onChange={e => setClkMin(e.target.value)} placeholder="min" style={inputStyle} />
                          <span style={{ color: "var(--muted)" }}>–</span>
                          <input type="number" value={clkMax} onChange={e => setClkMax(e.target.value)} placeholder="max" style={inputStyle} />
                          <button className="nd-freq-btn" disabled={!canTune || !clkValid}
                            onClick={() => runTune({ op: "clocks", gpus: targetIds, min: cMin, max: cMax })}>Lock</button>
                          <button className="nd-freq-btn" disabled={!canTune}
                            onClick={() => runTune({ op: "reset_clocks", gpus: targetIds })}>Unlock</button>
                        </div>
                      </div>
                    )}

                    {isNv && (
                      <div>
                        <div style={sectionLbl}>HBM memory clock (MHz) · applies after GPU reset / reboot</div>
                        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                          <select value={memMhz} onChange={e => setMemMhz(e.target.value)} disabled={!lim}
                            style={{ ...inputStyle, fontSize: 12 }}>
                            <option value="">{lim ? "choose…" : "—"}</option>
                            {(lim ? lim.mem : []).map(m => <option key={m} value={m}>{m} MHz</option>)}
                          </select>
                          <button className="nd-freq-btn" disabled={!canTune || !memMhz}
                            onClick={() => runTune({ op: "memclock", gpus: targetIds, mhz: parseInt(memMhz, 10) })}>Lock</button>
                          <button className="nd-freq-btn" disabled={!canTune}
                            onClick={() => runTune({ op: "reset_memclock", gpus: targetIds })}>Unlock</button>
                        </div>
                      </div>
                    )}

                    {isNv && lim && lim.vbMax >= 0 && (
                      <div>
                        <div style={sectionLbl}>vboost (boost slider) · 0–{lim.vbMax}</div>
                        <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
                          {Array.from({ length: lim.vbMax + 1 }, (_, v) => (
                            <button key={v} className="nd-freq-preset"
                              style={{ background: vbVal === v ? "var(--accent-soft)" : undefined, fontWeight: uniq("vboost").length === 1 && uniq("vboost")[0] === v ? 800 : undefined }}
                              onClick={() => setVbVal(v)} title={v === 0 ? "off (default)" : `level ${v}`}>{v === 0 ? "0 · off" : v}</button>
                          ))}
                          <button className="nd-freq-btn" disabled={!canTune || vbVal === null}
                            onClick={() => runTune({ op: "vboost", gpus: targetIds, value: vbVal })}>Set</button>
                        </div>
                      </div>
                    )}

                    {cmds && !isNv && (
                      <div>
                        <div style={sectionLbl}>Clock / perf level</div>
                        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                          <select value={level} onChange={e => setLevel(e.target.value)} style={{ ...inputStyle, fontSize: 12 }}>
                            {levelOpts.map(o => <option key={o.k} value={o.k}>{o.lbl}</option>)}
                          </select>
                          <button className="nd-freq-btn" onClick={applyPerfLevel} disabled={!token || busy}>Set</button>
                        </div>
                      </div>
                    )}

                    {result && (
                      <div style={{ fontFamily: "var(--mono)", fontSize: 12, padding: "6px 10px", borderRadius: 6,
                        background: result.tone === "bad" ? "color-mix(in oklab, var(--crit) 12%, var(--surface-2))" : "color-mix(in oklab, var(--ok) 10%, var(--surface-2))",
                        color: result.tone === "bad" ? "var(--crit)" : "var(--ink)", whiteSpace: "pre-wrap", wordBreak: "break-word" }}>
                        {result.text}
                      </div>
                    )}

                    {supported && (
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderTop: "1px solid var(--line)", paddingTop: 10 }}>
                        <span onClick={busy || !token ? undefined : restoreDefaults}
                          style={{ fontSize: 11, color: busy || !token ? "var(--muted)" : "var(--accent)", cursor: busy || !token ? "default" : "pointer", textDecoration: "underline", textDecorationStyle: "dotted" }}>
                          {isNv ? "Restore clocks (unlock SM + HBM, vboost 0; power cap unchanged)" : "Restore (reset cap + perf to default)"}
                        </span>
                        <span style={{ fontSize: 10, color: "var(--muted)" }}>
                          {busy ? "running…" : isNv ? "locks last until reset or reboot" : ""}
                          {isNv && token && !busy && <span className="change" style={{ marginLeft: 8, cursor: "pointer" }}
                            onClick={() => runTune({ op: "status" })}>[refresh]</span>}
                        </span>
                      </div>
                    )}
                  </>
                )}
              </div>
            </div>
          </div>
        );
      }

      function NodeDetailPage() {
        const params = new URLSearchParams(window.location.search);
        const nodeId = params.get("node") || "";
        const [theme, setTheme] = useState(readThemeFromSettings);
        const [node, setNode] = useState(null);
        const [sortAsc, setSortAsc] = useState(true);
        const [notFound, setNotFound] = useState(false);
        const [shellOpen, setShellOpen] = useState(false);
        const [freqOpen, setFreqOpen] = useState(false);
        const [fanOpen, setFanOpen] = useState(false);
        const [gpuOpen, setGpuOpen] = useState(false);
        const [coresOpen, setCoresOpen] = useState(false);
        const [pcieOpen, setPcieOpen] = useState(false);
        const now = useClock();
        const [settings, setSettings] = useState(() => readSettings());
        const baseThr = { ...THR, ...(settings.alerts || {}) };
        // Group power overrides apply when this node is in nodeGroups.
        const thr = window.nodeThresholds
          ? window.nodeThresholds(nodeId, settings, baseThr)
          : baseThr;
        const currentGroup = (settings.nodeGroups && settings.nodeGroups[nodeId]) || "";

        // Hydrate from server on mount so per-node thresholds reflect what was
        // saved on the settings page (which writes to /api/settings, not just
        // localStorage).
        useEffect(() => {
          if (!window.loadSettings) return;
          let cancelled = false;
          window.loadSettings().then(s => {
            if (cancelled || !s) return;
            if (s.theme && s.theme !== theme) setTheme(s.theme);
            setSettings(s);
          });
          return () => { cancelled = true; };
        }, []);

        function setNodeGroup(group) {
          const next = {
            ...settings,
            nodeGroups: { ...(settings.nodeGroups || {}) },
          };
          if (group) next.nodeGroups[nodeId] = group;
          else delete next.nodeGroups[nodeId];
          setSettings(next);
          writeSettings({ nodeGroups: next.nodeGroups });
        }

        useEffect(() => {
          document.documentElement.dataset.theme = theme;
          writeSettings({ theme });
        }, [theme]);

        useEffect(() => {
          if (!nodeId) { setNotFound(true); return; }
          return window.startLiveNodeDetail(nodeId, (n) => {
            if (n) setNode(n); else setNotFound(true);
          });
        }, [nodeId]);

        if (!nodeId || (notFound && !node)) {
          return (
            <div style={{ padding: 40, color: "var(--muted)", fontFamily: "var(--font)" }}>
              Node <strong>{nodeId || "(none)"}</strong> not found.
              {" "}<a href="index.html" style={{ color: "var(--accent)" }}>← Back</a>
            </div>
          );
        }
        if (!node) {
          return <div style={{ padding: 40, color: "var(--muted)", fontFamily: "var(--font)" }}>Loading {nodeId}…</div>;
        }

        const cpuTone  = tone(node.cpu,   thr.cpuWarn,       thr.cpuHot);
        const memTone  = tone(node.memPct, 75,               90);
        const swapTone = tone(node.swapPct, 20,              50);
        // Hardware-published CPU limits take precedence over the UI settings.
        // The BMC reports the board vendor's own thresholds for each sensor
        // (97/100 on this board), whereas alerts.tempWarn/tempCrit are a
        // generic default someone typed into the settings page. Fall back to
        // the settings only when the hardware publishes nothing.
        const thermByName = {};
        for (const m of node.rawMetrics || []) {
          if (m.module === "thermal" && typeof m.value === "number") thermByName[m.name] = m.value;
        }
        const tempWarn = thermByName.cpu_warn_c ?? thr.tempWarn;
        const tempCrit = thermByName.cpu_crit_c ?? thr.tempCrit;
        const tempTone = tone(node.temp,  tempWarn,          tempCrit);
        const powTone  = tone(node.power, thr.nodePowerWarn, thr.nodePowerHot);
        const fanRatio = node.fanTotal > 0 ? node.fanOk / node.fanTotal : 1;
        const fanTone  = fanRatio < 0.75 ? "crit" : fanRatio < 1 ? "warn" : "";
        // GPUs against the BMC's GPU slot limits, not the CPU's.
        const gpuWarn = thermByName.gpu_warn_c ?? thr.tempWarn;
        const gpuCrit = thermByName.gpu_crit_c ?? thr.tempCrit;
        const gpuTempTone = tone(node.gpuTempMax || 0, gpuWarn, gpuCrit);
        const isOffline = node.age >= thr.ageStale;
        const colorFor = t => t === "crit" ? "var(--crit)" : t === "warn" ? "var(--warn)" : "var(--ok)";
        // Temperature bars span <idle> .. crit + 10. Previously they used the
        // reading as a percentage, so 55 C filled 55% of a track that meant
        // nothing: the bottom covered temperatures that never occur and the top
        // was unreachable. The floor is each domain's realistic idle -- CPU 45,
        // GPU 30 -- so the bar starts near empty on a quiet node and full means
        // "at the hardware limit", comparable across tiles whose limits differ
        // (CPU 100, GPU 96). Matches the 45 C floor on the temperature chart.
        const tempBarPct = (value, crit, idle) => {
          const hi = (crit || 100) + 10;
          return Math.max(0, Math.min(100, ((value - idle) / (hi - idle)) * 100));
        };

        const rawRows = node.rawMetrics.map(r => ({
          module: r.module || "",
          name: r.name || "",
          value: r.value,
          unit: r.unit || "",
        }));
        const sortedMetrics = [...rawRows].sort((a, b) => sortAsc
          ? a.module.localeCompare(b.module) || a.name.localeCompare(b.name)
          : b.module.localeCompare(a.module) || b.name.localeCompare(a.name));

        const tsText = node.timestampMs ? new Date(node.timestampMs).toLocaleTimeString("en-US",{hour12:false}) : "—";

        const controlActions = [
          {label:"Emergency Shell", icon:"›_", color:"var(--warn)",   onClick:() => setShellOpen(true)},
          {label:"CPU Tuning",      icon:"◱", color:"var(--accent)", onClick:() => setFreqOpen(true)},
          {label:"Fan Control",     icon:"✲", color:"var(--accent)", onClick:() => setFanOpen(true)},
          {label:"GPU Tuning",      icon:"⚡", color:"var(--accent)", onClick:() => setGpuOpen(true)},
          {label:"CPU Cores",       icon:"⊞", color:"var(--accent)", onClick:() => setCoresOpen(true)},
          {label:"PCIe Tuning",     icon:"⇌", color:"var(--accent)", onClick:() => setPcieOpen(true)},
        ];

        return (
          <div className="nd-layout">
            <header className="nd-topbar">
              <a href="index.html" className="nd-back">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
                Back

              <span className="nd-node-name">{node.id}</span>
              <span className="nd-node-ip">{node.ip}</span>
              <span className={`node-age ${isOffline ? "crit" : ""}`}>
                <span className="node-age-dot" />

              </span>
              <div className="nd-spacer" />
              <label style={{ display:"flex", alignItems:"center", gap:6, fontSize:11, fontWeight:600, color:"var(--muted)", letterSpacing:"0.04em", textTransform:"uppercase" }}>
                Group
                <select value={currentGroup} onChange={e => setNodeGroup(e.target.value)}

                  <option value="">— ungrouped —</option>
                  <option value="idle">idle</option>
                  <option value="login">login</option>
                  <option value="cpu">cpu</option>

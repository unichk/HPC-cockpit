                  <div className="nd-shell-tokenrow" style={{ margin: 0 }}>
                    <span className="lbl">Token</span>
                    <span style={{ flex: 1, fontFamily: "var(--mono)", fontSize: 12, color: "var(--muted)" }}>•••••••• (session)</span>
                    <span className="change" onClick={() => { setEditingToken(true); setTokenDraft(""); }}>[change]</span>
                  </div>
                )}

                {needsBmcCreds && (editingBmc ? (
                  <div className="nd-shell-tokenrow" style={{ margin: 0, gap: 6 }}>
                    <span className="lbl">BMC</span>
                    <input type="text" value={bmcUserDraft} onChange={e => setBmcUserDraft(e.target.value)}
                      placeholder="user (e.g. admin)" autoFocus style={{ flex: "1 1 100px" }} />
                    <input type="password" value={bmcPassDraft} onChange={e => setBmcPassDraft(e.target.value)}
                      onKeyDown={e => e.key === "Enter" && saveBmcCreds()}
                      placeholder="password" style={{ flex: "1 1 140px" }} />
                    <button onClick={saveBmcCreds} disabled={!bmcUserDraft.trim() || !bmcPassDraft}>Save</button>
                  </div>
                ) : (
                  <div className="nd-shell-tokenrow" style={{ margin: 0 }}>
                    <span className="lbl">BMC</span>
                    <span style={{ flex: 1, fontFamily: "var(--mono)", fontSize: 12, color: "var(--muted)" }}>{bmcUser} @ {node.bmcHost || "?"} · ••••••• (session)</span>
                    <span className="change" onClick={() => { setEditingBmc(true); setBmcUserDraft(bmcUser); setBmcPassDraft(""); }}>[change]</span>
                  </div>
                ))}

                {profileApi && (
                  <div>
                    <div style={sectionLbl}>Fan profile</div>
                    <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                      <select value={pickProfile} onChange={e => setPickProfile(e.target.value)} disabled={!profiles}
                        style={{ ...inputStyle, fontSize: 12 }}>
                        {!profiles && <option value="">{token && bmcReady ? (busy ? "loading…" : "—") : "enter token + BMC login"}</option>}
                        {realProfiles.map(p => <option key={p} value={p}>{p}{p === activeProfile ? "  (active)" : ""}</option>)}
                      </select>
                      <button className="nd-freq-btn" disabled={!canAct || !pickProfile}
                        onClick={() => runProfile({ op: "activate", name: pickProfile })}>Activate</button>
                      <button className="nd-freq-btn" disabled={!canAct} title="Re-read the BMC"
                        onClick={() => runProfile({ op: "status" })}>↻</button>
                    </div>
                  </div>
                )}

                {legacy && !profileApi && (
                  <div>
                    <div style={sectionLbl}>Mode</div>
                    <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                      <select value={mode} onChange={e => setMode(e.target.value)} style={{ ...inputStyle, fontSize: 12 }}>
                        <option value="auto">Auto (BMC-controlled)</option>
                        <option value="manual">Manual (override)</option>
                      </select>
                      <button className="nd-freq-btn" onClick={() => runLegacy(legacy.setMode(mode))} disabled={!canAct}>Set mode</button>
                    </div>
                  </div>
                )}

                {supported && (
                  <div>
                    <div style={sectionLbl}>Manual duty %</div>
                    {profileApi && (
                      <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 8, fontSize: 12, flexWrap: "wrap" }}>
                        {[["floor", "Floor — minimum X%, thermal ramps stay on"], ["pin", "Pin — exactly X%, no thermal ramp"]].map(([k, lbl]) => (
                          <label key={k} style={{ display: "flex", gap: 4, alignItems: "center", cursor: "pointer",
                            padding: "4px 8px", borderRadius: 6, border: "1px solid var(--line)",
                            background: kind === k ? "var(--accent-soft)" : "var(--surface-2)" }}>
                            <input type="radio" name="fankind" checked={kind === k} onChange={() => setKind(k)} />{lbl}
                          </label>
                        ))}
                        <span style={{ color: "var(--muted)" }}>based on</span>
                        <select value={baseProfile} onChange={e => setBaseProfile(e.target.value)} disabled={!profiles}
                          style={{ ...inputStyle, flex: "0 0 auto", fontSize: 12, padding: "4px 6px" }}>
                          {realProfiles.map(p => <option key={p} value={p}>{p}</option>)}
                        </select>
                      </div>
                    )}
                    {profileApi && kind === "pin" && (
                      <div style={{ ...notice("crit"), marginBottom: 8 }}>
                        <b style={{ color: "var(--crit)" }}>Pin disables thermal protection.</b> Fans stay at exactly this duty however hot anything gets. Under GPU load, HIC reached 95 °C at 30% even at idle — use Pin only while watching temperatures, and Activate a real profile afterwards.
                      </div>
                    )}
                    {profileApi && pctValid && pctVal < 30 && (
                      <div style={{ ...notice("warn"), marginBottom: 8 }}>
                        <b style={{ color: "var(--warn)" }}>Below 30%.</b> At idle HIC reached 95 °C with fans at 30%, so watch it.
                        {pctVal < 10 && " Below ~10% the CPU fans drop under the BMC's 1,500 rpm warning level (≈9%) and 1,200 rpm critical level (≈6%), which logs fan-failure events and may make the BMC force full speed."}
                        {kind === "floor" ? " Floor keeps the thermal ramps, so fans still rise as sensors warm." : " With Pin nothing will raise them — you will be asked to confirm."}
                      </div>
                    )}
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
                      {presets.map(p => (
                        <button key={p} className="nd-freq-preset" onClick={() => setCustomPct(String(p))} title={`${p}% PWM`}>{p}%</button>
                      ))}
                    </div>
                    <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                      <input type="number" value={customPct} onChange={e => setCustomPct(e.target.value)}
                        placeholder={`% (${minPct}–100)`} min={minPct} max={100} style={inputStyle} />
                      <button className="nd-freq-btn" disabled={!canAct || !pctValid || (profileApi && !baseProfile)}
                        onClick={() => {
                          if (!profileApi) return runLegacy(legacy.setDuty(pctVal));
                          if (kind === "pin" && pctVal < 30 && !window.confirm(
                              `Pin all fans at ${pctVal}% on ${nodeId} with NO thermal protection?\n\n` +
                              `Nothing will speed the fans up if the node heats. Watch temperatures and ` +
                              `activate a real profile afterwards.`)) return;
                          runProfile({ op: "manual", pct: pctVal, kind, base: baseProfile });
                        }}>Apply</button>
                    </div>
                  </div>
                )}

                {result && (
                  <div style={{ fontFamily: "var(--mono)", fontSize: 12, padding: "6px 10px", borderRadius: 6,
                    background: result.tone === "bad" ? "color-mix(in oklab, var(--crit) 12%, var(--surface-2))"
                              : "color-mix(in oklab, var(--ok) 10%, var(--surface-2))",
                    color: result.tone === "bad" ? "var(--crit)" : "var(--ink)", whiteSpace: "pre-wrap", wordBreak: "break-word" }}>
                    {result.text}
                  </div>
                )}

                {supported && (
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderTop: "1px solid var(--line)", paddingTop: 10 }}>
                    <span onClick={!canAct ? undefined : () => profileApi
                          ? runProfile({ op: "activate", name: baseProfile || "default" })
                          : runLegacy(legacy.restore())}
                      style={{ fontSize: 11, color: !canAct ? "var(--muted)" : "var(--accent)", cursor: !canAct ? "default" : "pointer", textDecoration: "underline", textDecorationStyle: "dotted" }}>
                      {profileApi ? `Restore (activate ${baseProfile || "default"}, remove MANUAL)` : "Restore (re-enable auto control)"}
                    </span>
                    <span style={{ fontSize: 10, color: "var(--muted)" }}>{busy ? "running…" : ""}</span>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      // Map key → vendor name from gpu_collector.cpp's GpuVendor enum
      // (exposed via live-data.js as node.gpus[i].vendor).
      // Map key → vendor name from gpu_collector.cpp's GpuVendor enum
      // (exposed via live-data.js as node.gpus[i].vendor).
      const GPU_CMDS = {
        amd: {
          setPowerCap: (i, w) => `rocm-smi -d ${i} --setpoweroverdrive ${w} --autorespond y\necho "cap=${w}W"`,
          setPerfLevel: (i, lvl) => {
            // rocm-smi --setperflevel accepts: auto, low, high, manual, profile_*
            const rocmLvl = { low: "low", balanced: "auto", performance: "high", max: "high" }[lvl] || "auto";
            return `rocm-smi -d ${i} --setperflevel ${rocmLvl} --autorespond y\necho "perf=${rocmLvl}"`;
          },
          restore: (i) =>
            `rocm-smi -d ${i} --resetpoweroverdrive --autorespond y && ` +
            `rocm-smi -d ${i} --setperflevel auto --autorespond y\necho "restored"`,
        },
        nvidia: {
          setPowerCap: (i, w) =>
            `nvidia-smi -i ${i} -pm 1 >/dev/null && nvidia-smi -i ${i} -pl ${w}\necho "cap=${w}W"`,
          setPerfLevel: (i, lvl) => {
            const arg = { low: "-lgc 300,800", balanced: "-rgc", performance: "-lgc 1200,1800", max: "-lgc 1500,2100" }[lvl] || "-rgc";
            return `nvidia-smi -i ${i} ${arg}\necho "perf=${lvl}"`;
          },
          restore: (i) =>
            `nvidia-smi -i ${i} -rgc\necho "clocks reset to default (power cap untouched — re-apply via Apply if needed)"`,
        },
      };

      function GpuModal({ nodeId, node, onClose }) {
        const [token, setToken] = useState(() => sessionStorage.getItem("cockpit_exec_token") || "");
        const [tokenDraft, setTokenDraft] = useState("");
        const [editingToken, setEditingToken] = useState(() => !sessionStorage.getItem("cockpit_exec_token"));
        const [sel, setSel] = useState(0);
        const [customW, setCustomW] = useState("");
        const [level, setLevel] = useState("balanced");
        const [busy, setBusy] = useState(false);
        const [result, setResult] = useState(null);

        const gpus = Array.isArray(node.gpus) ? node.gpus : [];
        const selected = gpus[sel] || null;
        const vendor = selected ? selected.vendor : "unknown";
        const cmds = GPU_CMDS[vendor];
        const supported = !!cmds;

        useEffect(() => {
          const onKey = (e) => { if (e.key === "Escape") onClose(); };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [onClose]);

        function saveToken() {
          const t = tokenDraft.trim();
          if (!t) return;
          sessionStorage.setItem("cockpit_exec_token", t);
          setToken(t); setTokenDraft(""); setEditingToken(false);
        }

        async function runExec(cmd) {
          if (!token || busy) return;
          setBusy(true); setResult(null);
          try {
            const r = await fetch(`/api/node/${encodeURIComponent(nodeId)}/exec`, {
              method: "POST",
              headers: { "Content-Type": "application/json", "X-Exec-Token": token },
              body: JSON.stringify({ cmd, timeout_s: 15 }),
            });
            const raw = await r.text();
            let body = null;
            try { body = JSON.parse(raw); } catch {}
            if (!r.ok) {
              setResult({ tone: "bad", text: (body && body.error) || `HTTP ${r.status}` });
            } else if (body && body.error) {
              setResult({ tone: "bad", text: `error: ${body.error}${body.stderr ? ` — ${body.stderr.trim()}` : ""}` });
            } else if (body && typeof body.exit === "number" && body.exit !== 0) {
              setResult({ tone: "bad", text: `exit=${body.exit}${body.stderr ? ` — ${body.stderr.trim()}` : ""}` });
            } else {
              setResult({ tone: "ok", text: (body && (body.stdout || "").trim()) || "done" });
            }
          } catch (err) {
            setResult({ tone: "bad", text: String(err && err.message || err) });
          } finally { setBusy(false); }
        }

        function applyPowerCap() {
          if (!supported || !selected) return;
          const w = parseInt(customW, 10);
          if (!Number.isFinite(w) || w < 1 || w > 1000) return;
          runExec(cmds.setPowerCap(selected.idx, w));
        }
        function applyPerfLevel() {
          if (!supported || !selected) return;
          runExec(cmds.setPerfLevel(selected.idx, level));
        }
        function restoreDefaults() {
          if (!supported || !selected) return;
          runExec(cmds.restore(selected.idx));
        }

        const vendorLabel = vendor === "unknown" ? "unknown" : vendor.toUpperCase();
        const capNum = selected && selected.powerCapW > 0 ? Math.round(selected.powerCapW) : 0;
        const presetsW = capNum > 0
          ? [Math.round(capNum * 0.5), Math.round(capNum * 0.7), Math.round(capNum * 0.85), capNum]
          : [100, 150, 200, 250];
        const levelOpts = [
          { k: "low",         lbl: "Low (power save)" },
          { k: "balanced",    lbl: "Balanced (default)" },
          { k: "performance", lbl: "Performance" },
          { k: "max",         lbl: "Max" },
        ];
        const wVal = parseInt(customW, 10);
        const wValid = Number.isFinite(wVal) && wVal >= 1 && wVal <= 1000;
        const inputStyle = { flex: 1, padding: "6px 8px", borderRadius: 6, border: "1px solid var(--line)", background: "var(--surface-2)", color: "var(--ink)", fontFamily: "var(--mono)", fontSize: 13 };

        return (
          <div className="nd-modal-bg" onClick={e => e.target === e.currentTarget && onClose()}>
            <div className="nd-modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 640, height: "auto" }}>
              <div className="nd-modal-head">
                <span className="nd-modal-title">GPU Tuning · {nodeId}</span>
                <span className="nd-modal-warn">⚠ Per-GPU · root</span>
                <button className="nd-modal-close" onClick={onClose} title="Close (Esc)">×</button>
              </div>

              <div style={{ padding: "14px 16px", display: "flex", flexDirection: "column", gap: 14 }}>
                {(gpus.length === 0 || node.gpuPlaceholder) ? (
                  <div style={{ fontSize: 12, color: "var(--muted)", fontFamily: "var(--mono)" }}>
                    <em>No GPU available on this node.</em>
                    <div style={{ marginTop: 8, fontSize: 11, lineHeight: 1.5 }}>
                      If a GPU is physically present, verify that <code>rocm-smi</code> (AMD) or <code>nvidia-smi</code> (NVIDIA) is installed and on <code>$PATH</code> for the worker. See <code>worker/src/collectors/gpu_collector.cpp</code>.
                    </div>
                  </div>
                ) : (
                  <>
                    {gpus.length > 1 && (
                      <div>
                        <div style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--muted)", fontWeight: 700, marginBottom: 6 }}>GPU</div>
                        <select value={sel} onChange={e => { setSel(parseInt(e.target.value, 10) || 0); setResult(null); }}
                          style={{ ...inputStyle, width: "100%", fontSize: 12 }}>
                          {gpus.map(g => (
                            <option key={g.idx} value={g.idx}>
                              GPU {g.idx} · {g.vendor.toUpperCase()} · {Math.round(g.tempC)}°C · {Math.round(g.powerW)}W
                            </option>
                          ))}
                        </select>
                      </div>
                    )}

                    {selected && (
                      <div style={{ fontSize: 12, color: "var(--muted)", fontFamily: "var(--mono)" }}>
                        GPU {selected.idx} · <b style={{ color: "var(--ink)" }}>{vendorLabel}</b>
                        {" · "}<b style={{ color: "var(--ink)" }}>{Math.round(selected.tempC)}°C</b>
                        {" · "}<b style={{ color: "var(--ink)" }}>{Math.round(selected.powerW)}W</b>
                        {selected.powerCapW > 0 && <> / <b style={{ color: "var(--ink)" }}>{Math.round(selected.powerCapW)}W cap</b></>}
                        {selected.clockMhz > 0 && <> · <b style={{ color: "var(--ink)" }}>{Math.round(selected.clockMhz)} MHz</b></>}
                        {selected.memTotalMb > 0 && <> · {Math.round((selected.memUsedMb||0) / 1024)}/{Math.round(selected.memTotalMb/1024)} GiB VRAM</>}
                        {" · "}util <b style={{ color: "var(--ink)" }}>{Math.round(selected.utilPct)}%</b>
                      </div>
                    )}

                    {!supported && (
                      <div style={{ fontSize: 12, padding: "10px 12px", borderRadius: 6,
                        background: "color-mix(in oklab, var(--warn) 12%, var(--surface-2))",
                        color: "var(--ink)", border: "1px solid color-mix(in oklab, var(--warn) 40%, var(--line))", lineHeight: 1.5 }}>
                        <div style={{ fontWeight: 700, marginBottom: 4, color: "var(--warn)" }}>GPU tuning is not supported for this vendor.</div>
                        Detected: <b>{vendorLabel}</b>. This card has verified command templates only for AMD (<code>rocm-smi</code>) and NVIDIA (<code>nvidia-smi</code>). Add opcodes to the <code>GPU_CMDS</code> table in <code>server/web/node.html</code> to extend.
                      </div>
                    )}

                    {editingToken ? (
                      <div className="nd-shell-tokenrow" style={{ margin: 0 }}>
                        <span className="lbl">Token</span>
                        <input type="password" value={tokenDraft} onChange={e => setTokenDraft(e.target.value)}
                          onKeyDown={e => e.key === "Enter" && saveToken()}
                          placeholder="exec_token from worker.conf" autoFocus />
                        <button onClick={saveToken} disabled={!tokenDraft.trim()}>Save</button>
                      </div>
                    ) : (
                      <div className="nd-shell-tokenrow" style={{ margin: 0 }}>
                        <span className="lbl">Token</span>
                        <span style={{ flex: 1, fontFamily: "var(--mono)", fontSize: 12, color: "var(--muted)" }}>•••••••• (session)</span>
                        <span className="change" onClick={() => { setEditingToken(true); setTokenDraft(""); }}>[change]</span>
                      </div>
                    )}

                    <div>
                      <div style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--muted)", fontWeight: 700, marginBottom: 6 }}>Power cap (W)</div>
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
                        {presetsW.map(p => (
                          <button key={p} className="nd-freq-preset" disabled={!supported}
                            onClick={() => setCustomW(String(p))}
                            style={{ opacity: supported ? 1 : 0.5, cursor: supported ? "pointer" : "not-allowed" }}
                            title={`${p} W`}>
                            {p}W
                          </button>
                        ))}
                      </div>
                      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                        <input type="number" value={customW} onChange={e => setCustomW(e.target.value)}
                          disabled={!supported}
                          placeholder="Watts (1–1000)" min={1} max={1000}
                          style={{ ...inputStyle, opacity: supported ? 1 : 0.5 }} />
                        <button className="nd-freq-btn" onClick={applyPowerCap} disabled={!supported || !token || busy || !wValid}>Apply</button>
                      </div>
                    </div>

                    <div>
                      <div style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--muted)", fontWeight: 700, marginBottom: 6 }}>Clock / perf level</div>
                      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                        <select value={level} onChange={e => setLevel(e.target.value)} disabled={!supported}
                          style={{ ...inputStyle, fontSize: 12, opacity: supported ? 1 : 0.5 }}>
                          {levelOpts.map(o => <option key={o.k} value={o.k}>{o.lbl}</option>)}
                        </select>
                        <button className="nd-freq-btn" onClick={applyPerfLevel} disabled={!supported || !token || busy}>Set</button>
                      </div>
                    </div>

                    {result && (
                      <div style={{ fontFamily: "var(--mono)", fontSize: 12, padding: "6px 10px", borderRadius: 6,
                        background: result.tone === "bad" ? "color-mix(in oklab, var(--crit) 12%, var(--surface-2))" : "color-mix(in oklab, var(--ok) 10%, var(--surface-2))",
                        color: result.tone === "bad" ? "var(--crit)" : "var(--ink)", whiteSpace: "pre-wrap", wordBreak: "break-word" }}>
                        {result.text}
                      </div>
                    )}

                    {supported && (
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderTop: "1px solid var(--line)", paddingTop: 10 }}>
                        <span onClick={busy ? undefined : restoreDefaults}
                          style={{ fontSize: 11, color: busy ? "var(--muted)" : "var(--accent)", cursor: busy ? "default" : "pointer", textDecoration: "underline", textDecorationStyle: "dotted" }}>
                          Restore (reset cap + perf to default)
                        </span>
                        <span style={{ fontSize: 10, color: "var(--muted)" }}>{busy ? "running…" : ""}</span>
                      </div>
                    )}
                  </>
                )}
              </div>
            </div>
          </div>
        );
      }

      function NodeDetailPage() {
        const params = new URLSearchParams(window.location.search);
        const nodeId = params.get("node") || "";
        const [theme, setTheme] = useState(readThemeFromSettings);
        const [node, setNode] = useState(null);
        const [sortAsc, setSortAsc] = useState(true);
        const [notFound, setNotFound] = useState(false);
        const [shellOpen, setShellOpen] = useState(false);
        const [freqOpen, setFreqOpen] = useState(false);
        const [fanOpen, setFanOpen] = useState(false);
        const [gpuOpen, setGpuOpen] = useState(false);
        const [coresOpen, setCoresOpen] = useState(false);
        const now = useClock();
        const [settings, setSettings] = useState(() => readSettings());
        const baseThr = { ...THR, ...(settings.alerts || {}) };
        // Group power overrides apply when this node is in nodeGroups.
        const thr = window.nodeThresholds
          ? window.nodeThresholds(nodeId, settings, baseThr)
          : baseThr;
        const currentGroup = (settings.nodeGroups && settings.nodeGroups[nodeId]) || "";

        // Hydrate from server on mount so per-node thresholds reflect what was
        // saved on the settings page (which writes to /api/settings, not just
        // localStorage).
        useEffect(() => {
          if (!window.loadSettings) return;
          let cancelled = false;
          window.loadSettings().then(s => {
            if (cancelled || !s) return;
            if (s.theme && s.theme !== theme) setTheme(s.theme);
            setSettings(s);
          });
          return () => { cancelled = true; };
        }, []);

        function setNodeGroup(group) {
          const next = {
            ...settings,
            nodeGroups: { ...(settings.nodeGroups || {}) },
          };
          if (group) next.nodeGroups[nodeId] = group;
          else delete next.nodeGroups[nodeId];
          setSettings(next);
          writeSettings({ nodeGroups: next.nodeGroups });
        }

        useEffect(() => {
          document.documentElement.dataset.theme = theme;
          writeSettings({ theme });
        }, [theme]);

        useEffect(() => {
          if (!nodeId) { setNotFound(true); return; }
          return window.startLiveNodeDetail(nodeId, (n) => {
            if (n) setNode(n); else setNotFound(true);
          });
        }, [nodeId]);

        if (!nodeId || (notFound && !node)) {
          return (
            <div style={{ padding: 40, color: "var(--muted)", fontFamily: "var(--font)" }}>
              Node <strong>{nodeId || "(none)"}</strong> not found.
              {" "}<a href="index.html" style={{ color: "var(--accent)" }}>← Back</a>
            </div>
          );
        }
        if (!node) {
          return <div style={{ padding: 40, color: "var(--muted)", fontFamily: "var(--font)" }}>Loading {nodeId}…</div>;
        }

        const cpuTone  = tone(node.cpu,   thr.cpuWarn,       thr.cpuHot);
        const memTone  = tone(node.memPct, 75,               90);
        const swapTone = tone(node.swapPct, 20,              50);
        // Hardware-published CPU limits take precedence over the UI settings.
        // The BMC reports the board vendor's own thresholds for each sensor
        // (97/100 on this board), whereas alerts.tempWarn/tempCrit are a
        // generic default someone typed into the settings page. Fall back to
        // the settings only when the hardware publishes nothing.
        const thermByName = {};
        for (const m of node.rawMetrics || []) {
          if (m.module === "thermal" && typeof m.value === "number") thermByName[m.name] = m.value;
        }
        const tempWarn = thermByName.cpu_warn_c ?? thr.tempWarn;
        const tempCrit = thermByName.cpu_crit_c ?? thr.tempCrit;
        const tempTone = tone(node.temp,  tempWarn,          tempCrit);
        const powTone  = tone(node.power, thr.nodePowerWarn, thr.nodePowerHot);
        const fanRatio = node.fanTotal > 0 ? node.fanOk / node.fanTotal : 1;
        const fanTone  = fanRatio < 0.75 ? "crit" : fanRatio < 1 ? "warn" : "";
        // GPUs against the BMC's GPU slot limits, not the CPU's.
        const gpuWarn = thermByName.gpu_warn_c ?? thr.tempWarn;
        const gpuCrit = thermByName.gpu_crit_c ?? thr.tempCrit;
        const gpuTempTone = tone(node.gpuTempMax || 0, gpuWarn, gpuCrit);
        const isOffline = node.age >= thr.ageStale;
        const colorFor = t => t === "crit" ? "var(--crit)" : t === "warn" ? "var(--warn)" : "var(--ok)";
        // Temperature bars span <idle> .. crit + 10. Previously they used the
        // reading as a percentage, so 55 C filled 55% of a track that meant
        // nothing: the bottom covered temperatures that never occur and the top
        // was unreachable. The floor is each domain's realistic idle -- CPU 45,
        // GPU 30 -- so the bar starts near empty on a quiet node and full means
        // "at the hardware limit", comparable across tiles whose limits differ
        // (CPU 100, GPU 96). Matches the 45 C floor on the temperature chart.
        const tempBarPct = (value, crit, idle) => {
          const hi = (crit || 100) + 10;
          return Math.max(0, Math.min(100, ((value - idle) / (hi - idle)) * 100));
        };

        const rawRows = node.rawMetrics.map(r => ({
          module: r.module || "",
          name: r.name || "",
          value: r.value,
          unit: r.unit || "",
        }));
        const sortedMetrics = [...rawRows].sort((a, b) => sortAsc
          ? a.module.localeCompare(b.module) || a.name.localeCompare(b.name)
          : b.module.localeCompare(a.module) || b.name.localeCompare(a.name));

        const tsText = node.timestampMs ? new Date(node.timestampMs).toLocaleTimeString("en-US",{hour12:false}) : "—";

        const controlActions = [
          {label:"Emergency Shell", icon:"›_", color:"var(--warn)",   desc:"Run a shell command on this node", onClick:() => setShellOpen(true)},
          {label:"CPU Frequency",   icon:"◱", color:"var(--accent)", desc:"Clamp CPU clock speed", onClick:() => setFreqOpen(true)},
          {label:"Fan Control",     icon:"✲", color:"var(--accent)", desc:"Override fan speed", onClick:() => setFanOpen(true)},
          {label:"GPU Tuning",      icon:"⚡", color:"var(--accent)", desc:"Power cap & clocks per GPU", onClick:() => setGpuOpen(true)},
          {label:"CPU Cores",       icon:"⊞", color:"var(--accent)", desc:"Online/offline individual cores", onClick:() => setCoresOpen(true)},
        ];

        return (
          <div className="nd-layout">
            <header className="nd-topbar">
              <a href="index.html" className="nd-back">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
                Back
              </a>
              <span className={`status-dot ${isOffline ? "crit" : cpuTone}`} />
              <span className="nd-node-name">{node.id}</span>
              <span className="nd-node-ip">{node.ip}</span>
              <span className={`node-age ${isOffline ? "crit" : ""}`}>
                <span className="node-age-dot" />
                {isOffline ? `offline · ${Math.floor(node.age)}s ago` : `live · ${node.age.toFixed(1)}s`}
              </span>
              <div className="nd-spacer" />
              <label style={{ display:"flex", alignItems:"center", gap:6, fontSize:11, fontWeight:600, color:"var(--muted)", letterSpacing:"0.04em", textTransform:"uppercase" }}>
                Group
                <select value={currentGroup} onChange={e => setNodeGroup(e.target.value)}
                  style={{ padding:"4px 8px", borderRadius:6, border:"1px solid var(--line)", background:"var(--surface-2)", color:"var(--ink)", fontFamily:"var(--font)", fontSize:12, fontWeight:600, cursor:"pointer" }}
                  title="Apply group power thresholds to this node">
                  <option value="">— ungrouped —</option>
                  <option value="idle">idle</option>
                  <option value="login">login</option>
                  <option value="cpu">cpu</option>
                  <option value="gpu">gpu</option>
                </select>
              </label>
              <span className="nd-clock">{now.toLocaleTimeString("en-US", { hour12: false })}</span>
              <button className="icon-btn" onClick={() => setTheme(t => t === "dark" ? "light" : "dark")} title="Toggle theme">
                {theme === "dark"
                  ? <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2"/></svg>
                  : <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                }
              </button>
            </header>

            <div className="nd-summary">
              <div className={`nd-kpi ${cpuTone}`}>
                <div className="nd-kpi-label">CPU Usage</div>
                <div className="nd-kpi-val">{Math.round(node.cpu)}<span className="u">%</span></div>
                <div className="nd-kpi-bar"><div className="nd-kpi-bar-fill" style={{ width: `${node.cpu}%`, background: colorFor(cpuTone) }} /></div>
                <div className="nd-kpi-sub">
                  {node.cpuFreqMhz > 0
                    ? `${formatMhz(node.cpuFreqMhz)}${node.cpuGovernor ? ` · ${node.cpuGovernor}` : ""}${node.cpuCoreCount > 0 ? ` · ${node.cpuCoresOnline}/${node.cpuCoreCount} cores` : ""}`
                    : (node.cpuCoreCount > 0
                        ? `${node.cpuCoresOnline}/${node.cpuCoreCount} cores online`
                        : `Warn ${thr.cpuWarn}% · Crit ${thr.cpuHot}%`)}
                </div>
              </div>
              <div className={`nd-kpi ${memTone}`}>
                <div className="nd-kpi-label">Memory</div>
                <div className="nd-kpi-val">{node.memG.toFixed(1)}<span className="u">/{node.memTotal}G</span></div>
                <div className="nd-kpi-bar"><div className="nd-kpi-bar-fill" style={{ width: `${Math.min(100, node.memPct)}%`, background: "var(--mem)" }} /></div>
                <div className="nd-kpi-sub">{node.memPct.toFixed(0)}% used · {(node.memTotal - node.memG).toFixed(1)}G free</div>
              </div>
              <div className={`nd-kpi ${swapTone}`}>
                <div className="nd-kpi-label">Swap</div>
                <div className="nd-kpi-val">{node.swapG.toFixed(1)}<span className="u">/{node.swapTotal}G</span></div>
                <div className="nd-kpi-bar"><div className="nd-kpi-bar-fill" style={{ width: `${Math.min(100, node.swapPct)}%`, background: "var(--swap)" }} /></div>
                <div className="nd-kpi-sub">{node.swapPct.toFixed(0)}% used</div>
              </div>
              <div className="nd-kpi">
                <div className="nd-kpi-label">Load Average</div>
                <div className="nd-load-chips">
                  {["1m","5m","15m"].map((l,i) => (
                    <div className="nd-load-chip" key={l}><span>{l}</span>{node.load[i].toFixed(2)}</div>
                  ))}
                </div>
                <div className="nd-kpi-sub">From /proc/loadavg</div>
              </div>
              <div className={`nd-kpi ${tempTone}`}>
                <div className="nd-kpi-label">CPU Temp</div>
                <div className="nd-kpi-val">{Math.round(node.temp)}<span className="u">°C</span></div>
                <div className="nd-kpi-bar"><div className="nd-kpi-bar-fill" style={{ width: `${tempBarPct(node.temp, tempCrit, 45)}%`, background: colorFor(tempTone) }} /></div>
                <div className="nd-kpi-sub">Warn {tempWarn}° · Crit {tempCrit}°</div>
              </div>
              <div className={`nd-kpi ${fanTone}`}>
                <div className="nd-kpi-label">Fans</div>
                <div className="nd-kpi-val">{node.fanOk}<span className="u">/{node.fanTotal} OK</span></div>
                <div className="nd-kpi-sub">{(node.fanRpm/1000).toFixed(1)} kRPM avg</div>
              </div>
              <div className={`nd-kpi power-kpi ${powTone}`}>
                <div className="nd-kpi-label">Node Power</div>
                <div className="nd-kpi-val">{Math.round(node.power)}<span className="u">W</span></div>
                <div className="nd-kpi-bar"><div className="nd-kpi-bar-fill" style={{ width:`${Math.min(100,(node.power/thr.nodePowerHot)*100)}%`, background: colorFor(powTone) }} /></div>
                <div className="nd-kpi-sub">Warn {thr.nodePowerWarn}W · Crit {thr.nodePowerHot}W</div>
              </div>
              {node.gpuCount > 0 && (
                <div className={`nd-kpi ${node.gpuPlaceholder ? "" : gpuTempTone}`}>
                  <div className="nd-kpi-label">GPU</div>
                  {node.gpuPlaceholder ? (
                    <>
                      <div className="nd-kpi-val" style={{ fontSize: 16, color: "var(--muted)", fontWeight: 700 }}>No GPU</div>
                      <div className="nd-kpi-sub">not detected on this node</div>
                    </>
                  ) : (
                    <>
                      <div className="nd-kpi-val">{Math.round(node.gpuTempMax)}<span className="u">°C</span></div>
                      <div className="nd-kpi-bar"><div className="nd-kpi-bar-fill" style={{ width: `${tempBarPct(node.gpuTempMax, gpuCrit, 30)}%`, background: colorFor(gpuTempTone) }} /></div>
                      <div className="nd-kpi-sub">
                        {node.gpuCount}× {node.gpuVendor} · {Math.round(node.gpuPowerSumW)}W · {Math.round(node.gpuUtilAvgPct)}%
                      </div>
                    </>
                  )}
                </div>
              )}
            </div>

            <div className="nd-body">
              <div className="nd-card">
                <h3>Resource Usage</h3>
                <div className="nd-bar-grid">
                  <div className="nd-bar-item">
                    <div className="nd-bar-header">
                      <span className="nd-bar-label">CPU</span>
                      <span className={`nd-bar-value ${cpuTone}`}>{Math.round(node.cpu)}<span className="u">%</span></span>
                    </div>
                    <div className="nd-bar-track"><div className="nd-bar-fill" style={{ width:`${node.cpu}%`, background: colorFor(cpuTone) }} /></div>
                    <MiniChart values={node.cpuHistory} color={colorFor(cpuTone)} height={52} yMin={0} yMax={100}
                      times={node.historyTimes} unit="%" digits={1} />
                  </div>
                  <div className="nd-bar-item">
                    <div className="nd-bar-header">
                      <span className="nd-bar-label">Memory</span>
                      <span className={`nd-bar-value ${memTone}`}>{node.memG.toFixed(1)}<span className="u">G</span></span>
                    </div>
                    <div className="nd-bar-track"><div className="nd-bar-fill" style={{ width:`${Math.min(100, node.memPct)}%`, background:"var(--mem)" }} /></div>
                    <MiniChart values={node.memHistory} color="var(--mem)" height={52} yMin={0} yMax={100}
                      times={node.historyTimes} unit="%" digits={1} />
                  </div>
                  <div className="nd-bar-item">
                    <div className="nd-bar-header">
                      <span className="nd-bar-label">Swap</span>
                      <span className={`nd-bar-value ${swapTone}`}>{node.swapG.toFixed(1)}<span className="u">G</span></span>
                    </div>
                    <div className="nd-bar-track"><div className="nd-bar-fill" style={{ width:`${Math.min(100, node.swapPct)}%`, background:"var(--swap)" }} /></div>
                    <MiniChart values={node.swapHistory} color="var(--swap)" height={52} yMin={0} yMax={100}
                      times={node.historyTimes} unit="%" digits={1} />
                  </div>
                  <div className="nd-bar-item">
                    <div className="nd-bar-header">
                      <span className="nd-bar-label">Temperature</span>
                      <span className={`nd-bar-value ${tempTone}`}>{Math.round(node.temp)}<span className="u">°C</span></span>
                    </div>
                    <div className="nd-bar-track"><div className="nd-bar-fill" style={{ width:`${Math.min(100,node.temp)}%`, background: colorFor(tempTone) }} /></div>
                    <MiniChart values={node.tempHistory} color={colorFor(tempTone)} height={52}
                      yMin={45} yMax={tempCrit + 5} times={node.historyTimes} unit="°C" />
                  </div>
                </div>
              </div>

              <div className="nd-card nd-card-fill">
                <h3>Power Draw</h3>
                <div className="nd-power-grid">
                  <div className="nd-power-left">
                    <div style={{ marginBottom: 10 }}>
                      <div className="nd-bar-header">
                        <span className="nd-bar-label">Node Power</span>
                        <span className={`nd-bar-value ${powTone}`} style={{ fontSize: 22 }}>{Math.round(node.power)}<span className="u">W</span></span>
                      </div>
                      <div className="nd-bar-track" style={{ height: 7, marginTop: 6 }}>
                        <div className="nd-bar-fill" style={{ width:`${Math.min(100,(node.power/thr.nodePowerHot)*100)}%`, background: colorFor(powTone) }} />
                      </div>
                    </div>
                    {/* Fixed 0..crit+100 W scale, so the trace height is
                        comparable over time and between nodes rather than
                        auto-fitting to whatever the last 60 samples spanned.
                        The axis top value is therefore the crit level + 100. */}
                    <MiniChart values={node.powerHistory.map(v => v * 10)} color={colorFor(powTone)}
                      height={80} fill yMin={0} yMax={thr.nodePowerHot + 100}
                      times={node.historyTimes} unit="W" />
                  </div>
                  {/* Power breakdown: everything we can actually measure,
                      plus the shortfall against the node total. The gap is
                      real and large -- fans, DIMMs, drives and PSU conversion
                      loss are not individually instrumented on this chassis --
                      so it is shown explicitly rather than hidden by
                      normalising the parts to 100%. */}
                  <div>
                    <div className="nd-pb-title">Breakdown</div>
                    {(() => {
                      const total = node.power || 0;
                      const parts = [];
                      (node.cpuSockets || []).forEach((w, i) => {
                        if (w > 0) parts.push({ name: `CPU ${i}`, w });
                      });
                      if (node.gpuCount > 0 && node.gpuPowerSumW > 0) {
                        parts.push({ name: `GPUs (${node.gpuCount})`, w: node.gpuPowerSumW });
                      }
                      if (node.dimmPowerW > 0) {
                        parts.push({ name: `DIMMs (${node.dimmCount})`, w: node.dimmPowerW });
                      }
                      const measured = parts.reduce((a, p) => a + p.w, 0);
                      const gap = total - measured;
                      if (parts.length === 0) {
                        return <div className="nd-pb-gap">No component power reported.</div>;
                      }
                      const pct = w => (total > 0 ? (w / total) * 100 : 0);
                      const row = (name, w, muted) => (
                        <div className="nd-pb-row" key={name}>
                          <span className="nd-pb-name" style={muted ? { color: "var(--muted)" } : undefined}>{name}</span>
                          <span>
                            <span className="nd-pb-val" style={muted ? { color: "var(--muted)" } : undefined}>{Math.round(w)}<span className="nd-pb-pct">W</span></span>
                            <span className="nd-pb-pct"> · {pct(w).toFixed(0)}%</span>
                          </span>
                        </div>
                      );
                      return (
                        <>
                          {parts.map(p => row(p.name, p.w, false))}
                          {row("Others", Math.max(0, gap), true)}
                          <div className="nd-pb-sep" />
                          <div className="nd-pb-row">
                            <span className="nd-pb-name">Node total</span>
                            <span><span className="nd-pb-val">{Math.round(total)}<span className="nd-pb-pct">W</span></span></span>
                          </div>
                        </>
                      );
                    })()}
                  </div>
                </div>
              </div>

              <div className="nd-card">
                <h3>Thermal Sensors</h3>
                {(() => {
                  const therm = thermByName;

                  // One panel per thermal domain the worker reports, in a fixed
                  // 2x4 order so the layout does not reflow as sensors come and
                  // go. `key` is the metric-name prefix: the worker emits
                  // <key>_max_c / <key>_count / <key>_warn_c / <key>_crit_c for
                  // each. chipset is the exception -- it is a single sensor and
                  // keeps the historical name chipset_c.
                  // One cell per CPU package. The socket count is whatever the
                  // worker reports -- it emits cpu_package<N>_c per socket --
                  // so a 1-, 2-, 4- or 8-socket machine all render correctly.
                  // Sorted numerically, not lexically, so socket 10 does not
                  // land between 1 and 2 on a large system.
                  // One cell per <stem><N>_c the worker reports, each scored
                  // against its own limits rather than the domain's. Cells show
                  // only the reading; the sensor's identity and what it measures
                  // live in the hover card, because the worker sends numeric
                  // metrics only and cannot ship the BMC's sensor names.
                  //
                  // `width` picks the cell size: "wide" for domains with a
                  // couple of sensors that read better side by side (CPU
                  // sockets, NVMe groups), "full" for a lone sensor that should
                  // own the whole panel, "tri"/"penta" for three or five
                  // across, and the default 4-across grid for anything denser.
                  // Indices are discovered from the data and sorted
                  // numerically, so no sensor count is baked in anywhere.
                  const renderZones = (stem, nameFor, descFor, width) => ({ therm, warn, crit }) => {
                    const wide = width === "wide" || width === "full";
                    const gridCls = width === "full" ? "nd-full-grid"
                                  : width === "tri" ? "nd-tri-grid"
                                  : width === "penta" ? "nd-penta-grid"
                                  : wide ? "nd-cpu-grid" : "nd-zone-grid";
                    const cellCls = wide ? "nd-cpu-cell" : "nd-zone-cell";
                    const valCls  = wide ? "nd-cpu-val"  : "nd-zone-val";
                    const cell = (key, v, w, c, name, desc, edge) => {
                      const t = (typeof c === "number" && v >= c) ? "crit"
                              : (typeof w === "number" && v >= w) ? "warn"
                              : "";
                      return (
                        <div key={key} className={`${cellCls} nd-tip ${edge || ""} ${t}`}>
                          <span className={valCls}>{Math.round(v)}<span className="u">°C</span></span>
                          <span className="nd-tip-pop">
                            <span className="nd-tip-name">{name}</span>
                            <span className="nd-tip-desc">{desc}</span>
                          </span>
                        </div>
                      );
                    };

                    const re = new RegExp(`^${stem}(\\d+)_c$`);
                    const idxs = Object.keys(therm)
                      .map(k => { const m = k.match(re); return m ? parseInt(m[1], 10) : null; })
                      .filter(i => i !== null)
                      .sort((a, b) => a - b);

                    if (idxs.length === 0) {
                      // A worker predating per-sensor metrics publishes only the
                      // domain maximum. Render that as a single cell so the panel
                      // still carries its reading instead of looking broken.
                      const mv = therm[`${stem}_max_c`];
                      if (typeof mv !== "number") return "no readings";
                      return (
                        <div className={gridCls}>
                          {cell("max", mv, warn, crit, "Domain maximum",
                                "Hottest sensor only \u2014 this worker does not report per-sensor values.")}
                        </div>
                      );
                    }

                    // Columns per row, so the first and last of each row can
                    // anchor their popover inward instead of overhanging.
                    const cols = width === "tri" ? 3
                               : width === "penta" ? 5
                               : (width === "full" || wide) ? idxs.length
                               : 4;
                    const edgeOf = n => cols < 2 ? ""
                                      : n % cols === 0 ? "tip-start"
                                      : n % cols === cols - 1 ? "tip-end"
                                      : "";
                    return (
                      <div className={gridCls}>
                        {idxs.map((i, n) => cell(i, therm[`${stem}${i}_c`],
                          // A sensor only publishes its own limits when they
                          // differ from the domain pair, so fall back to the
                          // domain's rather than treating absence as unknown.
                          therm[`${stem}${i}_warn_c`] ?? warn,
                          therm[`${stem}${i}_crit_c`] ?? crit,
                          nameFor(i), descFor(i), edgeOf(n)))}
                      </div>
                    );
                  };

                  const DOMAINS = [
                    { key: "cpu",     label: "CPU",     valueKey: "cpu_package_max_c",
                      render: renderZones("cpu_package",
                        i => `CPU${i}`,
                        i => `Processor package temperature, socket ${i}.`, "wide") },
                    { key: "dimm",    label: "DIMM",    render: renderZones("dimm",
                        i => `DIMM group ${i}`,
                        i => `Memory zone ${i} — one bank of DIMM slots, not a single module.`) },
                    { key: "nvme",    label: "NVMe",    render: renderZones("nvme",
                        i => `NVMe group ${i}`,
                        i => `Drive-bay group ${i} \u2014 a backplane sensor covering several NVMe drives.`, "wide") },
                    { key: "nic",     label: "NIC",     render: renderZones("nic",
                        () => "Network controller",
                        () => "Onboard NIC, read in-band from the kernel \u2014 the BMC exposes no network sensor.", "full") },
                    { key: "psu",     label: "PSU",     render: renderZones("psu",
                        i => `PSU ${i + 1}`,
                        i => `Power supply ${i + 1} internal hotspot \u2014 rises with the current it delivers.`) },
                    // 6 regulators as 2 sockets x 3 rails. The BMC lists them
                    // P0 SOC/CORE/VDDIO then P1 SOC/CORE/VDDIO, so a 3-column
                    // grid in index order puts a socket on each row and a rail
                    // in each column. NOTE: that mapping is inferred from this
                    // board's SDR ordering -- the worker sends numeric indices
                    // only, so a board enumerating its rails differently would
                    // be mislabelled here.
                    { key: "vr",      label: "VR",      render: renderZones("vr",
                        i => `P${Math.floor(i / 3)} ${["SOC", "CORE", "VDDIO"][i % 3]}`,
                        i => [
                          "SoC / IOD rail \u2014 Infinity Fabric, memory controllers, PCIe root complexes.",
                          "Main Vcore regulator \u2014 highest current on the board; climbs fastest under load.",
                          "Memory I/O rail regulator.",
                        ][i % 3], "tri") },
                    // Five sensors measuring three different kinds of thing:
                    // two ambient-air probes, the drive backplane (the machine's
                    // best proxy for intake air, and the only sensor limited to
                    // 55/60), and two host-interface-card controllers that idle
                    // near 65 C against a 105/110 ceiling. Same caveat as VR:
                    // the names come from this board's SDR ordering, since the
                    // worker publishes numeric indices only.
                    { key: "board",   label: "Board",   render: renderZones("board",
                        i => ["M.2 air 1", "M.2 air 2", "Backplane", "HIC 0", "HIC 1"][i] ?? `Board ${i}`,
                        i => [
                          "Ambient air at the M.2 slots \u2014 internal air, not a component.",
                          "Ambient air, second M.2 area.",
                          "Drive backplane board \u2014 the closest thing to an intake air reading.",
                          "Host interface card controller on the PCIe / GPU interconnect path.",
                          "Second host interface card controller.",
                        ][i] ?? "Chassis or board sensor.", "penta") },
                    { key: "chipset", label: "Chipset", valueKey: "chipset_c" },
                  ];

                  return (
                    <div className="nd-therm-grid">
                      {DOMAINS.map(d => {
                        const val = therm[d.valueKey ?? `${d.key}_max_c`];
                        const count = therm[`${d.key}_count`];
                        const warn = therm[`${d.key}_warn_c`];
                        const crit = therm[`${d.key}_crit_c`];
                        const present = typeof val === "number";
                        const tone = !present ? ""
                          : (typeof crit === "number" && val >= crit) ? "crit"
                          : (typeof warn === "number" && val >= warn) ? "warn"
                          : "";
                        return (
                          <div key={d.key} className={`nd-therm-panel ${present ? tone : "absent"}`}>
                            <div className="nd-therm-head">
                              <span className="nd-therm-name">{d.label}</span>
                              <span className="nd-therm-meta">
                                {present
                                  ? `${typeof count === "number" ? `${count | 0} sensor${(count | 0) === 1 ? "" : "s"} \u00b7 ` : ""}${typeof warn === "number" ? `warn ${warn}` : ""}${typeof crit === "number" ? ` / crit ${crit}` : ""}`
                                  : "no sensor"}
                              </span>
                            </div>
                            <div className={`nd-therm-slot ${present && d.render ? "filled" : ""}`}>
                              {!present
                                ? "not present on this board"
                                : d.render
                                  ? d.render({ therm, warn, crit })
                                  : "visualization pending"}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })()}
              </div>

              <div className="nd-card">
                <h3>Fan Status</h3>
                <div style={{ display:"flex", gap:16, marginBottom:14, flexWrap:"wrap" }}>
                  {[
                    { label:"Total fans", val: node.fanTotal || 0 },
                    { label:"Fans OK",    val: node.fanOk || 0 },
                    { label:"Avg RPM",    val: (node.fanRpm || 0).toFixed(0) },
                    { label:"OK Ratio",   val: `${(fanRatio*100).toFixed(0)}%` },
                  ].map(s => (
                    <div key={s.label} style={{ flex:1, minWidth:80, padding:"8px 12px", borderRadius:8, background:"var(--surface-2)", border:"1px solid var(--line)" }}>
                      <div style={{ fontSize:9, letterSpacing:"0.08em", textTransform:"uppercase", color:"var(--muted)", fontWeight:700 }}>{s.label}</div>
                      <div style={{ fontSize:18, fontWeight:800, color:"var(--ink)", fontVariantNumeric:"tabular-nums" }}>{s.val}</div>
                    </div>
                  ))}
                </div>
                <div className="nd-fan-grid">
                  {(node.perFan.length > 0 ? node.perFan : Array.from({ length: Math.max(0, node.fanTotal|0) }).map((_, i) => ({ name: `fan_${i+1}`, rpm: 0 })))
                    .map((f, i) => {
                      const ok = f.rpm > 0;
                      const label = (f.name || "").replace(/_rpm$/, "").toUpperCase();
                      return (
                        <div key={f.name + i} className={`nd-fan-chip ${ok ? "ok" : "fail"}`}>
                          <div className="nd-fan-label">{label || `FAN${i+1}`}</div>
                          <div style={{ fontSize: 13, fontWeight: 800, fontVariantNumeric: "tabular-nums" }}>
                            {ok ? `${(f.rpm/1000).toFixed(1)}k` : "FAIL"}
                          </div>
                          <div style={{ fontSize: 8, opacity: 0.7, fontWeight: 600 }}>RPM</div>
                        </div>
                      );
                    })
                  }
                </div>
              </div>

              {node.gpuCount > 0 && node.gpuPlaceholder && (
                <div className="nd-card full">
                  <h3>GPUs</h3>
                  <div style={{ padding: "14px 16px", borderRadius: 8, background: "var(--surface-2)", border: "1px dashed var(--line)", color: "var(--muted)", fontSize: 13, lineHeight: 1.5 }}>
                    <div style={{ fontWeight: 700, color: "var(--ink)", marginBottom: 4 }}>No GPU available on this node.</div>
                    This card is rendered as a placeholder for UI tuning. Once a GPU is detected by the worker (AMD <code>rocm-smi</code> or NVIDIA <code>nvidia-smi</code>), per-GPU stats will appear here. Disable via <code>?fakegpu=0</code> or set <code>FAKE_GPU_DEFAULT_COUNT = 0</code> in <code>live-data.js</code>.
                  </div>
                </div>
              )}
              {node.gpuCount > 0 && !node.gpuPlaceholder && (
                <div className="nd-card full">
                  <h3>GPUs</h3>
                  <div style={{ display:"flex", gap:16, marginBottom:14, flexWrap:"wrap" }}>
                    {[
                      { label:"Count",        val: node.gpuCount },
                      { label:"Vendor",       val: (node.gpuVendor || "unknown").toUpperCase() },
                      { label:"Max temp",     val: `${Math.round(node.gpuTempMax)}°C` },
                      { label:"Total power",  val: `${Math.round(node.gpuPowerSumW)}W` },
                      { label:"Avg util",     val: `${Math.round(node.gpuUtilAvgPct)}%` },
                    ].map(s => (
                      <div key={s.label} style={{ flex:1, minWidth:80, padding:"8px 12px", borderRadius:8, background:"var(--surface-2)", border:"1px solid var(--line)" }}>
                        <div style={{ fontSize:9, letterSpacing:"0.08em", textTransform:"uppercase", color:"var(--muted)", fontWeight:700 }}>{s.label}</div>
                        <div style={{ fontSize:18, fontWeight:800, color:"var(--ink)", fontVariantNumeric:"tabular-nums" }}>{s.val}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{ overflowX:"auto" }}>
                    <table className="nd-metrics-table">
                      <thead>
                        <tr>
                          <th>#</th><th>Vendor</th><th>Temp</th><th>Util</th>
                          <th>Power</th><th>Cap</th><th>VRAM</th><th>Clock</th>
                        </tr>
                      </thead>
                      <tbody>
                        {(node.gpus || []).map(g => (
                          <tr key={g.idx}>
                            <td><span className="nd-module-badge">GPU{g.idx}</span></td>
                            <td><span className="nd-metric-name">{(g.vendor || "unknown").toUpperCase()}</span></td>
                            <td><span className="nd-metric-val">{g.tempC > 0 ? Math.round(g.tempC) : "—"}</span> <span className="nd-metric-unit">{g.tempC > 0 ? "°C" : ""}</span></td>
                            <td><span className="nd-metric-val">{g.utilPct > 0 ? Math.round(g.utilPct) : "—"}</span> <span className="nd-metric-unit">{g.utilPct > 0 ? "%" : ""}</span></td>
                            <td><span className="nd-metric-val">{g.powerW > 0 ? Math.round(g.powerW) : "—"}</span> <span className="nd-metric-unit">{g.powerW > 0 ? "W" : ""}</span></td>
                            <td><span className="nd-metric-val">{g.powerCapW > 0 ? Math.round(g.powerCapW) : "—"}</span> <span className="nd-metric-unit">{g.powerCapW > 0 ? "W" : ""}</span></td>
                            <td><span className="nd-metric-val">{g.memTotalMb > 0 ? `${Math.round((g.memUsedMb||0)/1024)}/${Math.round(g.memTotalMb/1024)}` : "—"}</span> <span className="nd-metric-unit">{g.memTotalMb > 0 ? "GiB" : ""}</span></td>
                            <td><span className="nd-metric-val">{g.clockMhz > 0 ? Math.round(g.clockMhz) : "—"}</span> <span className="nd-metric-unit">{g.clockMhz > 0 ? "MHz" : ""}</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              <div className="nd-card full">
                <h3>Control Panel</h3>
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
                  {controlActions.map((a,i) => (
                    <button key={i} onClick={a.onClick || (()=>alert(`[Placeholder] ${a.label}`))} style={{
                      display:"flex",flexDirection:"column",alignItems:"flex-start",
                      gap:4,padding:"12px 14px",borderRadius:10,
                      border:`1px solid color-mix(in oklab, ${a.color} 25%, var(--line))`,
                      background:`color-mix(in oklab, ${a.color} 7%, var(--surface-2))`,
                      cursor:"pointer",textAlign:"left",fontFamily:"var(--font)",
                      transition:"all 150ms",
                    }}>
                      <span style={{fontSize:18,lineHeight:1}}>{a.icon}</span>
                      <span style={{fontSize:11,fontWeight:800,color:a.color}}>{a.label}</span>
                      <span style={{fontSize:10,color:"var(--muted)",fontWeight:500}}>{a.desc}</span>
                    </button>
                  ))}
                </div>
              </div>

              <div className="nd-card full">
                <h3>
                  Raw Metrics
                  <span style={{ fontSize:10, color:"var(--muted)", fontWeight:600, textTransform:"none", letterSpacing:0, marginLeft:4 }}>
                    {rawRows.length} entries · updated {tsText}
                  </span>
                </h3>
                <div style={{ overflowX:"auto" }}>
                  <table className="nd-metrics-table">
                    <thead>
                      <tr>
                        <th><button style={{ background:"none",border:"none",cursor:"pointer",font:"inherit",color:"inherit",padding:0 }} onClick={() => setSortAsc(a => !a)}>Module {sortAsc ? "↑" : "↓"}</button></th>
                        <th>Metric</th>
                        <th>Value</th>
                        <th>Unit</th>
                      </tr>
                    </thead>
                    <tbody>
                      {sortedMetrics.map((r, i) => (
                        <tr key={`${r.module}-${r.name}-${i}`}>
                          <td><span className="nd-module-badge">{r.module}</span></td>
                          <td><span className="nd-metric-name">{r.name}</span></td>
                          <td><span className="nd-metric-val">{formatMetricValue(r.value, r.name, r.unit)}</span></td>
                          <td><span className="nd-metric-unit">{displayUnit(r.unit)}</span></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <footer className="nd-footer">
              <span>Node <strong>{node.id}</strong><span className="dot-sep">·</span>{node.ip}<span className="dot-sep">·</span>Live data refresh 1.5s</span>
              <span>HPC Cockpit<span className="dot-sep">·</span>NTU</span>
            </footer>

            {shellOpen && <ShellModal nodeId={node.id} onClose={() => setShellOpen(false)} />}
            {freqOpen && <FreqModal nodeId={node.id} node={node} onClose={() => setFreqOpen(false)} />}
            {fanOpen && <FanModal nodeId={node.id} node={node} onClose={() => setFanOpen(false)} />}
            {gpuOpen && <GpuModal nodeId={node.id} node={node} onClose={() => setGpuOpen(false)} />}
            {coresOpen && <CoreToggleModal nodeId={node.id} node={node} onClose={() => setCoresOpen(false)} />}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<NodeDetailPage />);
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Schedule — HPC Cockpit</title>
  <link rel="icon" type="image/png" href="assets/hpc-cockpit-icon.png" />
  <link rel="stylesheet" href="vendor/fonts.css" />
  <link rel="stylesheet" href="styles.css?v=6" />
  <style>
    .sch-layout { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; overflow: hidden; padding: 8px 10px 4px; gap: 8px; }
    .sch-topbar { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 7px 14px; box-shadow: var(--shadow-sm); }
    .sch-back { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--accent); text-decoration: none; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--accent-soft); transition: all 150ms; flex-shrink: 0; }
    .sch-back:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .sch-title { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; color: var(--ink); }
    .sch-sub { font-size: 11px; color: var(--muted); font-weight: 500; }
    .sch-week-nav { display: flex; gap: 4px; margin-left: 8px; }
    .sch-week-nav button { padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .sch-week-nav button:hover { background: var(--accent-soft); color: var(--accent); }
    .sch-spacer { flex: 1; }
    .sch-add-btn { display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; font-family: var(--font); transition: opacity 150ms; }
    .sch-add-btn:hover { opacity: 0.85; }

    .sch-body { display: grid; grid-template-rows: 1fr; grid-template-columns: 1fr 280px; gap: 10px; min-height: 0; }
    .sch-week { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; min-height: 0; }
    .sch-week-header { display: grid; grid-template-columns: 56px repeat(7, 1fr); border-bottom: 1px solid var(--line); background: var(--surface-2); padding-right: 6px; }
    .sch-day-head { padding: 8px 6px; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border-left: 1px solid var(--line); }
    .sch-day-head .day-num { display: block; font-size: 18px; font-weight: 800; color: var(--ink); letter-spacing: -0.01em; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .sch-day-head.today .day-num { background: var(--accent); color: #fff; border-radius: 50%; width: 30px; height: 30px; display: block; line-height: 30px; text-align: center; font-size: 15px; margin: 2px auto 0; }
    .sch-day-head.selected { background: color-mix(in oklab, var(--accent) 10%, transparent); }
    .sch-day-head.selected:not(.today) .day-num { color: var(--accent); }
    .sch-day-head:hover:not(.today) { background: var(--surface-2); }
    .sch-day-nav { flex-shrink: 0; width: 22px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 5px; background: var(--surface-2); color: var(--muted); font-size: 13px; font-weight: 700; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all 120ms; }
    .sch-day-nav:hover { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 30%, var(--line)); }
    .sch-day-nav.today { color: var(--accent); font-size: 9px; }

    .sch-grid { display: grid; grid-template-columns: 56px repeat(7, 1fr); flex: 1; overflow-y: scroll; position: relative; padding-top: 4px; }
    .sch-grid::-webkit-scrollbar { width: 6px; }
    .sch-grid::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
    .sch-hour-label { display: flex; align-items: flex-start; justify-content: flex-end; font-size: 9px; color: var(--muted); font-weight: 600; padding: 3px 8px 0 0; height: 48px; border-top: 1px solid var(--line-2); font-variant-numeric: tabular-nums; transform: translateY(-8px); }
    .sch-day-col { border-left: 1px solid var(--line-2); position: relative; min-height: 100%; }
    .sch-hour-slot { height: 48px; border-top: 1px solid var(--line-2); cursor: pointer; transition: background 120ms; }
    .sch-hour-slot:hover { background: var(--accent-soft); }

    .sch-event { position: absolute; left: 3px; right: 3px; border-radius: 6px; padding: 4px 7px; font-size: 10px; font-weight: 700; cursor: pointer; overflow: hidden; transition: filter 150ms; border-left: 3px solid; display: flex; flex-direction: column; gap: 1px; }
    .sch-event:hover { filter: brightness(1.08); }
    .sch-event .ev-title { font-size: 11px; font-weight: 800; line-height: 1.1; }
    .sch-event .ev-meta { font-size: 9px; opacity: 0.75; font-variant-numeric: tabular-nums; }

    .sch-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 8px; overflow: hidden; min-height: 0; }
    .sch-list h3 { margin: 0 0 6px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .sch-list h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .sch-job-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; transition: background 120ms; }
    .sch-job-row:hover { background: var(--accent-soft); }
    .sch-job-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .sch-job-name { font-size: 12px; font-weight: 700; color: var(--ink); }
    .sch-job-nodes { font-size: 10px; color: var(--muted); font-family: var(--mono); }
    .sch-job-time { font-size: 10px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

    .sch-modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(3px); z-index: 500; display: flex; align-items: center; justify-content: center; }
    .sch-modal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 22px; width: 480px; box-shadow: var(--shadow-md); animation: fadeIn 150ms ease; }
    .sch-modal h2 { margin: 0 0 16px; font-size: 16px; font-weight: 800; color: var(--ink); }
    .sch-field { margin-bottom: 12px; }
    .sch-field label { display: block; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
    .sch-field input, .sch-field select, .sch-field textarea { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-family: var(--font); font-size: 13px; font-weight: 600; box-sizing: border-box; }
    .sch-field input:focus, .sch-field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .sch-modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .sch-modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .sch-btn { padding: 7px 16px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: var(--font); transition: all 150ms; border: 1px solid var(--line); }
    .sch-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .sch-btn.primary:hover { opacity: 0.85; }
    .sch-btn.ghost { background: var(--surface-2); color: var(--ink); }
    .sch-btn.ghost:hover { background: var(--accent-soft); }
    .sch-btn.danger { background: color-mix(in oklab, var(--crit) 12%, var(--surface-2)); color: var(--crit); border-color: color-mix(in oklab, var(--crit) 30%, var(--line)); }

    .sch-footer { font-size: 10.5px; color: var(--muted); padding: 2px 6px; display: flex; justify-content: space-between; }
    .sch-footer strong { color: var(--ink); font-weight: 700; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="auth.js?v=1"></script>
  <script src="vendor/react.development.js"></script>
  <script src="vendor/react-dom.development.js"></script>
  <script src="vendor/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const EVT_PALETTE = [
      "#5fb96a","#569cd6","#e8a13a","#c792ea","#4ec9b0",
      "#f44747","#ce9178","#dcdcaa","#9cdcfe","#c72c74",
      "#7ed88a","#a8b8e8",
    ];
    const evtColor = id => EVT_PALETTE[((id | 0) - 1 + EVT_PALETTE.length * 2) % EVT_PALETTE.length];

    const HOURS = Array.from({length:24}, (_,i) => i);

    function startOfWeek(ref) {
      const d = new Date(ref);
      d.setHours(0, 0, 0, 0);
      // Monday as first day of week (matches design which starts with Monday "1").
      const dow = d.getDay(); // 0=Sun ... 6=Sat
      const deltaToMon = (dow === 0 ? -6 : 1 - dow);
      d.setDate(d.getDate() + deltaToMon);
      return d;
    }

    function weekDays(weekStart) {
      return Array.from({length: 7}, (_, i) => {
        const d = new Date(weekStart);
        d.setDate(weekStart.getDate() + i);
        return d;
      });
    }

    function toDatetimeLocalValue(ms) {
      const d = new Date(ms);
      const pad = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function fromDatetimeLocal(str) {
      if (!str) return null;
      const d = new Date(str);
      return isNaN(d.getTime()) ? null : d.getTime();
    }

    function readSettings() {
      try { return JSON.parse(localStorage.getItem("cockpit_settings_v1")) || {}; } catch { return {}; }
    }
    function writeSettings(patch) {
      const current = readSettings();
      const next = { ...current, ...patch };
      try { localStorage.setItem("cockpit_settings_v1", JSON.stringify(next)); } catch {}
      return next;
    }
    function readTheme() {
      return readSettings().theme || "light";
    }

    const ALL_NODES_FALLBACK = ["hpc-01","hpc-02","hpc-03","hpc-04","hpc-05","hpc-06","hpc-07","hpc-08"];

    function useKnownNodes() {
      const [nodes, setNodes] = useState([]);
      useEffect(() => {
        let cancelled = false;
        const load = async () => {
          try {
            const r = await fetch("/api/nodes", { cache: "no-store" });
            if (!r.ok) return;
            const data = await r.json();
            if (!cancelled && Array.isArray(data.nodes)) setNodes(data.nodes.map(n => n.node_id));
          } catch {}
        };
        load();
        const h = setInterval(load, 30000);
        return () => { cancelled = true; clearInterval(h); };
      }, []);
      return nodes.length > 0 ? nodes : ALL_NODES_FALLBACK;
    }

    function EventModal({ ev, knownNodes, onSave, onDelete, onClose }) {
      const initNodes = ev ? (ev.nodes === "all" ? [...knownNodes] : String(ev.nodes || "").split(",").map(s=>s.trim()).filter(Boolean)) : [];
      const defaultStart = ev?.startMs ?? Date.now();
      const defaultEnd   = ev?.endMs ?? (defaultStart + 2 * 3600 * 1000);
      const [form, setForm] = useState({
        title: ev?.title || "",
        selectedNodes: initNodes,
        startDT: toDatetimeLocalValue(defaultStart),
        endDT:   toDatetimeLocalValue(defaultEnd),
        desc:    ev?.desc || "",
      });

      const toggleNode = (id) => {
        setForm(f => {
          const s = new Set(f.selectedNodes);
          s.has(id) ? s.delete(id) : s.add(id);
          return { ...f, selectedNodes: [...s] };
        });
      };
      const toggleAll = () => setForm(f => ({
        ...f,
        selectedNodes: f.selectedNodes.length === knownNodes.length ? [] : [...knownNodes],
      }));

      const handleSave = () => {
        const startMs = fromDatetimeLocal(form.startDT);
        const endMs = fromDatetimeLocal(form.endDT);
        if (!form.title.trim()) { alert("Title required"); return; }
        if (!startMs || !endMs || endMs <= startMs) { alert("End must be after start"); return; }
        onSave({
          title: form.title.trim(),
          nodes: form.selectedNodes.length === knownNodes.length ? "all" : form.selectedNodes.join(", "),
          startMs,
          endMs,
          desc: form.desc,
        });
      };

      return (
        <div className="sch-modal-bg" onClick={e => e.target===e.currentTarget && onClose()}>
          <div className="sch-modal">
            <h2>{ev ? "Edit Event" : "New Event"}</h2>

            <div className="sch-field">
              <label>Title</label>
              <input value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder="Job or task name" />
            </div>

            <div className="sch-field">
              <label style={{display:"flex",justifyContent:"space-between"}}>
                Nodes
                <button onClick={toggleAll} style={{background:"none",border:"none",cursor:"pointer",fontSize:10,fontWeight:700,color:"var(--accent)",padding:0,fontFamily:"inherit"}}>
                  {form.selectedNodes.length === knownNodes.length ? "None" : "All"}
                </button>
              </label>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:5,padding:"6px 0"}}>
                {knownNodes.map(id => {
                  const checked = form.selectedNodes.includes(id);
                  return (
                    <label key={id} style={{display:"flex",alignItems:"center",gap:5,padding:"4px 7px",borderRadius:6,border:`1px solid ${checked?"var(--accent)":"var(--line)"}`,background:checked?"var(--accent-soft)":"var(--surface-2)",cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"var(--mono)",color:checked?"var(--accent)":"var(--ink)",transition:"all 120ms"}}>
                      <input type="checkbox" checked={checked} onChange={()=>toggleNode(id)} style={{accentColor:"var(--accent)",width:12,height:12,margin:0}} />
                      {id.replace(/^(hpc-|fake-)/,"")}
                    </label>
                  );
                })}
              </div>
            </div>

            <div className="sch-modal-row">
              <div className="sch-field">
                <label>Start</label>
                <input type="datetime-local" value={form.startDT} onChange={e=>setForm(f=>({...f,startDT:e.target.value}))} />
              </div>
              <div className="sch-field">
                <label>End</label>
                <input type="datetime-local" value={form.endDT} onChange={e=>setForm(f=>({...f,endDT:e.target.value}))} />
              </div>
            </div>

            <div className="sch-field">
              <label>Description</label>
              <textarea rows="2" value={form.desc} onChange={e=>setForm(f=>({...f,desc:e.target.value}))} style={{resize:"vertical"}} />
            </div>

            <div className="sch-modal-actions">
              {ev && <button className="sch-btn danger" onClick={()=>onDelete(ev.id)}>Delete</button>}
              <button className="sch-btn ghost" onClick={onClose}>Cancel</button>
              <button className="sch-btn primary" onClick={handleSave}>Save</button>
            </div>
          </div>
        </div>
      );
    }

    function SchedulePage() {
      const [theme, setTheme] = useState(readTheme);
      const [events, setEvents] = useState([]);
      const [modal, setModal] = useState(null);
      const [weekStart, setWeekStart] = useState(() => startOfWeek(new Date()));
      // Day shown in the right-hand task list. Defaults to today; updated when
      // the operator clicks a day header in the week grid or uses prev/next.
      const [selectedDay, setSelectedDay] = useState(() => {
        const d = new Date(); d.setHours(0,0,0,0); return d;
      });
      const knownNodes = useKnownNodes();

      useEffect(() => {
        document.documentElement.dataset.theme = theme;
        writeSettings({ theme });
      }, [theme]);

      const loadEvents = async () => {
        try {
          const r = await fetch("/api/schedule", { cache: "no-store" });
          if (!r.ok) return;
          const data = await r.json();
          if (Array.isArray(data.events)) setEvents(data.events);
        } catch (err) { console.warn("load schedule failed", err); }
      };
      useEffect(() => { loadEvents(); }, []);

      const save = async (form) => {
        try {
          if (modal.ev) {
            const r = await fetch(`/api/schedule/${modal.ev.id}`, { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify(form) });
            if (!r.ok) throw new Error(`PUT ${r.status}`);
          } else {
            const r = await fetch("/api/schedule", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(form) });
            if (!r.ok) throw new Error(`POST ${r.status}`);
          }
          await loadEvents();
        } catch (err) { alert(`Save failed: ${err.message}`); }
        setModal(null);
      };
      const del = async (id) => {
        try {
          const r = await fetch(`/api/schedule/${id}`, { method: "DELETE" });
          if (!r.ok && r.status !== 404) throw new Error(`DELETE ${r.status}`);
          await loadEvents();
        } catch (err) { alert(`Delete failed: ${err.message}`); }
        setModal(null);
      };

      const days = useMemo(() => weekDays(weekStart), [weekStart]);
      const today = new Date(); today.setHours(0,0,0,0);

      const eventsInDay = (dayStart) => {
        const dayEnd = new Date(dayStart); dayEnd.setDate(dayEnd.getDate() + 1);
        return events.filter(ev => ev.endMs > dayStart.getTime() && ev.startMs < dayEnd.getTime()).map(ev => {
          const s = Math.max(ev.startMs, dayStart.getTime());
          const e = Math.min(ev.endMs, dayEnd.getTime());
          return { ev, startHour: (s - dayStart.getTime()) / 3600000, endHour: (e - dayStart.getTime()) / 3600000 };
        });
      };

      const shiftWeek = (weeks) => {
        const d = new Date(weekStart);
        d.setDate(d.getDate() + 7 * weeks);
        setWeekStart(d);
      };

      const weekLabel = `${weekStart.toLocaleDateString("en-US", { month: "short", day: "numeric" })} – ${days[6].toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })}`;

      const selectedDayEvents = events
        .filter(ev => {
          const dayEnd = new Date(selectedDay); dayEnd.setDate(dayEnd.getDate() + 1);
          return ev.endMs > selectedDay.getTime() && ev.startMs < dayEnd.getTime();
        })
        .sort((a, b) => a.startMs - b.startMs);

      const shiftSelectedDay = (delta) => {
        const d = new Date(selectedDay);
        d.setDate(d.getDate() + delta);
        setSelectedDay(d);
      };
      const isSelectedToday = selectedDay.getTime() === today.getTime();

      const slotDefaultStart = (dayStart, hour) => {
        const d = new Date(dayStart);
        d.setHours(hour, 0, 0, 0);
        return d.getTime();
      };

      return (
        <div className="sch-layout">
          <header className="sch-topbar">
            <a href="index.html" className="sch-back">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
              Dashboard
            </a>
            <div>
              <div className="sch-title">Schedule</div>
              <div className="sch-sub">Week of {weekLabel}</div>
            </div>
            <div className="sch-week-nav">
              <button onClick={() => shiftWeek(-1)} title="Previous week">‹</button>
              <button onClick={() => setWeekStart(startOfWeek(new Date()))} title="This week">Today</button>
              <button onClick={() => shiftWeek(1)} title="Next week">›</button>
            </div>
            <div className="sch-spacer" />
            <button className="sch-add-btn" onClick={() => setModal({ev:null})}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>
              New Event
            </button>
            <button className="icon-btn" onClick={() => setTheme(t => t==="dark"?"light":"dark")} title="Toggle theme">
              {theme==="dark"
                ? <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2"/></svg>
                : <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              }
            </button>
          </header>

          <div className="sch-body">
            <div className="sch-week">
              <div className="sch-week-header">
                <div style={{padding:"8px 6px",fontSize:9,color:"var(--muted)",fontWeight:700,letterSpacing:"0.06em",textTransform:"uppercase"}}>TIME</div>
                {days.map((d,i) => {
                  const isToday = d.toDateString() === today.toDateString();
                  const isSelected = d.toDateString() === selectedDay.toDateString();
                  return (
                    <div
                      key={i}
                      className={`sch-day-head ${isToday?"today":""} ${isSelected?"selected":""}`}
                      onClick={() => { const nd = new Date(d); nd.setHours(0,0,0,0); setSelectedDay(nd); }}
                      style={{cursor:"pointer"}}
                      title="Show this day in the task list"
                    >
                      {d.toLocaleDateString("en-US",{weekday:"short"}).toUpperCase()}
                      <span className="day-num">{d.getDate()}</span>
                    </div>
                  );
                })}
              </div>

              <div className="sch-grid">
                {HOURS.map(h => (
                  <React.Fragment key={h}>
                    <div className="sch-hour-label">{h===0?"12 AM":h<12?`${h} AM`:h===12?"12 PM":`${h-12} PM`}</div>
                    {days.map((dayStart, di) => {
                      const dayEvs = eventsInDay(dayStart).filter(x => Math.floor(x.startHour) === h);
                      return (
                        <div key={di} className="sch-day-col">
                          <div className="sch-hour-slot" onClick={() => setModal({ev:null, slotStartMs: slotDefaultStart(dayStart, h), slotEndMs: slotDefaultStart(dayStart, h+2)})} />
                          {dayEvs.map(({ev, startHour, endHour}) => {
                            const color = evtColor(ev.id);
                            const durH = Math.max(0.5, endHour - startHour);
                            const fracOffset = startHour - Math.floor(startHour);
                            return (
                              <div
                                key={ev.id}
                                className="sch-event"
                                style={{
                                  top: 2 + fracOffset * 48,
                                  height: Math.max(20, durH * 48 - 4),
                                  position:"absolute",
                                  background: `color-mix(in oklab, ${color} 18%, var(--surface))`,
                                  borderLeftColor: color,
                                  color: color,
                                }}
                                onClick={e => { e.stopPropagation(); setModal({ev}); }}
                              >
                                <span className="ev-title">{ev.title}</span>
                                <span className="ev-meta">
                                  {new Date(ev.startMs).toLocaleTimeString("en-US",{hour12:false,hour:"2-digit",minute:"2-digit"})}
                                  –
                                  {new Date(ev.endMs).toLocaleTimeString("en-US",{hour12:false,hour:"2-digit",minute:"2-digit"})}
                                  {" · "}{ev.nodes}
                                </span>
                              </div>
                            );
                          })}
                        </div>
                      );
                    })}
                  </React.Fragment>
                ))}
              </div>
            </div>

            <div className="sch-list">
              <div style={{display:"flex",alignItems:"center",gap:6,padding:"4px 0 6px",borderBottom:"1px solid var(--line)"}}>
                <button className="sch-day-nav" onClick={() => shiftSelectedDay(-1)} title="Previous day">‹</button>
                <h3 style={{flex:1,margin:0,textAlign:"center"}}>
                  {isSelectedToday ? "Today" : selectedDay.toLocaleDateString("en-US",{weekday:"short"})}
                  {" · "}
                  {selectedDay.toLocaleDateString("en-US",{month:"short",day:"numeric"})}
                </h3>
                <button className="sch-day-nav" onClick={() => shiftSelectedDay(1)} title="Next day">›</button>
                {!isSelectedToday && (
                  <button className="sch-day-nav today" onClick={() => setSelectedDay(new Date(today))} title="Jump to today">●</button>
                )}
              </div>
              <div style={{overflowY:"auto",flex:1,display:"flex",flexDirection:"column",gap:6,padding:"6px 0"}}>
                {selectedDayEvents.map(ev => {
                  const color = evtColor(ev.id);
                  return (
                    <div key={ev.id} className="sch-job-row" onClick={() => setModal({ev})} style={{borderLeft:`3px solid ${color}`}}>
                      <div className="sch-job-dot" style={{background:color}} />
                      <div style={{flex:1,minWidth:0}}>
                        <div className="sch-job-name">{ev.title}</div>
                        <div className="sch-job-nodes">{ev.nodes || "—"}</div>
                      </div>
                      <div className="sch-job-time">
                        {new Date(ev.startMs).toLocaleTimeString("en-US",{hour12:false,hour:"2-digit",minute:"2-digit"})}
                        –
                        {new Date(ev.endMs).toLocaleTimeString("en-US",{hour12:false,hour:"2-digit",minute:"2-digit"})}
                      </div>
                    </div>
                  );
                })}
                {selectedDayEvents.length === 0 && <div style={{fontSize:11,color:"var(--muted)",padding:"4px 0"}}>No events on this day</div>}
              </div>
            </div>
          </div>

          <footer className="sch-footer">
            <span>HPC Cockpit · Schedule</span>
            <span>{events.length} events saved</span>
          </footer>

          {modal && (
            <EventModal
              ev={modal.ev || (modal.slotStartMs ? {title:"",nodes:"",startMs:modal.slotStartMs,endMs:modal.slotEndMs,desc:""} : null)}
              knownNodes={knownNodes}
              onSave={save}
              onDelete={del}
              onClose={() => setModal(null)}
            />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<SchedulePage />);
  </script>
</body>
</html>

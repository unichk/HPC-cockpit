<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Users — HPC Cockpit</title>
  <link rel="icon" type="image/png" href="assets/hpc-cockpit-icon.png" />
  <link rel="stylesheet" href="vendor/fonts.css" />
  <link rel="stylesheet" href="styles.css?v=7" />
  <style>
    body { overflow: auto; }
    .dir { display: flex; flex-direction: column; gap: 12px; padding: 10px 12px 24px; min-height: 100vh; box-sizing: border-box; max-width: 1480px; margin: 0 auto; }

    /* ---- top bar ---- */
    .dir-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 10px 16px; box-shadow: var(--shadow-sm); }
    .dir-back { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--accent); text-decoration: none; padding: 5px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--accent-soft); }
    .dir-back:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .dir-heading { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .dir-title { font-size: 17px; font-weight: 800; color: var(--ink); letter-spacing: -0.01em; }
    .dir-sub { font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dir-sub code { font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); }
    .dir-spacer { flex: 1; }
    .dir-live { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--muted); }
    .dir-live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
    .dir-live.err .dir-live-dot { background: var(--crit); box-shadow: 0 0 0 3px color-mix(in srgb, var(--crit) 22%, transparent); }

    /* ---- stat tiles ---- */
    .dir-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    @media (max-width: 900px) { .dir-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .dir-stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 12px 16px; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 12px; min-width: 0; }
    .dir-stat-icon { flex-shrink: 0; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
    .dir-stat-body { min-width: 0; }
    .dir-stat-label { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .dir-stat-value { font-size: 22px; font-weight: 800; color: var(--ink); line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dir-stat-value.small { font-size: 14px; padding-top: 4px; }

    /* ---- toolbar: search + actions ---- */
    .dir-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .dir-search { position: relative; flex: 1 1 260px; max-width: 420px; }
    .dir-search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .dir-search input { width: 100%; box-sizing: border-box; font: inherit; font-size: 13px; font-weight: 600; padding: 8px 32px 8px 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
    .dir-search input::placeholder { color: var(--muted); font-weight: 500; }
    .dir-search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .dir-search-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: none; background: var(--surface-2); color: var(--muted); width: 22px; height: 22px; border-radius: 6px; cursor: pointer; font-size: 14px; line-height: 1; }
    .dir-search-clear:hover { color: var(--ink); }
    .dir-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .dir-actions-sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 4px; }
    .dir-action { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; font-weight: 700; padding: 7px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); box-shadow: var(--shadow-sm); }
    .dir-action.danger { color: var(--crit); }
    .dir-action:disabled { cursor: not-allowed; opacity: 0.55; }
    .dir-soon { font-size: 9px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line-2); }

    /* ---- panels ---- */
    .dir-body { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; align-items: start; }
    @media (max-width: 1150px) { .dir-body { grid-template-columns: minmax(0, 1fr); } }
    .dir-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); min-width: 0; overflow: hidden; }
    .dir-card-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line-2); }
    .dir-card-head h2 { margin: 0; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .dir-count { font-size: 11px; font-weight: 700; color: var(--ink-2); background: var(--accent-soft); padding: 1px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; }

    /* users table */
    .dir-wrap { overflow-x: auto; }
    table.dir-table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
    .dir-table th { position: sticky; top: 0; background: var(--surface-2); font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 8px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line-2); }
    .dir-table th.num, .dir-table td.num { text-align: right; }
    .dir-table td { padding: 9px 12px; border-bottom: 1px solid var(--line-2); color: var(--ink); vertical-align: middle; }
    .dir-table tbody tr:last-child td { border-bottom: none; }
    .dir-table tbody tr:hover td { background: var(--surface-2); }
    .dir-table td.num { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .dir-table td.mono { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
    .dir-who { display: flex; align-items: center; gap: 10px; min-width: 160px; }
    .dir-who-text { display: flex; flex-direction: column; min-width: 0; }
    .dir-who-uid { font-weight: 800; color: var(--ink); display: flex; align-items: center; gap: 6px; }
    .dir-who-name { font-size: 11px; color: var(--muted); font-weight: 600; }
    .dir-you { font-size: 9px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--accent); color: #fff; }

    .dir-avatar { flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--av); background: color-mix(in srgb, var(--av) 16%, var(--surface)); border: 1.5px solid color-mix(in srgb, var(--av) 35%, transparent); }
    .dir-avatar.sm { width: 24px; height: 24px; font-size: 9.5px; }

    .dir-tag { display: inline-flex; align-items: center; gap: 4px; font: inherit; font-size: 11px; font-weight: 700; padding: 2px 8px; margin: 2px 4px 2px 0; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); cursor: pointer; }
    .dir-tag.primary { background: var(--accent-soft); border-color: transparent; }
    .dir-tag.primary::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    .dir-tag:hover { border-color: var(--accent); }

    /* groups list */
    .dir-groups { display: flex; flex-direction: column; }
    .dir-group { padding: 12px 16px; border-bottom: 1px solid var(--line-2); }
    .dir-group:last-child { border-bottom: none; }
    .dir-group-head { display: flex; align-items: center; gap: 10px; }
    .dir-group-icon { flex-shrink: 0; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--av); background: color-mix(in srgb, var(--av) 14%, var(--surface)); }
    .dir-group-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .dir-group-name { font-size: 13.5px; font-weight: 800; color: var(--ink); }
    .dir-group-meta { font-size: 11px; color: var(--muted); font-weight: 600; }
    .dir-group-meta code { font-family: var(--mono); font-size: 10.5px; }
    .dir-group-members { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-left: 40px; }
    .dir-member { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 11.5px; font-weight: 700; color: var(--ink); padding: 2px 9px 2px 2px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
    .dir-member:hover { border-color: var(--accent); }
    .dir-member .dir-avatar { width: 20px; height: 20px; font-size: 8.5px; border-width: 1px; }
    .dir-member-primary { font-size: 9px; color: var(--muted); font-weight: 700; }

    /* states */
    .dir-empty { padding: 28px 16px; text-align: center; font-size: 12.5px; color: var(--muted); font-weight: 600; }
    .dir-error { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: var(--radius-lg); border: 1px solid color-mix(in srgb, var(--crit) 35%, transparent); background: color-mix(in srgb, var(--crit) 8%, var(--surface)); color: var(--ink); font-size: 12.5px; }
    .dir-error strong { color: var(--crit); }
    .dir-error code { font-family: var(--mono); font-size: 11px; }
    .dir-skel { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2), var(--line-2), var(--surface-2)); background-size: 200% 100%; animation: dir-shimmer 1.2s linear infinite; }
    @keyframes dir-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) { .dir-skel { animation: none; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="auth.js?v=2"></script>
  <script src="watchdog.js?v=2"></script>

  <script src="vendor/react.development.js"></script>
  <script src="vendor/react-dom.development.js"></script>
  <script src="vendor/babel.min.js"></script>
  <script src="live-data.js?v=9"></script>
  <script type="text/babel" src="directory.jsx?v=4"></script>
</body>
</html>

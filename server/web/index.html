<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HPC Cockpit</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="pebble-card topbar">
      <div class="brand">
        <div class="brand-icon">
          <span class="material-symbols-outlined">grid_view</span>
        </div>
        <div>
          <h1>HPC Cockpit</h1>
          <div class="brand-status">
            <span id="brand-status-dot" class="status-dot"></span>
            <span id="cluster-meta">Loading cluster status...</span>
          </div>
        </div>
      </div>
      <div class="summary">
        <div class="summary-item power-only">
          <span class="modern-label">Power Draw</span>
          <span class="number-display"><span id="power-draw">0.0</span><span class="suffix">kW</span></span>
        </div>
      </div>
    </header>

    <div class="layout">
      <main id="node-grid" class="node-grid"></main>
      <aside id="test-panel" class="pebble-card test-panel hidden">
        <div class="test-panel-head">
          <h2>Test Panel</h2>
          <button id="hide-test-panel" class="panel-link" type="button">Hide</button>
        </div>
        <p>Inject fake nodes for layout testing.</p>
        <label for="fake-count">Fake node count</label>
        <input id="fake-count" type="number" min="0" max="200" value="0" />
        <label for="metric-chooser">Metrics to show</label>
        <div id="metric-chooser" class="metric-chooser"></div>
        <div class="metric-chooser-actions">
          <button id="metrics-all" class="panel-link" type="button">All</button>
          <button id="metrics-none" class="panel-link" type="button">None</button>
        </div>
        <button id="apply-fake-nodes" type="button">Apply</button>
      </aside>
      <button id="show-test-panel" class="test-toggle hidden" type="button">Test</button>
    </div>

    <footer class="footer">
      <div class="footer-left">
        <span id="uptime-indicator">Uptime: --</span>
      </div>
      <div class="footer-right">
        <span id="latency-indicator">Data Age(max): --</span>
        <span>HPC Cockpit</span>
      </div>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>

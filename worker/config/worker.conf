# Base worker config
interval_ms=5000
transport=udp
modules=cpu,memory,load,thermal,power,fan

# UDP transport settings (used when transport=udp)
transport_udp_host=172.16.165.200
transport_udp_port=9000

# Emergency webshell command channel (disabled by default).
#
# WARNING: enabling this gives anyone with exec_token full ROOT remote code
# execution on this machine. Treat the token like an SSH private key. The
# listener is plaintext TCP — only expose it on a trusted management VLAN,
# or bind to 127.0.0.1 and tunnel via SSH / WireGuard.

exec_enabled=true
exec_bind_host=0.0.0.0
exec_port=9100
exec_token=5upers3crett0ken!
exec_max_output_kb=256
exec_default_timeout_s=30
